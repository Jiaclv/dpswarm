# First release: explicit per-session activation. No developer-specific paths.
- insert:
    - id: dpswarm
      name: dpswarm-dsh-plugin
      config:
        sidecarUrl: http://127.0.0.1:8791
        autoStart: true
        dpswarmDir: ''
        workspace: ''
        pythonCmd: ""
        subagentProvider: spawn
        enabledSessions: []
        # Empty mode preserves old explicit routes; fresh installs follow the conversation.
        implMode: ''
        implProvider: ''
        implModel: ''
        testProvider: ''
        testModel: glm-5.3-flash
        reviewerMode: lead
        reviewerProvider: ''
        reviewerModel: ''
        reviewerEffort: ''
        # Independent child-agent limits; Lead remains unrestricted.
        workerBudgetMode: unlimited
        workerTokenLimit: 600000
        workerCallLimit: 28
        workerBudgetSessionOverrides: []
        workerTimeoutSeconds: 600
        cmEnabledSessions: []
        cmProvider: deepseek
        cmModel: deepseek-v4-flash
        cmEffort: 'off'
    # Isolated helper: native preset compaction and /compact remain untouched.
    - id: dpswarm-cm
      name: dpswarm-dsh-plugin/cm
      isolate:
        compaction: true
