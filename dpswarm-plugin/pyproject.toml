[project]
name = "dpswarm"
version = "0.1.0"
description = "DPswarm: multi-model agent team orchestration control plane (mechanism doc implementation)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dpswarm = "dpswarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dpswarm*"]

[tool.setuptools.package-data]
dpswarm = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
