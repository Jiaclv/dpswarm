[project]
name = "dpswarm"
version = "0.1.0"
description = "Transactional control plane for multi-model agent collaboration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Jiaclv/dpswarm"
Issues = "https://github.com/Jiaclv/dpswarm/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
lg = ["langgraph>=1.0"]

[project.scripts]
dpswarm = "dpswarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dpswarm*"]

[tool.setuptools.package-data]
dpswarm = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
