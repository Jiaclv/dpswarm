<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DPSwarm 控制面板</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1216;--panel:#171c22;--line:#262d36;--fg:#d8dee6;--dim:#8b95a1;
        --acc:#4f9cf9;--ok:#3ecf8e;--warn:#f2b544;--bad:#ef6b6b;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{font-size:16px;margin:0}
  header .rev{color:var(--dim);font-family:var(--mono)}
  header button{margin-left:auto}
  main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px 20px;max-width:1280px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat b{display:block;font-size:18px;font-family:var(--mono)}
  .stat span{color:var(--dim);font-size:12px}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:13px}
  label span{color:var(--dim)}
  input,select{width:130px;background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:13px}
  input:focus,select:focus{outline:1px solid var(--acc)}
  button{background:var(--acc);border:0;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:13px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  button.danger{background:var(--bad)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th{color:var(--dim);text-align:left;font-weight:400;padding:4px 8px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid #1d232b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px}
  .t-accepted,.t-active,.t-completed{background:#123527;color:var(--ok)}
  .t-submitted,.t-finalizing,.t-settlement,.t-cutoff{background:#33290f;color:var(--warn)}
  .t-rejected,.t-failed,.t-blocked,.t-escalated,.t-timed-out{background:#3a1c1c;color:var(--bad)}
  .t-none,.t-open,.t-provisioning{background:#1e2732;color:var(--dim)}
  .t-terminated,.t-aborted-finalize{background:#2a2f36;color:var(--dim)}
  #events{max-height:300px;overflow:auto;font-family:var(--mono);font-size:12px}
  .ev{padding:3px 6px;border-bottom:1px solid #1d232b;display:flex;gap:8px}
  .ev .k{color:var(--acc);min-width:180px}
  .ev .p{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .ev.new{animation:flash 1s}
  @keyframes flash{from{background:#1d3a5f}}
  #msg{position:fixed;bottom:18px;right:18px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:10px 16px;font-size:13px;display:none;z-index:9;max-width:420px}
  #msg.err{border-color:var(--bad);color:var(--bad)}
  #msg.ok{border-color:var(--ok);color:var(--ok)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  details pre{font-size:12px;color:var(--dim);overflow:auto;max-height:260px}
  @media(max-width:960px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>DPSwarm 控制面板</h1>
  <span class="rev">spec rev <b id="rev">-</b></span>
  <span class="rev">graph <b id="grev">0</b></span>
  <button class="ghost" onclick="tickNow()">tick</button>
  <button class="danger" onclick="terminal()">停止任务树</button>
</header>
<main>
  <!-- 左列：参数 + 指令 + 任务 -->
  <div>
    <div class="card" style="margin-bottom:14px">
      <h2>RootExecutionSpec（发布新 revision · §2.1）</h2>
      <div id="specForm"></div>
      <div class="row" style="margin-top:10px">
        <button onclick="publishSpec()">发布新 revision</button>
        <span style="color:var(--dim);font-size:12px">降容不强杀在途，只停新准入</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <h2>人工指令（§9.2 三类）</h2>
      <div class="row">
        <select id="wakeNode" style="width:150px"></select>
        <button class="ghost" onclick="wakeup()">wakeup（通知不带状态）</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" onclick="sealRoot()">封存 root（三段式）</button>
      </div>
    </div>
    <div class="card">
      <h2>提交演示任务</h2>
      <input id="task" style="width:100%" placeholder="任务描述，如：清洗日志并汇总统计" value="整理日志并汇总统计">
      <div class="row" style="margin-top:8px">
        <button onclick="runDefault()">默认演示（Mock·single）</button>
        <button class="ghost" onclick="runFission()">裂变演示（Mock·3片）</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input id="model" placeholder="PROVIDER/MODEL（OpenAI 兼容）" style="width:200px">
        <button class="ghost" onclick="runModel()">真模型</button>
      </div>
    </div>
  </div>

  <!-- 右列：状态 + 表格 + 事件 + 观测 -->
  <div>
    <div class="card" style="margin-bottom:14px">
      <h2>运行状态</h2>
      <div class="stats" id="stats"></div>
      <div class="grid2">
        <div>
          <h2 style="font-size:12px">Work Items</h2>
          <table><thead><tr><th>id</th><th>kind</th><th>depth</th><th>state</th><th>att</th></tr></thead>
          <tbody id="items"></tbody></table>
        </div>
        <div>
          <h2 style="font-size:12px">Nodes / Teams</h2>
          <table><thead><tr><th>id</th><th>role</th><th>life</th><th>blk</th><th>ep</th></tr></thead>
          <tbody id="nodes"></tbody></table>
          <table style="margin-top:8px"><thead><tr><th>team</th><th>lead</th><th>cap</th><th>seal</th></tr></thead>
          <tbody id="teams"></tbody></table>
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <h2>事件流（唯一真源 · §9.1）</h2>
      <div id="events"></div>
    </div>
    <div class="card">
      <h2>观测汇总（§4 全账 / §6 经济性）</h2>
      <details><summary style="cursor:pointer;color:var(--dim)">展开 JSON</summary>
        <pre id="obs"></pre></details>
    </div>
  </div>
</main>
<div id="msg"></div>

<script>
/* token 由 sidecar 在 serve 时替换注入，勿在此硬编码真实值 */
const DPSWARM_TOKEN = '{{DPSWARM_TOKEN}}';
const SPEC_FIELDS = [
  ["max_open_work_items","开放 worker 槽上限",1,32],
  ["max_active_node_points","节点点数容量",1,256],
  ["subteam_point_ratio","子 Team 点数比例",0.1,0.9],
  ["max_depth","拓扑深度（agent 层级）",1,4],
  ["max_team_workers","裂变规模（同时存活）",1,8],
  ["max_attempts","attempt 上限（首次+重试）",1,5],
  ["deadline_seconds","树级 deadline 秒（空=关）",0,86400],
  ["node_wallclock_timeout","单节点超时秒",1,86400],
  ["root_acceptance_mode","root 验收模式",0,0],
];
let spec = null;

function msg(text, ok=true){
  const m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err'; m.style.display = 'block';
  clearTimeout(m._t); m._t = setTimeout(()=>m.style.display='none', 3500);
}
async function api(path, body){
  const headers = { 'Authorization': 'Bearer ' + DPSWARM_TOKEN };
  const opts = { headers };
  if (body){ opts.method = 'POST'; headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error + (j.message ? ' — ' + j.message : '') || r.status);
  return j;
}
/* 渲染一律走 DOM API 构建节点：事件载荷来自外部可写源，禁止 HTML 字符串拼接 */
function tag(v){
  const s = document.createElement('span');
  s.className = 'tag t-' + (v ?? 'none');
  s.textContent = v ?? '—';
  return s;
}
function stat(content, label){
  const d = document.createElement('div');
  d.className = 'stat';
  const b = document.createElement('b');
  if (typeof content === 'string') b.textContent = content; else b.append(content);
  const sp = document.createElement('span');
  sp.textContent = label;
  d.append(b, sp);
  return d;
}
function makeRow(cells){
  const tr = document.createElement('tr');
  for (const c of cells){
    const td = document.createElement('td');
    if (c.span) td.setAttribute('colspan', c.span);
    if (c.title) td.setAttribute('title', c.title);
    if (c.node) td.append(c.node); else td.textContent = c.text;
    tr.append(td);
  }
  return tr;
}

function renderSpec(){
  const f = document.getElementById('specForm');
  f.textContent = '';
  for (const [k,label] of SPEC_FIELDS){
    const v = spec[k];
    const lab = document.createElement('label');
    const sp = document.createElement('span');
    sp.textContent = label;
    lab.append(sp);
    if (k === 'root_acceptance_mode'){
      const sel = document.createElement('select');
      sel.setAttribute('data-k', k);
      for (const val of ['lead','human']){
        const o = document.createElement('option');
        o.value = val; o.textContent = val;
        sel.append(o);
      }
      lab.append(sel);
    }else{
      const inp = document.createElement('input');
      inp.setAttribute('data-k', k);
      inp.type = 'number';
      inp.step = typeof v === 'number' && !Number.isInteger(v) ? '0.05' : '1';
      inp.value = v ?? '';
      inp.placeholder = '关闭';
      lab.append(inp);
    }
    f.append(lab);
  }
  const sel = f.querySelector(`[data-k=root_acceptance_mode]`);
  if (sel) sel.value = spec.root_acceptance_mode;
}

async function refresh(){
  try{
    const s = await api('/api/status');
    spec = s.spec;
    document.getElementById('rev').textContent = s.spec.revision;
    document.getElementById('grev').textContent = s.snapshot.graph_revision;
    renderSpec();
    const p = s.snapshot;
    const stats = document.getElementById('stats');
    stats.textContent = '';
    stats.append(
      stat(p.open_worker_slots_used + '/' + spec.max_open_work_items, 'worker 槽'),
      stat(p.active_points + '/' + spec.max_active_node_points, '节点点数'),
      stat(String(Object.keys(p.work_items).length), 'work items'),
      stat(String(Object.keys(p.nodes).length), 'nodes'));
    for (const [t,ph] of Object.entries(p.seal_phase)) stats.append(stat(tag(ph), 'seal · ' + t));
    const items = document.getElementById('items');
    items.textContent = '';
    const itemRows = Object.entries(p.work_items);
    if (!itemRows.length) items.append(makeRow([{text:'—', span:5}]));
    for (const [id,w] of itemRows) items.append(makeRow([
      {text:id.slice(0,12), title:id},
      {text:w.kind},
      {text:w.depth},
      {node:tag(w.acceptance)},
      {text:w.attempt},
    ]));
    const nodes = document.getElementById('nodes');
    nodes.textContent = '';
    const nodeRows = Object.entries(p.nodes);
    if (!nodeRows.length) nodes.append(makeRow([{text:'—', span:5}]));
    for (const [id,n] of nodeRows) nodes.append(makeRow([
      {text:id.slice(0,12), title:id},
      {text:n.role},
      {node:tag(n.lifecycle)},
      n.blocked === 'none' ? {text:'—'} : {node:tag(n.blocked)},
      {text:n.epoch},
    ]));
    const evs = await api('/api/events?limit=50');
    const box = document.getElementById('events');
    const top = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.textContent = '';
    const frag = document.createDocumentFragment();
    for (const e of evs.events.slice().reverse()){
      const div = document.createElement('div');
      div.className = 'ev';
      const k = document.createElement('span');
      k.className = 'k'; k.textContent = e.kind;
      const pl = document.createElement('span');
      pl.className = 'p'; pl.textContent = JSON.stringify(e.payload).slice(0,160);
      div.append(k, pl);
      frag.append(div);
    }
    box.append(frag);
    const o = await api('/api/observation');
    document.getElementById('obs').textContent = JSON.stringify(o, null, 1);
  }catch(e){ msg('刷新失败: '+e.message, false); }
}

async function publishSpec(){
  const out = {};
  document.querySelectorAll('#specForm [data-k]').forEach(el => {
    let v = el.value;
    if (el.dataset.k === 'root_acceptance_mode'){ out[el.dataset.k] = v; return; }
    if (v === ''){ if (el.dataset.k === 'deadline_seconds') out[el.dataset.k] = null; return; }
    const num = Number(v);
    if (Number.isFinite(num)) out[el.dataset.k] = num;
  });
  try{
    const r = await api('/api/spec', out);
    msg(`已发布 revision ${r.revision}（事件 #${r.event_seq}）`);
    refresh();
  }catch(e){ msg('发布失败: '+e.message, false); }
}
async function terminal(){
  if (!confirm('终态指令：停止任务树（§9.2 terminal）？')) return;
  try{ await api('/api/directive', {kind:'terminal', payload:{scope:'root'}}); msg('terminal 指令已入链'); refresh(); }
  catch(e){ msg(e.message, false); }
}
async function wakeup(){
  const n = document.getElementById('wakeNode').value;
  if (!n) return msg('无节点可选', false);
  try{ await api('/api/directive', {kind:'immediate', payload:{op:'wakeup', node_id:n, about:'panel'}}); msg('wakeup 已发（不带状态）'); refresh(); }
  catch(e){ msg(e.message, false); }
}
async function sealRoot(){
  if (!confirm('封存 root（准入截止→结算→完结，§9.6）？')) return;
  try{ const r = await api('/api/seal', {team:'root'}); msg('封存完成: ' + r.phase); refresh(); }
  catch(e){ msg(e.message, false); }
}
async function tickNow(){ try{ await api('/api/tick'); refresh(); }catch(e){ msg(e.message,false);} }
async function runDefault(){ await runTask(null); }
async function runFission(){
  await runTask({mock_script:[
    {text:'{"action":"fission","route":{"provider":"mock","model":"b-kimi"},"subtasks":["分片A","分片B","分片C"]}'},
    {text:'WORKER-OUTPUT'},
    {text:'{"verdict":"accept","verdict_reason":"ok"}'},
  ]});
}
async function runModel(){
  const m = document.getElementById('model').value.trim();
  if (!m) return msg('填 PROVIDER/MODEL', false);
  await runTask({model:m});
}
async function runTask(extra){
  const task = document.getElementById('task').value || '示例任务';
  try{
    const r = await api('/api/task', {task, ...extra});
    msg(`任务完成: ${r.result.actions.join(' → ')}`);
    refresh();
  }catch(e){ msg('任务失败: '+e.message, false); }
}

/* 填充 wakeup 节点下拉 */
new MutationObserver(()=>{
  const sel = document.getElementById('wakeNode');
  const nodes = document.querySelectorAll('#nodes tr td:first-child');
  const cur = sel.value;
  sel.textContent = '';
  const head = document.createElement('option');
  head.value = ''; head.textContent = '选择节点…';
  sel.append(head);
  for (const td of nodes){
    const o = document.createElement('option');
    o.value = td.title;
    o.textContent = td.textContent;
    sel.append(o);
  }
  sel.value = cur;
}).observe(document.getElementById('nodes'), {childList:true});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
