<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<!--
  ============================================================================
  pelican-bicycle.html — 一个完全独立、离线的 HTML 文件。
  场景 100% 由内联 SVG 矢量图形绘制（无位图、无 canvas、无外部资源）。

  动画分层：
    · SMIL  (<animateTransform> / <animate>) —— 与机械结构直接联动的部分，
      保证曲柄、车轮、双腿永远严格同步：
        曲柄 1 转 = 1.6 s；车轮 1 转 = 0.8 s（传动比 2.0）
        双腿踩踏 = 用 17 个关键帧做二连杆 IK 反解，脚踝精确落在脚踏上
    · CSS   (@keyframes) —— 车身起伏、翅膀、围巾、云、太阳、地面滚动、链条

  速度自洽（无缝循环的数学依据，见文件末尾注释）：
    车轮半径 72，周长 = 2π·72 = 452.389 px
    车轮 0.8 s 转 1 圈  =>  地面线速度 = 452.389 / 0.8 = 565.487 px/s
    地面虚线 tile = 周长 / 4 = 113.097 px  =>  每 0.2 s 走一格（565.487 px/s）
    链条线速度 = 曲柄角速度 × 链轮半径 = (2π/1.6) × 20 = 78.540 px/s
    链条虚线 tile = 31.416 px        =>  每 0.4 s 走一格
    远山视差 = 地面速度 / 8          =>  tile 400 px 用 5.659 s
  ============================================================================
-->
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0b1016;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* viewBox 缩放：任意窗口尺寸下等比完整显示，不裁切 */
  #scene { display: block; width: 100vw; height: 100vh; }

  /* ---------------------------------------------------------------- 车身起伏
     每个踩踏周期（1.6 s）起伏两次，因此周期 0.8 s */
  @keyframes bodyBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .pelican-bob { animation: bodyBob .8s ease-in-out infinite; }

  /* 头部跟随，延迟一点点做随动感（负延迟不影响循环的无缝性） */
  @keyframes headBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.2px); }
  }
  .pelican-head {
    animation: headBob .8s ease-in-out infinite;
    animation-delay: -0.18s;
  }

  /* 近侧翅膀：肩部为轴轻微扇动，翅尖始终搭在车把上 */
  @keyframes wingFlex {
    0%, 100% { transform: rotate(-2.4deg); }
    50%      { transform: rotate(2.4deg); }
  }
  .pelican-wing {
    transform-box: view-box;
    transform-origin: 396px 138px;
    animation: wingFlex 1.6s ease-in-out infinite;
  }

  /* 远侧收拢的翅膀：轻轻抖动 */
  @keyframes wingFlutter {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(4.5deg); }
  }
  .far-wing {
    transform-box: view-box;
    transform-origin: 300px 146px;
    animation: wingFlutter .8s ease-in-out infinite;
  }

  /* 围巾两条飘带，周期不同，均严格回到起点 => 无缝 */
  @keyframes scarfA {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50%      { transform: rotate(8deg) translateY(-4px); }
  }
  @keyframes scarfB {
    0%, 100% { transform: rotate(5deg) translateY(2px); }
    50%      { transform: rotate(-7deg) translateY(-3px); }
  }
  .scarf-a {
    transform-box: view-box;
    transform-origin: 392px 112px;
    animation: scarfA 1.2s ease-in-out infinite;
  }
  .scarf-b {
    transform-box: view-box;
    transform-origin: 390px 124px;
    animation: scarfB 1.6s ease-in-out infinite;
  }

  /* 眨眼：5 s 一次，眼皮从眼睛上缘向下扫过 */
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    95%, 97%      { transform: scaleY(1); }
  }
  .eye-lid {
    transform-box: view-box;
    transform-origin: 488px 60px;
    animation: blink 5s linear infinite;
  }

  /* 云：整层沿 x 平移自己的重复周期（1000 px），首尾完全重合 => 无缝循环 */
  @keyframes cloudDriftA { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
  @keyframes cloudDriftB { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
  .clouds-a { animation: cloudDriftA 40s linear infinite; }
  .clouds-b { animation: cloudDriftB 26s linear infinite; }

  /* 太阳光芒脉动 */
  @keyframes sunPulse {
    0%, 100% { transform: scale(1);    opacity: .40; }
    50%      { transform: scale(1.06); opacity: .85; }
  }
  .sun-rays {
    transform-box: view-box;
    transform-origin: 108px 74px;
    animation: sunPulse 6s ease-in-out infinite;
  }

  /* 地面滚动：每 0.2 s 精确走过一个 113.097 px 的 tile。
     虚线整体向路径起点（左）移动 = 自行车向右前进。 */
  @keyframes groundA { from { stroke-dashoffset: 0; }      to { stroke-dashoffset: 113.097; } }
  @keyframes groundB { from { stroke-dashoffset: 56.5; }   to { stroke-dashoffset: 169.597; } }
  .ground-a { animation: groundA .2s linear infinite; }
  .ground-b { animation: groundB .2s linear infinite; }

  /* 链条：上段随曲柄向前（右）走，下段向后（左）走，速度 78.54 px/s */
  @keyframes chainTop { from { stroke-dashoffset: 0; }       to { stroke-dashoffset: -31.416; } }
  @keyframes chainBot { from { stroke-dashoffset: 0; }       to { stroke-dashoffset: 31.416; } }
  .chain-top { animation: chainTop .4s linear infinite; }
  .chain-bot { animation: chainBot .4s linear infinite; }

  /* 远山视差：只走地面速度的 1/8，tile 400 px 需要 5.659 s */
  @keyframes hillScroll { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  .hills { animation: hillScroll 5.659s linear infinite; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle sceneDesc">

  <title id="sceneTitle">一只鹈鹕骑着自行车向前行驶</title>
  <desc id="sceneDesc">二维卡通侧视图：鹈鹕有着长长的脖子、大大的喙与橙色的喉囊，双蹼踩在脚踏上随曲柄转动，
  一只翅膀搭在车把上，围巾随风飘动；自行车的两个辐条车轮在转，背景的云、远山与地面不断向后滚动。</desc>

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#7fc9ea"/>
      <stop offset="0.55" stop-color="#bfe6f5"/>
      <stop offset="1"   stop-color="#e9f7fb"/>
    </linearGradient>
    <!-- 地面渐变 -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbb76"/>
      <stop offset="1" stop-color="#5c8a4a"/>
    </linearGradient>

    <!-- 云朵：以原点为中心的一簇圆形 -->
    <g id="cloudShape">
      <ellipse cx="-8"  cy="2"  rx="46" ry="23" fill="#ffffff"/>
      <ellipse cx="-40" cy="9"  rx="28" ry="16" fill="#ffffff"/>
      <ellipse cx="28"  cy="10" rx="31" ry="15" fill="#ffffff"/>
    </g>

    <!-- 车轮：以 (0,0) 为轮心，用 <use x/y> 摆到对应轮轴位置 -->
    <g id="wheelShape">
      <circle r="72"   fill="none" stroke="#242a30" stroke-width="10"/>          <!-- 外胎 -->
      <circle r="66.5" fill="none" stroke="#cdd7e0" stroke-width="5"/>           <!-- 轮圈 -->
      <g stroke="#a4b3c1" stroke-width="2.2" stroke-linecap="round">            <!-- 12 根辐条 -->
        <line x1="62"    y1="0"     x2="-62"   y2="0"/>
        <line x1="53.7"  y1="31"    x2="-53.7" y2="-31"/>
        <line x1="31"    y1="53.7"  x2="-31"   y2="-53.7"/>
        <line x1="0"     y1="62"    x2="0"     y2="-62"/>
        <line x1="-31"   y1="53.7"  x2="31"    y2="-53.7"/>
        <line x1="-53.7" y1="31"    x2="53.7"  y2="-31"/>
      </g>
      <circle r="8.5" fill="#8b98a6"/>                                          <!-- 花鼓 -->
      <circle r="3.6" fill="#4b5763"/>
      <!-- 气门嘴：让车轮的旋转肉眼可见，否则对称的轮子看起来是静止的 -->
      <line x1="0" y1="-58" x2="0" y2="-45" stroke="#e8452f" stroke-width="4.6" stroke-linecap="round"/>
    </g>

    <!-- 蹼足：脚踝在原点，脚趾朝前（右） -->
    <g id="webFoot">
      <path d="M -4 -4 C 6 -8 18 -6 24 -2 C 27 0 27 4 23 5 C 19 6 14 5 11 7 C 7 9 1 8 -2 5 C -5 3 -6 -1 -4 -4 Z"
            fill="#f2a93b" stroke="#cf7f18" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 4 -6 C 8 -2 10 2 11 6 M 13 -4 C 16 -1 20 1 23 2"
            fill="none" stroke="#cf7f18" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ======================================================================
       1. 背景：天空 / 太阳 / 云 / 远山
       ====================================================================== -->
  <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="108" cy="74" r="34" fill="#ffd35e"/>
    <g class="sun-rays" stroke="#ffd35e" stroke-width="5" stroke-linecap="round">
      <line x1="108" y1="24"  x2="108" y2="8"/>
      <line x1="108" y1="124" x2="108" y2="140"/>
      <line x1="58"  y1="74"  x2="42"  y2="74"/>
      <line x1="158" y1="74"  x2="174" y2="74"/>
      <line x1="72"  y1="38"  x2="61"  y2="27"/>
      <line x1="144" y1="38"  x2="155" y2="27"/>
      <line x1="72"  y1="110" x2="61"  y2="121"/>
      <line x1="144" y1="110" x2="155" y2="121"/>
    </g>
  </g>

  <!-- 两个云层，各自严格按 1000 px 的重复周期平移，循环无跳变 -->
  <g class="clouds-b" opacity=".55">
    <use href="#cloudShape" transform="translate(280 178) scale(.6)"/>
    <use href="#cloudShape" transform="translate(780 172) scale(.78)"/>
    <use href="#cloudShape" transform="translate(1280 178) scale(.6)"/>
    <use href="#cloudShape" transform="translate(1780 172) scale(.78)"/>
    <use href="#cloudShape" transform="translate(2280 178) scale(.6)"/>
    <use href="#cloudShape" transform="translate(2780 172) scale(.78)"/>
  </g>
  <g class="clouds-a" opacity=".9">
    <use href="#cloudShape" transform="translate(140 112) scale(1)"/>
    <use href="#cloudShape" transform="translate(640 120) scale(.72)"/>
    <use href="#cloudShape" transform="translate(1140 112) scale(1)"/>
    <use href="#cloudShape" transform="translate(1640 120) scale(.72)"/>
    <use href="#cloudShape" transform="translate(2140 112) scale(1)"/>
    <use href="#cloudShape" transform="translate(2640 120) scale(.72)"/>
  </g>

  <!-- 远山：每 400 px 重复一次，平移 400 px 后与原图完全重合 -->
  <g class="hills">
    <path d="M -400 447 Q -300 372 -200 447 Q -100 402 0 447 Q 100 372 200 447 Q 300 402 400 447
             Q 500 372 600 447 Q 700 402 800 447 Q 900 372 1000 447 Q 1100 402 1200 447
             L 1200 470 L -400 470 Z"
          fill="#9dc6ac"/>
    <path d="M -400 447 Q -300 372 -200 447 Q -100 402 0 447 Q 100 372 200 447 Q 300 402 400 447
             Q 500 372 600 447 Q 700 402 800 447 Q 900 372 1000 447 Q 1100 402 1200 447"
          fill="none" stroke="#7fae90" stroke-width="3"/>
  </g>

  <!-- ======================================================================
       2. 地面（水平线 y = 447，正好是车轮外胎的最低点）
       ====================================================================== -->
  <rect x="0" y="447" width="800" height="53" fill="url(#groundGrad)"/>
  <line x1="0" y1="447" x2="800" y2="447" stroke="#4f7a3d" stroke-width="3"/>
  <!-- 车身下方的接地阴影 -->
  <ellipse cx="420" cy="447" rx="235" ry="11" fill="#2f4a24" opacity=".22"/>

  <!-- 向后滚动的地面纹理。tile = 113.097 px，= 车轮周长 / 4，速度与车轮表面一致 -->
  <line class="ground-a" x1="-20" y1="472" x2="820" y2="472"
        stroke="#5f8f4b" stroke-width="7" stroke-linecap="round" stroke-dasharray="44 69.097"/>
  <line class="ground-b" x1="-20" y1="494" x2="820" y2="494"
        stroke="#4d7a3a" stroke-width="5" stroke-linecap="round" stroke-dasharray="24 89.097"/>

  <!-- ======================================================================
       3. 远侧（画面里侧）的腿与脚踏：位于车架之后
       ====================================================================== -->
  <g id="farLeg">
    <!-- 大腿 + 小腿：17 个关键帧由二连杆 IK 反解得到，脚踝始终等于远侧脚踏坐标 -->
    <path fill="none" stroke="#dd9527" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"
          d="M 380 224 L 453.4 291.9 L 383 365">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" begin="0s"
        values="M 380 224 L 453.4 291.9 L 383 365;M 380 224 L 460.8 282.9 L 385.6 352;M 380 224 L 467.9 271.7 L 393 341;M 380 224 L 473.4 259.7 L 404 333.6;M 380 224 L 476.5 250.3 L 417 331;M 380 224 L 477.4 246.7 L 430 333.6;M 380 224 L 476.6 249.8 L 441 341;M 380 224 L 473.9 258.5 L 448.4 352;M 380 224 L 468.6 270.5 L 451 365;M 380 224 L 460.7 283.1 L 448.4 378;M 380 224 L 451.3 294.1 L 441 389;M 380 224 L 443.1 301.5 L 430 396.4;M 380 224 L 438.7 304.9 L 417 399;M 380 224 L 438.6 305 L 404 396.4;M 380 224 L 441.7 302.7 L 393 389;M 380 224 L 446.8 298.4 L 385.6 378;M 380 224 L 453.4 291.9 L 383 365"/>
    </path>
    <!-- 蹼足：与远侧脚踏同相位平移 -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" begin="0s"
        values="383 365;385.6 352;393 341;404 333.6;417 331;430 333.6;441 341;448.4 352;451 365;448.4 378;441 389;430 396.4;417 399;404 396.4;393 389;385.6 378;383 365"/>
      <use href="#webFoot"/>
    </g>
    <!-- 远侧曲柄 + 脚踏（与近侧相差 180°） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite" begin="0s"
        values="0 425 370;360 425 370"/>
      <line x1="425" y1="370" x2="391" y2="370" stroke="#39434e" stroke-width="9" stroke-linecap="round"/>
      <rect x="378" y="369" width="24" height="10" rx="3.5" fill="#2f383f"/>
    </g>
  </g>

  <!-- ======================================================================
       4. 车轮：0.8 s 转一圈（曲柄 1.6 s 转一圈，传动比 2.0），顺时针 = 前进
       ====================================================================== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="0.8s" repeatCount="indefinite" begin="0s"
      values="0 280 370;360 280 370"/>
    <use href="#wheelShape" x="280" y="370"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="0.8s" repeatCount="indefinite" begin="0s"
      values="0 560 370;360 560 370"/>
    <use href="#wheelShape" x="560" y="370"/>
  </g>

  <!-- ======================================================================
       5. 车架 / 车座 / 车把
       ====================================================================== -->
  <g id="bike" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后飞轮 -->
    <circle cx="280" cy="370" r="11"  fill="#93a1ae"/>
    <circle cx="280" cy="370" r="12.5" fill="none" stroke="#93a1ae" stroke-width="4" stroke-dasharray="3 3.9"/>
    <circle cx="280" cy="370" r="4"   fill="#5a6672"/>

    <!-- 链条：上段向前（右）走，下段向后（左）走；线速度 78.54 px/s，tile 31.416 px -->
    <line class="chain-top" x1="280" y1="359" x2="425" y2="350"
          stroke="#5a6672" stroke-width="3.2" stroke-dasharray="18 13.416"/>
    <line class="chain-bot" x1="280" y1="381" x2="425" y2="390"
          stroke="#5a6672" stroke-width="3.2" stroke-dasharray="18 13.416"/>

    <!-- 车架主体（红色管材） -->
    <g stroke="#d6453a" stroke-width="9" fill="none">
      <line x1="425" y1="370" x2="280" y2="370"/>   <!-- 后下叉 chainstay -->
      <line x1="376" y1="244" x2="280" y2="370"/>   <!-- 后上叉 seat stay -->
      <line x1="425" y1="370" x2="376" y2="244"/>   <!-- 坐管 seat tube -->
      <line x1="425" y1="370" x2="552" y2="296"/>   <!-- 下管 down tube -->
      <line x1="376" y1="244" x2="544" y2="268"/>   <!-- 上管 top tube -->
    </g>
    <line x1="544" y1="268" x2="552" y2="296" stroke="#b8382f" stroke-width="14" stroke-linecap="round"/> <!-- 头管 -->
    <line x1="552" y1="296" x2="560" y2="370" stroke="#d6453a" stroke-width="8"  stroke-linecap="round"/> <!-- 前叉 -->

    <!-- 车座 -->
    <path d="M 330 228 C 340 218 356 216 372 219 L 412 226 C 421 228 421 239 410 241
             L 345 240 C 334 240 327 235 330 228 Z" fill="#343a42"/>

    <!-- 车把（上翘后掠把）与握把 -->
    <path d="M 546 268 L 544 248 C 543 238 536 232 526 231" fill="none" stroke="#3b4148" stroke-width="7"/>
    <line x1="538" y1="233" x2="526" y2="231" stroke="#22262b" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- 近侧曲柄组：链轮 + 曲柄臂 + 脚踏，1.6 s 转一圈（与双腿同源动画） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite" begin="0s"
      values="0 425 370;360 425 370"/>
    <!-- 链轮 -->
    <circle cx="425" cy="370" r="20"   fill="#c3ccd6" stroke="#8b98a6" stroke-width="2"/>
    <circle cx="425" cy="370" r="22.5" fill="none" stroke="#8b98a6" stroke-width="5" stroke-dasharray="4 4.1"/>
    <circle cx="425" cy="370" r="5.5"  fill="#6d7a87"/>
    <g stroke="#9aa7b4" stroke-width="3">
      <line x1="425" y1="370" x2="425" y2="352"/>
      <line x1="425" y1="370" x2="408" y2="380"/>
      <line x1="425" y1="370" x2="442" y2="380"/>
    </g>
    <!-- 曲柄臂 + 脚踏 -->
    <line x1="425" y1="370" x2="459" y2="370" stroke="#39434e" stroke-width="9" stroke-linecap="round"/>
    <rect x="447" y="369" width="24" height="10" rx="3.5" fill="#2f383f"/>
  </g>

  <!-- ======================================================================
       6. 近侧（画面外侧）的腿与脚踏：位于车架之前、身体之后
       ====================================================================== -->
  <g id="nearLeg">
    <path fill="none" stroke="#f2a93b" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"
          d="M 386 216 L 469.8 270.6 L 451 365">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" begin="0s"
        values="M 386 216 L 469.8 270.6 L 451 365;M 386 216 L 460.2 283.1 L 448.4 378;M 386 216 L 448.5 294 L 441 389;M 386 216 L 438 301.4 L 430 396.4;M 386 216 L 432.9 304.3 L 417 399;M 386 216 L 433.8 303.8 L 404 396.4;M 386 216 L 438.3 301.3 L 393 389;M 386 216 L 444.6 297 L 385.6 378;M 386 216 L 452.2 290.9 L 383 365;M 386 216 L 460.5 282.7 L 385.6 352;M 386 216 L 468.6 272.3 L 393 341;M 386 216 L 475.2 261.1 L 404 333.6;M 386 216 L 479.3 252 L 417 331;M 386 216 L 480.7 248.2 L 430 333.6;M 386 216 L 479.8 250.8 L 441 341;M 386 216 L 476.3 259 L 448.4 352;M 386 216 L 469.8 270.6 L 451 365"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" begin="0s"
        values="451 365;448.4 378;441 389;430 396.4;417 399;404 396.4;393 389;385.6 378;383 365;385.6 352;393 341;404 333.6;417 331;430 333.6;441 341;448.4 352;451 365"/>
      <use href="#webFoot"/>
    </g>
  </g>

  <!-- ======================================================================
       7. 鹈鹕（整体做 0.8 s 一次的上下起伏）
       ====================================================================== -->
  <g class="pelican-bob">

    <!-- 尾羽 -->
    <path d="M 296 168 C 262 146 230 136 202 136 C 228 154 258 176 284 194 Z"
          fill="#efeade" stroke="#ddd5c4" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 268 148 L 292 176 M 244 142 L 274 170" stroke="#ddd5c4" stroke-width="2" stroke-linecap="round"/>

    <!-- 身体 -->
    <ellipse cx="348" cy="168" rx="80" ry="60" fill="#f8f5ee" stroke="#e0d9c9" stroke-width="2.5"/>
    <path d="M 300 214 C 330 226 380 224 412 204" fill="none" stroke="#e6dfd0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 远侧收拢的翅膀 -->

<!--
  同步性说明
  ----------
  · 曲柄、双腿的 <animate>/<animateTransform> 全部挂在同一个 SMIL 时间轴上，
    dur 都是 1.6 s，keyTimes 默认在 17 个关键帧上均匀分布，
    所以第 k 帧时曲柄角度 = 22.5°×k，而双腿的 IK 关键帧也正是按
    同一个 22.5° 步长计算的 —— 脚踝严格落在脚踏中心 + (-8, -5) 处。

  · 关键帧之间是直线插值，脚会沿弦线而非圆弧运动，
    最大偏差 = R·(1 - cos(π/16)) = 34 × (1 - cos 11.25°) = 0.653 px，
    相对 800 px 的画布可忽略。

  · 二连杆 IK 参数：髋关节 近侧 (386,216) / 远侧 (380,224)，五通 (425,370)，
    曲柄半径 34，大腿 = 小腿 = 100（总够到长度 200）。
    实际髋—脚距离范围 118.97 ~ 192.57 px，始终在全长之内，膝不屈反。

  · 无缝循环：所有动画都是线性/缓动 + infinite，且首尾关键帧数值相同；
    平移类动画的位移量正好等于图案自身的重复周期
    （地面 113.097 px、链条 31.416 px、远山 400 px、云 1000 px），
    因此 wrap-around 时画面逐像素重合，不会有跳变。
-->
