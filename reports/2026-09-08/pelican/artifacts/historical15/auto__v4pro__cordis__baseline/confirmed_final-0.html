<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const rearSpokes = $("rearSpokes"), frontSpokes = $("frontSpokes");
  const crankG = $("crankG"), pedal1 = $("pedal1"), pedal2 = $("pedal2");
  const centerLine = $("centerLine"), sunRays = $("sunRays");
  const pelicanG = $("pelicanG"), headG = $("headG"), wingG = $("wingG"), pouchG = $("pouchG"), eyeG = $("eyeG");
  const farThigh = $("farThigh"), farShin = $("farShin"), farFoot = $("farFoot");
  const nearThigh = $("nearThigh"), nearShin = $("nearShin"), nearFoot = $("nearFoot");

  const clouds = [
    { el: $("cloud1"), x: 210, y: 92,  v: 13 },
    { el: $("cloud2"), x: 560, y: 56,  v: 9  },
    { el: $("cloud3"), x: 790, y: 150, v: 16 }
  ];

  // 几何参数
  const BB = { x: 424, y: 402 };          // 中轴（五通）
  const R = 26;                           // 曲柄半径
  const hipN = { x: 399, y: 274 };        // 近侧腿髋关节
  const hipF = { x: 394, y: 271 };        // 远侧腿髋关节
  const L1 = 80, L2 = 80;                 // 大腿 / 小腿长度（两段骨骼 IK）
  const WHEEL = 150, CRANK = 96;          // 轮子 / 曲柄角速度（度每秒）
  const V = 151.8;                        // 与轮速匹配的地面滚动速度（px/s）

  let wheelA = 0, crankA = 0, sunA = 0, dash = 0;
  let last = performance.now();
  let blinkIn = 2800, blinkLeft = 0;      // 眨眼计时（毫秒）

  // 两段骨骼反向运动学：返回膝盖位置（取膝盖在连线之上的解）
  function ik(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, L1 + L2 - 1);
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    const ux = dx / d, uy = dy / d;
    const k1 = { x: hip.x + a * ux - h * uy, y: hip.y + a * uy + h * ux };
    const k2 = { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
    return k1.y <= k2.y ? k1 : k2;
  }

  function setLeg(thigh, shin, footG, hip, foot) {
    const k = ik(hip, foot);
    thigh.setAttribute("x1", hip.x);  thigh.setAttribute("y1", hip.y);
    thigh.setAttribute("x2", k.x);    thigh.setAttribute("y2", k.y);
    shin.setAttribute("x1", k.x);     shin.setAttribute("y1", k.y);
    shin.setAttribute("x2", foot.x);  shin.setAttribute("y2", foot.y);
    footG.setAttribute("transform", "translate(" + foot.x + " " + foot.y + ")");
  }

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    wheelA += WHEEL * dt;
    crankA += CRANK * dt;
    sunA += 4 * dt;
    const a1 = crankA * Math.PI / 180;

    // 轮子与辐条
    rearSpokes.setAttribute("transform", "rotate(" + wheelA + " 330 402)");
    frontSpokes.setAttribute("transform", "rotate(" + wheelA + " 590 402)");

    // 曲柄旋转，脚踏反向旋转保持水平
    crankG.setAttribute("transform", "rotate(" + crankA + " 424 402)");
    pedal1.setAttribute("transform", "translate(26 0) rotate(" + (-crankA) + ")");
    pedal2.setAttribute("transform", "translate(-26 0) rotate(" + (-crankA) + ")");

    // 两只脚的世界坐标（前后踏板相位相反）
    const fN = { x: BB.x + R * Math.cos(a1), y: BB.y + R * Math.sin(a1) };
    const fF = { x: BB.x - R * Math.cos(a1), y: BB.y - R * Math.sin(a1) };

    // 身体随踩踏上下起伏，髋关节跟着起伏，IK 让脚始终踩在踏板上
    const bobY = 3 * Math.sin(2 * a1);
    setLeg(nearThigh, nearShin, nearFoot, { x: hipN.x, y: hipN.y + bobY }, fN);
    setLeg(farThigh, farShin, farFoot, { x: hipF.x, y: hipF.y + bobY }, fF);

    pelicanG.setAttribute("transform", "translate(0 " + bobY + ")");
    headG.setAttribute("transform", "translate(0 " + (-1.6 * bobY) + ")");
    wingG.setAttribute("transform", "rotate(" + (9 * Math.sin(now / 520) + 3 * Math.sin(2 * a1)) + " 352 205)");
    pouchG.setAttribute("transform", "rotate(" + (3.5 * Math.sin(now / 700) + 1.5) + " 478 142)");

    // 眨眼
    if (blinkLeft > 0) {
      blinkLeft -= dt * 1000;
      const sy = blinkLeft < 110 ? 1 - 0.9 * (110 - blinkLeft) / 110 : 0.1;
      eyeG.setAttribute("transform", "translate(465 117) scale(1 " + sy + ") translate(-465 -117)");
      if (blinkLeft <= 0) {
        blinkIn = 2400 + Math.random() * 1800;
        eyeG.setAttribute("transform", "");
      }
    } else {
      blinkIn -= dt * 1000;
      if (blinkIn <= 0) blinkLeft = 220;
    }

    // 路面虚线后移（等效于自行车前进）
    dash = (dash + V * dt) % 60;
    centerLine.setAttribute("stroke-dashoffset", dash);

    // 太阳光芒缓慢旋转
    sunRays.setAttribute("transform", "rotate(" + sunA + " 88 88)");

    // 云朵平移并循环
    for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x > 1000) c.x = -190;
      c.el.setAttribute("transform", "translate(" + c.x + " " + c.y + ")");
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
