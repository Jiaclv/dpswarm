<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - 纯 SVG 2D 动画</title>
<style>
  /* ---------- 页面排版 ---------- */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#87CEEB, #d7f0fb);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  h1 { margin: 16px 0 4px; color: #1a3a5c; letter-spacing: 2px; }
  p.caption { margin: 0 0 12px; color: #3d5a75; font-size: 14px; }
  .stage {
    width: min(1000px, 96vw);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- 云朵水平飘移（CSS keyframes 平移） ---------- */
  @keyframes drift {
    from { transform: translateX(-280px); }
    to   { transform: translateX(1280px); }
  }
  .cloud { animation: drift linear infinite; }

  /* ---------- 地面细节无缝滚动 ----------
     两段完全相同的 500px 宽装饰首尾相接，
     同时向左平移 500px 后循环，视觉上无限前进 */
  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-500px); }
  }
  .ground-deco { animation: scrollX 4s linear infinite; }
</style>
</head>
<body>

<h1>鹈鹕骑自行车</h1>
<p class="caption">纯 SVG + SMIL / CSS 循环动画 · 车轮 · 脚踏 · 喉囊 · 翅膀 · 地面滚动</p>

<div class="stage">
<svg viewBox="0 0 1000 600" role="img" aria-label="一只鹈鹕骑着自行车前进的循环动画" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6db3e8"/>
      <stop offset="70%" stop-color="#cdeefc"/>
      <stop offset="100%" stop-color="#eef9ff"/>
    </linearGradient>
    <!-- 云朵形状（复用两份，速度不同） -->
    <g id="cloudShape" fill="#ffffff" opacity="0.92">
      <circle cx="-45" cy="12" r="22"/>
      <circle cx="-15" cy="-6" r="28"/>
      <circle cx="18"  cy="2"  r="24"/>
      <circle cx="42"  cy="12" r="18"/>
      <rect x="-45" y="6" width="87" height="20" rx="10"/>
    </g>
    <!-- 一段 500px 宽的地面装饰：石块、路纹、草叶、小花（循环滚动用） -->
    <g id="deco">
      <!-- 路面小石子 -->
      <g fill="#B08968" opacity="0.6">
        <circle cx="45"  cy="505" r="5"/>
        <circle cx="140" cy="520" r="7"/>
        <circle cx="230" cy="508" r="4.5"/>
        <circle cx="330" cy="522" r="6"/>
        <circle cx="420" cy="506" r="5"/>
        <circle cx="95"  cy="540" r="4"/>
        <circle cx="290" cy="545" r="5"/>
        <circle cx="470" cy="540" r="6"/>
      </g>
      <!-- 路面虚线 -->
      <g stroke="#C9A87C" stroke-width="4" stroke-linecap="round" opacity="0.8">
        <line x1="10"  y1="495" x2="50"  y2="495"/>
        <line x1="180" y1="530" x2="230" y2="530"/>
        <line x1="360" y1="497" x2="410" y2="497"/>
      </g>
      <!-- 路沿草叶 -->
      <g stroke="#558B2F" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M60,470 l4,-11"/>
        <path d="M64,470 l5,-8"/>
        <path d="M150,469 l3,-10"/>
        <path d="M260,470 l4,-12"/>
        <path d="M264,470 l5,-8"/>
        <path d="M380,469 l4,-11"/>
        <path d="M460,470 l3,-10"/>
      </g>
      <!-- 两朵小花 -->
      <g>
        <circle cx="200" cy="462" r="4"  fill="#FFF59D"/>
        <circle cx="200" cy="462" r="1.8" fill="#FF7043"/>
        <circle cx="390" cy="464" r="4"  fill="#FFF59D"/>
        <circle cx="390" cy="464" r="1.8" fill="#FF7043"/>
      </g>
    </g>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect width="1000" height="600" fill="url(#sky)"/>

  <!-- 远山 -->
  <path d="M0,440 Q160,382 340,440 Z"   fill="#9CCC65"/>
  <path d="M200,440 Q500,372 800,440 Z" fill="#AED581"/>
  <path d="M640,440 Q840,398 1000,440 Z" fill="#8BC34A"/>

  <!-- 太阳：外圈光芒用 SMIL 匀速旋转 -->
  <g transform="translate(868,96)">
    <g opacity="0.5" stroke="#FFB300" stroke-width="5" stroke-linecap="round">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
        <line x1="0" y1="-62" x2="0" y2="-78"/>
        <line x1="44" y1="-44" x2="55" y2="-55"/>
        <line x1="62" y1="0" x2="78" y2="0"/>
        <line x1="44" y1="44" x2="55" y2="55"/>
        <line x1="0" y1="62" x2="0" y2="78"/>
        <line x1="-44" y1="44" x2="-55" y2="55"/>
        <line x1="-62" y1="0" x2="-78" y2="0"/>
        <line x1="-44" y1="-44" x2="-55" y2="-55"/>
      </g>
    </g>
    <circle r="42" fill="#FFD54F"/>
    <circle r="32" fill="#FFE082"/>
  </g>

  <!-- 云朵：外层 g 定位，内层 g 由 CSS 平移 -->
  <g transform="translate(180,120)">
    <g class="cloud" style="animation-duration: 70s">
      <use href="#cloudShape"/>
    </g>
  </g>
  <g transform="translate(620,80) scale(0.7)">
    <g class="cloud" style="animation-duration: 95s; animation-delay: -40s">
      <use href="#cloudShape"/>
    </g>
  </g>

  <!-- ================= 地面 ================= -->
  <rect y="440" width="1000" height="160" fill="#7CB342"/>
  <rect y="470" width="1000" height="85"  fill="#E3C9A8"/>   <!-- 土路 -->
  <line x1="0" y1="470" x2="1000" y2="470" stroke="#8D6E63" opacity="0.4"/>
  <rect y="555" width="1000" height="45"  fill="#7CB342"/>

  <!-- 两段相同的地面装饰无缝向左滚动，表现前进感 -->
  <g transform="translate(0,0)">
    <use href="#deco" class="ground-deco"/>
  </g>
  <g transform="translate(500,0)">
    <use href="#deco" class="ground-deco"/>
  </g>

  <!-- 车身阴影 -->
  <ellipse cx="490" cy="502" rx="205" ry="11" fill="#5D4037" opacity="0.18"/>

  <!-- ================= 自行车 ================= -->
  <!-- 后轮：外圈 g 平移到轮心，内圈 g 用 SMIL 绕自身原点匀速旋转 -->
  <g transform="translate(360,435)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <circle r="60" fill="none" stroke="#263238" stroke-width="8"/>          <!-- 外胎 -->
      <circle r="52" fill="none" stroke="#B0BEC5" stroke-width="3.5"/>        <!-- 轮圈 -->
      <g stroke="#90A4AE" stroke-width="2">
        <line x1="0" y1="-52" x2="0" y2="52"/>                                 <!-- 8 根辐条 -->
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-36.8" y1="-36.8" x2="36.8" y2="36.8"/>
        <line x1="-36.8" y1="36.8" x2="36.8" y2="-36.8"/>
      </g>
      <circle r="6" fill="#455A64"/>                                          <!-- 花鼓 -->
    </g>
  </g>

  <!-- 前轮：同后轮 -->
  <g transform="translate(650,435)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <circle r="60" fill="none" stroke="#263238" stroke-width="8"/>
      <circle r="52" fill="none" stroke="#B0BEC5" stroke-width="3.5"/>
      <g stroke="#90A4AE" stroke-width="2">
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-36.8" y1="-36.8" x2="36.8" y2="36.8"/>
        <line x1="-36.8" y1="36.8" x2="36.8" y2="-36.8"/>
      </g>
      <circle r="6" fill="#455A64"/>
    </g>
  </g>

  <!-- 车架（红色菱形车架） -->
  <g stroke="#E53935" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="360" y1="435" x2="440" y2="305"/>   <!-- 后上叉 -->
    <line x1="480" y1="435" x2="440" y2="305"/>   <!-- 立管 -->
    <line x1="440" y1="305" x2="615" y2="300"/>   <!-- 上管 -->
    <line x1="480" y1="435" x2="640" y2="345"/>   <!-- 下管 -->
    <line x1="360" y1="435" x2="480" y2="435"/>   <!-- 后下叉（链叉） -->
    <line x1="640" y1="345" x2="650" y2="435" stroke-width="6"/> <!-- 前叉 -->
  </g>
  <!-- 头管 -->
  <line x1="615" y1="300" x2="640" y2="345" stroke="#455A64" stroke-width="10" stroke-linecap="round"/>

  <!-- 坐垫 + 座管 -->
  <line x1="440" y1="305" x2="440" y2="296" stroke="#455A64" stroke-width="6"/>
  <path d="M415,296 L462,293 L464,288 L414,291 Z" fill="#4E342E"/>

  <!-- 车把 -->
  <line x1="615" y1="300" x2="612" y2="282" stroke="#455A64" stroke-width="5" stroke-linecap="round"/>
  <path d="M640,284 Q616,272 592,281" fill="none" stroke="#455A64" stroke-width="5" stroke-linecap="round"/>
  <circle cx="592" cy="281" r="4.5" fill="#37474F"/>

  <!-- 牙盘、链条、飞轮 -->
  <circle cx="480" cy="435" r="15" fill="none" stroke="#616161" stroke-width="3"/>
  <circle cx="480" cy="435" r="8" fill="#455A64"/>
  <circle cx="360" cy="435" r="8" fill="#616161"/>
  <line x1="466" y1="430" x2="374" y2="431" stroke="#616161" stroke-width="1.5"/>
  <line x1="466" y1="440" x2="374" y2="439" stroke="#616161" stroke-width="1.5"/>

  <!-- 曲柄 + 脚踏 + 鹈鹕脚掌：整体绕五通中心旋转，脚掌始终踩在脚踏上 -->
  <g transform="translate(480,435)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
      <rect x="38"  y="-7" width="20" height="14" rx="4" fill="#455A64"/>
      <rect x="-58" y="-7" width="20" height="14" rx="4" fill="#455A64"/>
      <!-- 右脚掌 -->
      <g fill="#F57F17">
        <ellipse cx="48" cy="3" rx="9" ry="4.5"/>
        <g stroke="#F57F17" stroke-width="2.5" stroke-linecap="round">
          <path d="M45,7 L40,11"/>
          <path d="M50,7.5 L49,12"/>
          <path d="M55,5.5 L58,9"/>
        </g>
      </g>
      <!-- 左脚掌 -->
      <g fill="#F57F17">
        <ellipse cx="-48" cy="3" rx="9" ry="4.5"/>
        <g stroke="#F57F17" stroke-width="2.5" stroke-linecap="round">
          <path d="M-45,7 L-40,11"/>
          <path d="M-50,7.5 L-49,12"/>
          <path d="M-55,5.5 L-58,9"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g id="pelican">

    <!-- 尾羽 -->
    <g fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1.5">
      <path d="M378,244 C356,230 342,238 344,252 C346,262 358,262 374,260 Z"/>
      <path d="M376,252 C352,246 340,254 342,266 C344,274 356,274 372,268 Z"/>
      <path d="M378,260 C358,260 348,268 350,278 C352,286 362,286 376,280 Z"/>
    </g>

    <!-- 翅膀：外圈 g 平移到肩关节，内圈 g 用 SMIL 绕肩部原点扇动 -->
    <g transform="translate(420,230)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-14 0 0; 12 0 0; -14 0 0" dur="1.5s" repeatCount="indefinite"/>
        <path d="M0,0 C-26,-36 -64,-44 -90,-30 C-70,-10 -42,4 -16,9 C-24,1 -20,-6 0,0 Z"
              fill="#F5F5F5" stroke="#CFD8DC" stroke-width="1.5"/>
        <path d="M-12,-6 C-30,-18 -52,-22 -72,-16" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
        <path d="M-14,0 C-32,-8 -50,-10 -66,-6" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
      </g>
    </g>

    <!-- 两条腿：绕髋关节小幅度交替摆动 -->
    <g transform="translate(452,288)">
      <g stroke="#F57F17" stroke-width="6.5" stroke-linecap="round" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="-4 0 0; 4 0 0; -4 0 0" dur="3s" repeatCount="indefinite"/>
        <path d="M0,0 C10,48 4,100 24,144"/>
      </g>
    </g>
    <g transform="translate(468,292)">
      <g stroke="#F57F17" stroke-width="6.5" stroke-linecap="round" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="4 0 0; -4 0 0; 4 0 0" dur="3s" repeatCount="indefinite"/>
        <path d="M0,0 C10,44 2,98 28,140"/>
      </g>
    </g>

    <!-- 身体主体：随骑行节奏整体上下起伏 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- 身体 -->
      <ellipse cx="425" cy="250" rx="62" ry="45" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
      <path d="M452,222 C478,234 486,258 484,278 C462,288 440,286 424,276 C452,272 466,252 452,222 Z" fill="#E8EEF2" opacity="0.85"/>

      <!-- 脖颈 -->
      <path d="M438,232 C452,202 472,190 494,184" fill="none" stroke="#E0E0E0" stroke-width="29" stroke-linecap="round"/>
      <path d="M438,232 C452,202 472,190 494,184" fill="none" stroke="#FAFAFA" stroke-width="26" stroke-linecap="round"/>

      <!-- 头部与羽冠 -->
      <circle cx="495" cy="181" r="24" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
      <path d="M476,160 q-6,-12 2,-14 q6,10 4,16 z" fill="#E8EEF2"/>

      <!-- 眼睛 -->
      <circle cx="505" cy="172" r="4.5" fill="#263238"/>
      <circle cx="506.6" cy="170.4" r="1.6" fill="#ffffff"/>

      <!-- 上喙：细长、尖端带钩，固定于头部 -->
      <path d="M514,166 C540,170 568,180 589,190 Q593,192 591,197 L576,200 L512,193 Q508,179 514,166 Z"
            fill="#FF8F00" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M514,181 C540,184 566,188 588,194" fill="none" stroke="#E65100" stroke-width="1" opacity="0.55"/>

      <!-- 下喙 + 喉囊：绕喙部铰点开合，喉囊随之摇摆 -->
      <g transform="translate(515,192)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 0; 9 0 0; 0 0 0" dur="3s" repeatCount="indefinite"/>
          <path d="M-3,0 L61,4 L63,8 L-3,5 Z" fill="#FB8C00" stroke="#E65100" stroke-width="1.2"/>
          <path d="M-3,5 C-16,50 26,62 59,38 C66,32 67,13 63,8 C41,34 13,36 -1,13 Z"
                fill="#FFB74D" stroke="#F57C00" stroke-width="1.2" opacity="0.95"/>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>

</body>
</html>
