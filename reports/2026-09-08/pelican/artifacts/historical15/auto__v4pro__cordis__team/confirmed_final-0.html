<!--
  鹈鹕骑自行车 · 纯 SVG 2D 动画
  - 完全自包含（内联 CSS/JS，无外部依赖）
  - requestAnimationFrame 驱动：车轮与曲柄同步旋转、踏板反旋保持水平、
    双腿 IK 蹬踏、翅膀扑扇、喉囊晃动、鱼尾摆动、路面/灌木视差滚动、云朵与飞鸟飘移
  - 尊重 prefers-reduced-motion：用户开启“减少动态效果”时静态呈现
-->

    height: 100vh;

</style>
</head>

<script>
(function () {
  'use strict';
  var svg = document.getElementById('scene');
  var $ = function (id) { return document.getElementById(id); };

  var rearWheel  = $('rearWheel'),  frontWheel = $('frontWheel'), crank = $('crank');
  var pedalA = $('pedalA'), pedalB = $('pedalB'), chain = $('chain');
  var legBack = $('legBack'), legFront = $('legFront');
  var footA = $('footA'), footB = $('footB');
  var bodyGroup = $('bodyGroup'), headGroup = $('headGroup'), wing = $('wing');
  var pouch = $('pouch'), fishTail = $('fishTail'), rays = $('rays');
  var dashes = $('dashes'), bushes = $('bushes');
  var clouds = [$('cloud1'), $('cloud2'), $('cloud3')];
  var birds  = [$('birds1'), $('birds2')];

  // ---- 几何参数 ----
  var BB = { x: 600, y: 415 };     // 五通（曲柄中心）
  var CRANK = 26;                  // 曲柄长度
  var WHEEL_R = 80;                // 车轮半径
  var SPEED = 240;                 // 路面滚动速度 px/s
  var HIPS = { front: { x: 584, y: 316 }, back: { x: 566, y: 318 } };
  var L1 = 70, L2 = 66;            // 大腿 / 小腿长度

  // ---- 两段式腿部 IK：髋 hip → 膝 knee → 脚 foot ----
  function solveLeg(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.hypot(dx, dy);
    var max = L1 + L2 - 1;
    var fx = foot.x, fy = foot.y;
    if (d > max) {                 // 极限拉伸保护
      fx = hip.x + (dx / d) * max;
      fy = hip.y + (dy / d) * max;
      d = max;
    }
    var mx = (hip.x + fx) / 2, my = (hip.y + fy) / 2;
    var h = Math.sqrt(Math.max(0, L1 * L1 - (d / 2) * (d / 2)));
    var px = -(fy - hip.y) / d, py = (fx - hip.x) / d;
    if (px < 0) { px = -px; py = -py; }   // 膝盖朝前进方向弯
    return { knee: [mx + px * h, my + py * h], foot: [fx, fy] };
  }

  var D2R = Math.PI / 180;
  var dist = 0, last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    dist += SPEED * dt;
    var t = now / 1000;

    var wAng = dist / WHEEL_R;            // 车轮转角（rad），曲柄与其同步
    var wDeg = wAng / D2R;

    // 车轮旋转
    rearWheel.setAttribute('transform', 'translate(470 390) rotate(' + wDeg + ')');
    frontWheel.setAttribute('transform', 'translate(730 390) rotate(' + wDeg + ')');

    // 曲柄旋转，踏板反旋保持水平
    crank.setAttribute('transform', 'translate(600 415) rotate(' + wDeg + ')');
    pedalA.setAttribute('transform', 'translate(26 0) rotate(' + (-wDeg) + ')');
    pedalB.setAttribute('transform', 'translate(-26 0) rotate(' + (-wDeg) + ')');

    // 两个踏板的世界坐标（相位差 180°）
    var pA = { x: BB.x + CRANK * Math.cos(wAng), y: BB.y + CRANK * Math.sin(wAng) };
    var pB = { x: BB.x - CRANK * Math.cos(wAng), y: BB.y - CRANK * Math.sin(wAng) };

    // 身体起伏（每圈两次），髋点随身体浮动
    var bobX = Math.sin(wAng) * 1.5, bobY = Math.sin(2 * wAng) * 2.5;
    var hipF = { x: HIPS.front.x + bobX, y: HIPS.front.y + bobY };
    var hipB = { x: HIPS.back.x + bobX, y: HIPS.back.y + bobY };

    var legF = solveLeg(hipF, pA);
    var legB = solveLeg(hipB, pB);
    legFront.setAttribute('points',
      hipF.x + ',' + hipF.y + ' ' + legF.knee[0] + ',' + legF.knee[1] + ' ' + legF.foot[0] + ',' + legF.foot[1]);
    legBack.setAttribute('points',
      hipB.x + ',' + hipB.y + ' ' + legB.knee[0] + ',' + legB.knee[1] + ' ' + legB.foot[0] + ',' + legB.foot[1]);
    footA.setAttribute('transform', 'translate(' + pA.x + ' ' + pA.y + ') rotate(' + (Math.sin(wAng) * 6) + ')');
    footB.setAttribute('transform', 'translate(' + pB.x + ' ' + pB.y + ') rotate(' + (Math.sin(wAng + Math.PI) * 6) + ')');

    bodyGroup.setAttribute('transform', 'translate(' + bobX + ' ' + bobY + ')');
    headGroup.setAttribute('transform', 'rotate(' + (Math.sin(t * 2.7) * 4) + ' 620 205)');
    wing.setAttribute('transform', 'rotate(' + (Math.sin(t * 6.5) * 24 + 8) + ' 552 230)');
    pouch.setAttribute('transform',
      'translate(700 176) scale(1 ' + (1 + Math.sin(t * 2.2) * 0.06) + ') translate(-700 -176)');
    fishTail.setAttribute('transform', 'rotate(' + (Math.sin(t * 9) * 16) + ' 781 196)');

    // ---- 环境 ----
    rays.setAttribute('transform', 'rotate(' + (t * 10) + ' 1050 85)');
    dashes.setAttribute('transform', 'translate(' + (-(dist % 120)) + ' 0)');
    bushes.setAttribute('transform', 'translate(' + (-((dist * 0.45) % 400)) + ' 0)');
    chain.setAttribute('stroke-dashoffset', -(dist % 12));
    clouds[0].setAttribute('transform', 'translate(' + (((t * 16) % 1500) - 150) + ' 0)');
    clouds[1].setAttribute('transform', 'translate(' + (((t * 11 + 900) % 1600) - 200) + ' 0)');
    clouds[2].setAttribute('transform', 'translate(' + (((t * 21 + 400) % 1500) - 150) + ' 0)');
    birds[0].setAttribute('transform', 'translate(' + (((t * 55) % 1600) - 200) + ' 0)');
    birds[1].setAttribute('transform', 'translate(' + (((t * 38 + 700) % 1600) - 200) + ' 0)');

    requestAnimationFrame(frame);
  }

  // 按窗口宽高比选择适配方式：宽屏裁切填满，窄屏完整显示
  function fit() {
    var ar = window.innerWidth / window.innerHeight;
    svg.setAttribute('preserveAspectRatio', ar >= 1.4 ? 'xMidYMid slice' : 'xMidYMid meet');
  }
  window.addEventListener('resize', fit);
  fit();

  // 尊重系统“减少动态效果”设置：静态呈现
  var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced) {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
