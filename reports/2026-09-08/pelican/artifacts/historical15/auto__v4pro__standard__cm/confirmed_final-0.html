<!DOCTYPE html>
<html lang="zh">
<head>

<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 26px 12px;
    background: linear-gradient(180deg, #c9ebf8 0%, #eef9fd 45%, #d6eef0 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #274b5e;
  }
  h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: 2px; }
  .sub { margin: 0; color: #4d7284; font-size: 14px; }
  .stage { width: min(1120px, 96vw); }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 18px 40px rgba(38,84,110,.25), 0 4px 12px rgba(38,84,110,.15);
  }
  .hint { font-size: 12px; color: #5b7f90; margin: 0; }
</style>
</head>

      <circle cx="-1.53" cy="-7.4" r="2.6" fill="#f0a4c2"/>

    <!-- 头（点头） -->

      <circle cx="505" cy="104" r="24" fill="#fbfbf6" stroke="#d8d8ca" stroke-width="2.5"/>

<p class="hint">轮子滚动 · 双脚蹬踏 · 远翅扇动 · 喉囊开合 · 路面与云朵循环后移</p>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var rear = $('rearWheel'), front = $('frontWheel'), crank = $('crank');
  var pedalN = $('pedalN'), pedalF = $('pedalF');
  var pelican = $('pelican'), wingF = $('wingF'), head = $('head'), pouch = $('pouch'), tail = $('tail');
  var fish1 = $('fish1'), fish2 = $('fish2');
  var rays = $('rays');
  var use1 = $('use1'), use2 = $('use2'), mUse1 = $('mUse1'), mUse2 = $('mUse2');
  var c1 = $('c1'), c2 = $('c2'), c3 = $('c3'), b1 = $('b1'), b2 = $('b2');
  var fThigh = $('fThigh'), fShin = $('fShin'), fKnee = $('fKnee');
  var nThigh = $('nThigh'), nShin = $('nShin'), nKnee = $('nKnee');

  var V = 150;          // 前进速度 px/s
  var RW = 62;          // 车轮半径
  var CX = 505, CY = 372, CR = 24;   // 中轴与曲柄半径
  var HIP_N = { x: 458, y: 238 };    // 近侧腿髋关节
  var HIP_F = { x: 446, y: 240 };    // 远侧腿髋关节

  function mod(n, m) { return ((n % m) + m) % m; }

  // 两段骨骼反向运动学：返回膝盖位置，膝盖朝前方(+x)弯曲
  function ik(hip, foot, l1, l2) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.min(l1 + l2 - 0.5, Math.max(Math.abs(l1 - l2) + 0.5, d));
    var ux = dx / d, uy = dy / d;
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var mx = hip.x + ux * a, my = hip.y + uy * a;
    var px = -uy, py = ux;
    if (mx + px * h < mx - px * h) { px = -px; py = -py; }
    return { x: mx + px * h, y: my + py * h };
  }

  function render(t) {
    var th = V * t / RW;                       // 车轮 / 曲柄角度
    var deg = th * 180 / Math.PI;

    rear.setAttribute('transform', 'rotate(' + deg + ')');
    front.setAttribute('transform', 'rotate(' + deg + ')');
    crank.setAttribute('transform', 'rotate(' + deg + ')');
    pedalN.setAttribute('transform', 'translate(24 0) rotate(' + (-deg) + ')');
    pedalF.setAttribute('transform', 'translate(-24 0) rotate(' + (-deg) + ')');

    // 身体起伏与轻微摇摆（随蹬踏节奏）
    var bob = 1.7 * Math.sin(2 * th + 1.1);
    var rock = 0.6 * Math.sin(th - 0.5);
    pelican.setAttribute('transform', 'translate(0 ' + bob + ') rotate(' + rock + ' 445 248)');

    wingF.setAttribute('transform', 'rotate(' + (9 * Math.sin(3.0 * t)) + ' 438 168)');
    head.setAttribute('transform', 'rotate(' + (3.5 * Math.sin(1.4 * t + 0.6)) + ' 505 128)');
    pouch.setAttribute('transform', 'rotate(' + (10 * Math.pow(Math.max(0, Math.sin(1.8 * t + 0.4)), 2)) + ' 521 111)');
    tail.setAttribute('transform', 'rotate(' + (3 * Math.sin(2.2 * t + 0.3)) + ' 352 198)');
    fish1.setAttribute('transform', 'rotate(' + (5 * Math.sin(3.4 * t)) + ' 689 272)');
    fish2.setAttribute('transform', 'rotate(' + (-4 * Math.sin(2.7 * t + 1)) + ' 703 268)');
    rays.setAttribute('transform', 'translate(135 100) rotate(' + (t * 8) + ')');

    // 腿：双脚分别钉在两个踏板上（相位差 180°），膝盖由 IK 求解
    var p1 = { x: CX + CR * Math.cos(th), y: CY + CR * Math.sin(th) };
    var p2 = { x: CX - CR * Math.cos(th), y: CY - CR * Math.sin(th) };
    var hN = { x: HIP_N.x, y: HIP_N.y + bob };
    var hF = { x: HIP_F.x, y: HIP_F.y + bob };
    var kN = ik(hN, p1, 82, 87);
    var kF = ik(hF, p2, 82, 87);

    nThigh.setAttribute('x1', hN.x); nThigh.setAttribute('y1', hN.y);
    nThigh.setAttribute('x2', kN.x); nThigh.setAttribute('y2', kN.y);
    nShin.setAttribute('x1', kN.x);  nShin.setAttribute('y1', kN.y);
    nShin.setAttribute('x2', p1.x);  nShin.setAttribute('y2', p1.y);
    nKnee.setAttribute('cx', kN.x);  nKnee.setAttribute('cy', kN.y);

    fThigh.setAttribute('x1', hF.x); fThigh.setAttribute('y1', hF.y);
    fThigh.setAttribute('x2', kF.x); fThigh.setAttribute('y2', kF.y);
    fShin.setAttribute('x1', kF.x);  fShin.setAttribute('y1', kF.y);
    fShin.setAttribute('x2', p2.x);  fShin.setAttribute('y2', p2.y);
    fKnee.setAttribute('cx', kF.x);  fKnee.setAttribute('cy', kF.y);

    // 地面景物循环滚动
    var off = -mod(V * t, 960);
    use1.setAttribute('x', off);
    use2.setAttribute('x', off + 960);
    var offM = -mod(V * 1.6 * t, 960);
    mUse1.setAttribute('x', offM);
    mUse2.setAttribute('x', offM + 960);

    // 云与飞鸟视差漂移
    c1.setAttribute('transform', 'translate(' + (mod(140 - 12 * t, 1200) - 200) + ' 90)');
    c2.setAttribute('transform', 'translate(' + (mod(520 - 9 * t, 1200) - 200) + ' 150)');
    c3.setAttribute('transform', 'translate(' + (mod(820 - 15 * t, 1200) - 200) + ' 70)');
    b1.setAttribute('transform', 'translate(' + (mod(600 - 28 * t, 1600) - 300) + ' 120)');
    b2.setAttribute('transform', 'translate(' + (mod(300 - 20 * t, 1600) - 300) + ' 200)');
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    render(0.4);   // 尊重系统"减少动态效果"设置：只渲染一帧静态画面
  } else {
    var t0 = performance.now();
    function tick(now) {
      render((now - t0) / 1000);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
})();
</script>
