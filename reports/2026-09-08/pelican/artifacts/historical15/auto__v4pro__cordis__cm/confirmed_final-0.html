<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑单车 · Pelican Ride</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    background: linear-gradient(160deg, #eaf7ff 0%, #d7ecf9 45%, #cfe3f2 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { text-align: center; }
  h1 { margin: 0; font-size: 1.7rem; color: #1f3a52; letter-spacing: .5px; }
  p.sub { margin: 6px 0 0; color: #55708a; font-size: .95rem; }
  .stage {
    width: min(900px, 96vw);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(30, 60, 90, .25);
    background: #fff;
  }
  svg { display: block; width: 100%; height: auto; cursor: pointer; }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border-radius: 999px;
    padding: 10px 18px;
    box-shadow: 0 6px 18px rgba(30, 60, 90, .14);
  }
  .controls label { color: #33506b; font-size: .9rem; white-space: nowrap; }
  input[type=range] { width: 160px; accent-color: #ef476f; }
  button {
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: .95rem;
    background: #ef476f;
    color: #fff;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button:hover { background: #d63d5f; }
  button:active { transform: scale(.96); }
  .hint { color: #6b869e; font-size: .82rem; }

  /* ---------- SVG 动画 ---------- */
  .sun-rays { animation: spin 45s linear infinite; transform-origin: 790px 88px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cloud {
    fill: #fff;
    animation: drift var(--dur) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes drift {
    from { transform: translateX(var(--from)); }
    to   { transform: translateX(var(--to)); }
  }

  .wing { animation: flap 3.4s ease-in-out infinite; transform-origin: 447px 296px; }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-9deg); }
  }

  .eye { animation: blink 4.6s infinite; transform-origin: 562px 190px; }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(.08); }
  }

  .pouch { animation: wobble 2.3s ease-in-out infinite; transform-origin: 606px 214px; }
  @keyframes wobble {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.02, 1.09); }
  }

  .fish { animation: swim 1.1s ease-in-out infinite; transform-origin: 612px 222px; }
  @keyframes swim {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(6deg); }
  }

  .shadow { animation: breathe .93s ease-in-out infinite; transform-origin: 452px 486px; }
  @keyframes breathe {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(.92); }
  }

  .dust1 { animation: puff 1.5s ease-out infinite; transform-origin: 300px 470px; }
  .dust2 { animation: puff 1.5s ease-out .75s infinite; transform-origin: 296px 478px; }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.7); opacity: 0; }
    25%  { opacity: .6; }
    100% { transform: translate(-75px, -16px) scale(1.8); opacity: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>🚲 鹈鹕骑单车 <span style="opacity:.6">· Pelican Ride</span></h1>
  <p class="sub">纯 SVG 手绘 2D 动画 —— 车轮、链条、路面与双骨骼蹬腿全联动</p>
</header>

<div class="stage">
  <svg id="scene" viewBox="0 0 900 500" role="img" aria-label="一只鹈鹕骑着自行车前行">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe7fb"/><stop offset="1" stop-color="#eef9ff"/>
      </linearGradient>
      <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd06e"/><stop offset="1" stop-color="#58a344"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#59636f"/><stop offset="1" stop-color="#3d4650"/>
      </linearGradient>
      <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#ffc93c"/>
      </radialGradient>
    </defs>

    <!-- 天空 -->
    <rect width="900" height="390" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g class="sun-rays" stroke="#ffc93c" stroke-width="5" stroke-linecap="round">
      <line x1="840" y1="88" x2="856" y2="88"/>
      <line x1="825.4" y1="52.6" x2="836.7" y2="41.3"/>
      <line x1="790" y1="38" x2="790" y2="22"/>
      <line x1="754.6" y1="52.6" x2="743.3" y2="41.3"/>
      <line x1="740" y1="88" x2="724" y2="88"/>
      <line x1="754.6" y1="123.4" x2="743.3" y2="134.7"/>
      <line x1="790" y1="138" x2="790" y2="154"/>
      <line x1="825.4" y1="123.4" x2="836.7" y2="134.7"/>
    </g>
    <circle cx="790" cy="88" r="40" fill="url(#sunG)"/>

    <!-- 云朵 -->
    <g transform="translate(0,95)">
      <g class="cloud" style="--from:1000px; --to:-300px; --dur:46s; --delay:0s">
        <ellipse cx="0" cy="0" rx="40" ry="18"/>
        <ellipse cx="-30" cy="7" rx="24" ry="13"/>
        <ellipse cx="32" cy="7" rx="26" ry="14"/>
      </g>
    </g>
    <g transform="translate(0,150) scale(.8)" opacity=".92">
      <g class="cloud" style="--from:900px; --to:-260px; --dur:64s; --delay:-26s">
        <ellipse cx="0" cy="0" rx="40" ry="18"/>
        <ellipse cx="-30" cy="7" rx="24" ry="13"/>
        <ellipse cx="32" cy="7" rx="26" ry="14"/>
      </g>
    </g>
    <g transform="translate(0,232) scale(.6)" opacity=".85">
      <g class="cloud" style="--from:1080px; --to:-200px; --dur:90s; --delay:-58s">
        <ellipse cx="0" cy="0" rx="40" ry="18"/>
        <ellipse cx="-30" cy="7" rx="24" ry="13"/>
        <ellipse cx="32" cy="7" rx="26" ry="14"/>
      </g>
    </g>

    <!-- 远山与树木 -->
    <ellipse cx="140" cy="402" rx="230" ry="62" fill="#c9e9ae"/>
    <ellipse cx="770" cy="408" rx="270" ry="72" fill="#b9e29d"/>
    <g>
      <rect x="126" y="338" width="12" height="44" rx="3" fill="#7a5230"/>
      <circle cx="132" cy="318" r="30" fill="#63a94f"/>
      <circle cx="108" cy="328" r="20" fill="#74b85e"/>
      <circle cx="156" cy="328" r="20" fill="#74b85e"/>
    </g>
    <g>
      <rect x="806" y="356" width="12" height="34" rx="3" fill="#7a5230"/>
      <circle cx="812" cy="340" r="24" fill="#63a94f"/>
      <circle cx="794" cy="347" r="16" fill="#74b85e"/>
      <circle cx="830" cy="347" r="16" fill="#74b85e"/>
    </g>

    <!-- 草地与路面 -->
    <rect y="390" width="900" height="110" fill="url(#grass)"/>
    <rect y="440" width="900" height="60" fill="url(#road)"/>
    <line x1="0" y1="448" x2="900" y2="448" stroke="#ffffff" stroke-opacity=".4" stroke-width="3"/>
    <line id="dashes" x1="0" y1="468" x2="900" y2="468" stroke="#f6f8fa" stroke-opacity=".92" stroke-width="5" stroke-dasharray="48 36"/>
    <line x1="0" y1="492" x2="900" y2="492" stroke="#ffffff" stroke-opacity=".4" stroke-width="3"/>
    <g stroke="#4e8f3c" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M70 430 q-3 -10 -8 -12 M74 430 q0 -11 -2 -14 M78 430 q3 -9 7 -11"/>
      <path d="M255 420 q-3 -8 -7 -10 M259 420 q0 -9 -2 -12 M263 420 q3 -7 6 -9"/>
      <path d="M690 428 q-3 -9 -7 -11 M694 428 q0 -10 -2 -13 M698 428 q3 -8 6 -10"/>
    </g>
    <circle cx="95" cy="422" r="4" fill="#ff8fab"/><circle cx="95" cy="422" r="1.6" fill="#ffd23f"/>
    <circle cx="720" cy="418" r="4" fill="#ffffff"/><circle cx="720" cy="418" r="1.6" fill="#ff8fab"/>

    <!-- 车影 -->
    <ellipse class="shadow" cx="452" cy="486" rx="150" ry="13" fill="#1f2937" opacity=".16"/>

    <!-- ============ 自行车 ============ -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- 链条 -->
      <path id="chain" d="M340 431 L465 418 A22 22 0 0 1 465 462 L340 449 A9 9 0 0 0 340 431 Z"
            fill="none" stroke="#2b2f36" stroke-width="3.5" stroke-dasharray="5.5 4.5"/>

      <!-- 后轮 -->
      <g id="rearWheel">
        <circle cx="340" cy="440" r="45" fill="none" stroke="#2b2f36" stroke-width="9"/>
        <circle cx="340" cy="440" r="33" fill="none" stroke="#aab4c2" stroke-width="3"/>
        <g stroke="#9aa4b2" stroke-width="2.5">
          <line x1="340" y1="404" x2="340" y2="476"/>
          <line x1="304" y1="440" x2="376" y2="440"/>
          <line x1="314.5" y1="414.5" x2="365.5" y2="465.5"/>
          <line x1="365.5" y1="414.5" x2="314.5" y2="465.5"/>
        </g>
        <circle cx="340" cy="440" r="9" fill="#e9ecef" stroke="#2b2f36" stroke-width="2.5"/>
        <circle cx="340" cy="440" r="7" fill="#2b2f36"/>
        <circle cx="340" cy="395" r="3" fill="#e63946"/>
      </g>

      <!-- 前轮 -->
      <g id="frontWheel">
        <circle cx="600" cy="440" r="45" fill="none" stroke="#2b2f36" stroke-width="9"/>
        <circle cx="600" cy="440" r="33" fill="none" stroke="#aab4c2" stroke-width="3"/>
        <g stroke="#9aa4b2" stroke-width="2.5">
          <line x1="600" y1="404" x2="600" y2="476"/>
          <line x1="564" y1="440" x2="636" y2="440"/>
          <line x1="574.5" y1="414.5" x2="625.5" y2="465.5"/>
          <line x1="625.5" y1="414.5" x2="574.5" y2="465.5"/>
        </g>
        <circle cx="600" cy="440" r="7" fill="#2b2f36"/>
        <circle cx="600" cy="395" r="3" fill="#e63946"/>
      </g>

      <!-- 远端腿（在车架之后） -->
      <g id="farLegGroup">
        <path id="legFar" d="" fill="none" stroke="#e8891f" stroke-width="8.5"/>
        <path id="footFar" d="M -12 0 Q -6 -6 1 -6 Q 7 -6 11 -3 L 15 -2 Q 19 0 16 3 Q 9 6 -12 2 Z"
              fill="#e8891f" stroke="#c96f14" stroke-width="1.5" stroke-linejoin="round"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="#ef476f" stroke-width="8">
        <path d="M430 352 L465 440"/>
        <path d="M430 352 L586 322"/>
        <path d="M586 322 L465 440"/>
        <path d="M465 440 L340 440"/>
        <path d="M340 440 L430 352"/>
      </g>
      <path d="M586 322 L600 440" fill="none" stroke="#2b2f36" stroke-width="7"/>
      <line x1="586" y1="320" x2="594" y2="334" stroke="#2b2f36" stroke-width="10"/>
      <path d="M586 316 Q562 292 545 297" fill="none" stroke="#2b2f36" stroke-width="7"/>
      <line x1="545" y1="297" x2="536" y2="291" stroke="#ef476f" stroke-width="9"/>
      <line x1="430" y1="352" x2="430" y2="344" stroke="#2b2f36" stroke-width="6"/>
      <ellipse cx="430" cy="340" rx="28" ry="10" fill="#2b2f36" transform="rotate(-8 430 340)"/>

      <!-- 曲柄与牙盘 -->
      <g id="crank">
        <circle cx="465" cy="440" r="22" fill="#e9ecef" stroke="#2b2f36" stroke-width="3"/>
        <circle cx="465" cy="440" r="8" fill="#2b2f36"/>
        <g fill="#2b2f36">
          <circle cx="465" cy="426" r="2.5"/>
          <circle cx="465" cy="454" r="2.5"/>
          <circle cx="451" cy="440" r="2.5"/>
          <circle cx="479" cy="440" r="2.5"/>
        </g>
        <line x1="465" y1="440" x2="489" y2="440" stroke="#2b2f36" stroke-width="7"/>
        <line x1="465" y1="440" x2="441" y2="440" stroke="#2b2f36" stroke-width="7"/>
      </g>

      <!-- 脚踏 -->
      <rect id="pedal1" x="-999" y="-999" width="30" height="9" rx="4.5" fill="#2b2f36"/>
      <rect id="pedal2" x="-999" y="-999" width="30" height="9" rx="4.5" fill="#2b2f36"/>

      <!-- 扬尘 -->
      <circle class="dust1" cx="300" cy="470" r="7" fill="#d8d2c4" opacity="0"/>
      <circle class="dust2" cx="296" cy="478" r="5" fill="#d8d2c4" opacity="0"/>
    </g>

    <!-- ============ 鹈鹕 ============ -->
    <g id="pelican">
      <!-- 尾巴 -->
      <path d="M398 304 Q366 292 371 268 Q397 278 411 295 Z" fill="#eef3f3" stroke="#d5dede" stroke-width="2"/>
      <!-- 脖子 -->
      <path d="M479 281 Q510 252 520 227 Q526 209 545 199" fill="none" stroke="#e2e9e9" stroke-width="24" stroke-linecap="round"/>
      <path d="M478 278 Q508 248 518 223 Q524 205 543 196" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="455" cy="305" rx="58" ry="44" fill="#ffffff" stroke="#dde5e5" stroke-width="2.5" transform="rotate(-8 455 305)"/>
      <ellipse cx="462" cy="324" rx="40" ry="23" fill="#eef4f4"/>
      <!-- 翅膀 -->
      <g class="wing">
        <path d="M428 292 Q466 268 500 294 Q468 320 432 316 Z" fill="#e6eded" stroke="#ccd8d8" stroke-width="2"/>
        <path d="M432 304 Q462 288 492 300" fill="none" stroke="#ccd8d8" stroke-width="1.5"/>
      </g>
      <!-- 头部 -->
      <circle cx="556" cy="196" r="19" fill="#ffffff" stroke="#dde5e5" stroke-width="2"/>
      <!-- 眼睛 -->
      <g class="eye">
        <circle cx="562" cy="190" r="3.5" fill="#26303b"/>
        <circle cx="561" cy="189" r="1.2" fill="#ffffff"/>
      </g>
      <!-- 头盔 -->
      <path d="M537 182 A19 19 0 0 1 575 182 Z" fill="#ef476f" stroke="#d63d5f" stroke-width="2"/>
      <path d="M538 182 L560 204" fill="none" stroke="#d63d5f" stroke-width="2.5"/>
      <path d="M546 172 Q556 176 566 172" fill="none" stroke="#d63d5f" stroke-width="2"/>
      <!-- 上喙 -->
      <path d="M572 191 Q614 183 639 195 Q617 205 572 205 Z" fill="#f7a823" stroke="#e08e12" stroke-width="2"/>
      <path d="M586 191 Q592 194 586 197" fill="none" stroke="#e08e12" stroke-width="1.5"/>
      <!-- 喉囊与小鱼 -->
      <g class="pouch">
        <path d="M572 204 Q594 244 628 238 Q638 228 640 204 Q612 219 572 204 Z" fill="#f9c74f" stroke="#e9a93c" stroke-width="2"/>
        <g class="fish">
          <ellipse cx="612" cy="222" rx="13" ry="6.5" fill="#3f7d99"/>
          <path d="M624 218 L637 222 L624 226 Z" fill="#3f7d99"/>
          <circle cx="604" cy="221" r="1.4" fill="#ffffff"/>
        </g>
      </g>
      <!-- 大腿 -->
      <ellipse cx="440" cy="344" rx="17" ry="13" fill="#ffffff" stroke="#dde5e5" stroke-width="2"/>
      <!-- 近端腿与脚 -->
      <path id="legNear" d="" fill="none" stroke="#f59e34" stroke-width="8.5"/>
      <path id="footNear" d="M -12 0 Q -6 -6 1 -6 Q 7 -6 11 -3 L 15 -2 Q 19 0 16 3 Q 9 6 -12 2 Z"
            fill="#f59e34" stroke="#c96f14" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </svg>
</div>

<div class="controls">
  <label for="speed">🚴 速度</label>
  <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1">
  <span id="speedVal" style="color:#33506b;font-size:.9rem;min-width:44px">1.0×</span>
  <button id="pauseBtn">⏸ 暂停</button>
</div>
<p class="hint">💡 点击画面也可以暂停 / 继续 · 看，鹈鹕的喉囊里还藏着一条小鱼 🐟</p>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rear = $('rearWheel'), front = $('frontWheel'), crank = $('crank'),
      chain = $('chain'), dashes = $('dashes'),
      pelican = $('pelican'), farLegGroup = $('farLegGroup'),
      pedal1 = $('pedal1'), pedal2 = $('pedal2'),
      legFar = $('legFar'), legNear = $('legNear'),
      footFar = $('footFar'), footNear = $('footNear');

  var BB = { x: 465, y: 440 };   // 中轴（曲柄中心）
  var HIP = { x: 436, y: 344 };  // 髋关节
  var CRANK = 24;                // 曲柄长度
  var GEAR = 22 / 9;             // 牙盘/飞轮传动比
  var L1 = 64, L2 = 60;          // 大腿、小腿长度

  var angle = 0, mul = 1, running = true, last = performance.now();

  // 双骨骼 IK：髋 → 膝 → 脚踏
  function ik(px, py) {
    var dx = px - HIP.x, dy = py - HIP.y;
    var d = Math.hypot(dx, dy);
    var max = L1 + L2 - 0.5;
    if (d > max) { px = HIP.x + dx * max / d; py = HIP.y + dy * max / d; d = max; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var ux = dx / d, uy = dy / d;
    var kx1 = HIP.x + a * ux - h * uy, ky1 = HIP.y + a * uy + h * ux;
    var kx2 = HIP.x + a * ux + h * uy, ky2 = HIP.y + a * uy - h * ux;
    var kx = kx1 >= kx2 ? kx1 : kx2;   // 膝盖朝前
    var ky = kx1 >= kx2 ? ky1 : ky2;
    return [kx, ky, px, py];
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (running) angle += 1.7 * mul * dt;

    var deg = angle * 180 / Math.PI;
    var wdeg = angle * GEAR * 180 / Math.PI;
    rear.setAttribute('transform', 'rotate(' + wdeg + ' 340 440)');
    front.setAttribute('transform', 'rotate(' + wdeg + ' 600 440)');
    crank.setAttribute('transform', 'rotate(' + deg + ' 465 440)');
    chain.setAttribute('stroke-dashoffset', ((-angle * 22) % 10 + 10) % 10);
    dashes.setAttribute('stroke-dashoffset', (angle * GEAR * 45) % 84);

    var bob = Math.sin(2 * angle) * 2.6;          // 蹬踏节奏的身体起伏
    var ty = 'translate(0 ' + bob + ')';
    pelican.setAttribute('transform', ty);
    farLegGroup.setAttribute('transform', ty);

    var c = Math.cos(angle), s = Math.sin(angle);
    var p1x = BB.x + CRANK * c, p1y = BB.y + CRANK * s;
    var p2x = BB.x - CRANK * c, p2y = BB.y - CRANK * s;
    pedal1.setAttribute('x', p1x - 15); pedal1.setAttribute('y', p1y - 4.5);
    pedal2.setAttribute('x', p2x - 15); pedal2.setAttribute('y', p2y - 4.5);

    var k1 = ik(p1x, p1y - bob);
    var k2 = ik(p2x, p2y - bob);
    legNear.setAttribute('d', 'M ' + HIP.x + ' ' + HIP.y + ' L ' + k1[0] + ' ' + k1[1] + ' L ' + k1[2] + ' ' + k1[3]);
    legFar.setAttribute('d', 'M ' + HIP.x + ' ' + HIP.y + ' L ' + k2[0] + ' ' + k2[1] + ' L ' + k2[2] + ' ' + k2[3]);
    footNear.setAttribute('transform', 'translate(' + k1[2] + ' ' + k1[3] + ')');
    footFar.setAttribute('transform', 'translate(' + k2[2] + ' ' + k2[3] + ')');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function toggle() {
    running = !running;
    $('pauseBtn').textContent = running ? '⏸ 暂停' : '▶ 继续';
  }
  $('scene').addEventListener('click', toggle);
  $('pauseBtn').addEventListener('click', toggle);
  $('speed').addEventListener('input', function (e) {
    mul = parseFloat(e.target.value);
    $('speedVal').textContent = mul.toFixed(1) + '×';
  });
})();
</script>
</body>
</html>
