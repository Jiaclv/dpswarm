<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 2D 动画</title>
<style>
  :root { --accent: #e8503a; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 28px 12px;
    background: linear-gradient(180deg, #eef5fb 0%, #d9e8f5 100%);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #2b3a4a;
  }
  h1 { margin: 0; font-size: 27px; letter-spacing: 1px; }
  h1 .dot { color: var(--accent); }
  .subtitle { margin: 0; font-size: 14px; color: #5f7386; text-align: center; }
  .stage {
    width: min(1080px, 100%);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 14px 36px rgba(43, 58, 74, .18);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 14px;
  }
  input[type="range"] { width: 220px; accent-color: var(--accent); }
  button {
    padding: 6px 20px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #b8c9d8;
    background: #fff;
    color: #2b3a4a;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #eef4fa; }
  button:disabled { opacity: .45; cursor: default; }
  .note { margin: 0; font-size: 13px; color: #7a8b9c; text-align: center; }
  noscript {
    display: block;
    margin: 10px auto 0;
    max-width: 640px;
    padding: 10px 16px;
    border-radius: 8px;
    background: #fff3cd;
    border: 1px solid #f0d68a;
    color: #7a5c1e;
    font-size: 14px;
  }
</style>
</head>

  <noscript>
    当前浏览器已禁用 JavaScript。本页动画由少量脚本驱动（用于腿部运动学与视差滚动），

  </noscript>

<script>
(function () {
  "use strict";

  /* ---------- 元素引用 ---------- */
  function $(id) { return document.getElementById(id); }
  var scene = $("scene");
  var wheelR = $("wheelRearSpin"), wheelF = $("wheelFrontSpin");
  var crank = $("crankGroup");
  var pedalL = $("pedalLeftLevel"), pedalR = $("pedalRightLevel");
  var legFar = $("legFar"), footFar = $("footFar");
  var legNear = $("legNear"), footNear = $("footNear");
  var pelican = $("pelicanGroup"), tail = $("tailGroup");
  var wing = $("wingGroup"), head = $("headGroup");
  var sunRays = $("sunRays");
  var cloudLayer = $("cloudLayer"), hillLayer = $("hillLayer"), treeLayer = $("treeLayer");
  var dash = $("roadDash");
  var speedCtl = $("speed"), speedLabel = $("speedLabel"), pauseBtn = $("pauseBtn");

  /* 关键元素缺失时静默退出，只显示静态画面 */
  if (!scene || !wheelR || !crank || !legNear) { return; }

  /* ---------- 运动参数 ---------- */
  var PERIOD = 2.6;             // 曲柄转一圈的秒数（车轮同周期，保证轮速与踏频一致）
  var BB = { x: 500, y: 360 };  // 中轴（五通）坐标
  var CRANK_R = 34;             // 曲柄半径
  var hipNear = { x: 548, y: 290 }; // 近侧髋关节
  var hipFar  = { x: 540, y: 296 }; // 远侧髋关节
  var THIGH = 48, SHIN = 64;    // 大腿 / 小腿长度
  var WIDTH = 1200;             // 视口宽度，用于视差层无缝循环

  /* ---------- 两连杆运动学（IK）：由髋、脚两点求膝盖 ---------- */
  function solveKnee(hip, foot, sign) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.min(Math.max(d, 8), THIGH + SHIN - 1); // 防奇异与超伸
    var ux = dx / d, uy = dy / d;
    var a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(THIGH * THIGH - a * a, 0));
    var mx = hip.x + ux * a, my = hip.y + uy * a;
    // 垂直方向取 (uy, -ux)，让膝盖朝行进方向（+x）
    return { x: mx + sign * h * uy, y: my - sign * h * ux };
  }
  function fmt(n) { return n.toFixed(2); }

  /* ---------- 动画状态 ---------- */
  var speed = 1, paused = false, animT = 0, last = performance.now();

  /* ---------- 渲染一帧（t 为动画累计秒数） ---------- */
  function render(t) {
    var theta = 2 * Math.PI * ((t % PERIOD) / PERIOD); // 曲柄相位角
    var deg = theta * 180 / Math.PI;

    /* 车轮、曲柄、踏板（踏板反向旋转以保持水平） */
    wheelR.setAttribute("transform", "rotate(" + fmt(deg) + ")");
    wheelF.setAttribute("transform", "rotate(" + fmt(deg) + ")");
    crank.setAttribute("transform", "rotate(" + fmt(deg) + " " + BB.x + " " + BB.y + ")");
    pedalL.setAttribute("transform", "rotate(" + fmt(-deg) + ")");
    pedalR.setAttribute("transform", "rotate(" + fmt(-deg) + ")");

    /* 踏板世界坐标 → 脚踝 → 膝盖 → 腿 */
    var pn = { x: BB.x + CRANK_R * Math.cos(theta),         y: BB.y + CRANK_R * Math.sin(theta) };
    var pf = { x: BB.x + CRANK_R * Math.cos(theta + Math.PI), y: BB.y + CRANK_R * Math.sin(theta + Math.PI) };
    var fn = { x: pn.x + 12, y: pn.y - 3 }; // 脚尖略前伸
    var ff = { x: pf.x + 12, y: pf.y - 3 };
    var kn = solveKnee(hipNear, fn, 1);
    var kf = solveKnee(hipFar, ff, 1);
    legNear.setAttribute("points", hipNear.x + "," + hipNear.y + " " +
      fmt(kn.x) + "," + fmt(kn.y) + " " + fmt(fn.x) + "," + fmt(fn.y));
    legFar.setAttribute("points", hipFar.x + "," + hipFar.y + " " +
      fmt(kf.x) + "," + fmt(kf.y) + " " + fmt(ff.x) + "," + fmt(ff.y));
    footNear.setAttribute("transform", "translate(" + fmt(fn.x) + " " + fmt(fn.y) + ") rotate(-10)");
    footFar.setAttribute("transform", "translate(" + fmt(ff.x) + " " + fmt(ff.y) + ") rotate(-10)");

    /* 身体起伏（每圈两次）、尾巴摆动、翅膀扇动、头部轻点 */
    pelican.setAttribute("transform", "translate(0 " + fmt(3 * Math.sin(2 * theta - 0.6)) + ")");
    tail.setAttribute("transform", "rotate(" + fmt(2.5 * Math.sin(2 * theta + 0.8)) + " 455 222)");
    wing.setAttribute("transform", "rotate(" + fmt(9 * Math.sin(2 * Math.PI * 0.9 * t) - 1) + " 526 208)");
    head.setAttribute("transform", "rotate(" + fmt(2 * Math.sin(2 * theta + 0.5)) + " 540 200)");

    /* 太阳光线缓慢旋转（60 秒一圈） */
    sunRays.setAttribute("transform", "rotate(" + fmt((t * 6) % 360) + " 130 92)");

    /* 视差背景滚动；路面虚线速度与车轮线速度一致 */
    var vBike = 2 * Math.PI * 80 / PERIOD; // 像素/秒
    cloudLayer.setAttribute("transform", "translate(" + fmt(-((t * 26) % WIDTH)) + " 0)");
    hillLayer.setAttribute("transform", "translate(" + fmt(-((t * 40) % WIDTH)) + " 0)");
    treeLayer.setAttribute("transform", "translate(" + fmt(-((t * 70) % WIDTH)) + " 0)");
    dash.setAttribute("stroke-dashoffset", fmt((t * vBike) % 120));
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    var dt = now - last;
    last = now;
    if (!paused) { animT += dt * speed / 1000; }
    render(animT);
    requestAnimationFrame(frame);
  }

  /* ---------- 交互 ---------- */
  if (speedCtl) {
    speedCtl.addEventListener("input", function () {
      speed = parseFloat(speedCtl.value) || 1;
      if (speedLabel) { speedLabel.textContent = speed.toFixed(1) + "×"; }
    });
  }
  if (pauseBtn) {
    pauseBtn.addEventListener("click", function () {
      paused = !paused;
      pauseBtn.textContent = paused ? "播放" : "暂停";
    });
  }

  /* ---------- 启动（尊重“减少动态效果”偏好：只渲染一帧静态画面） ---------- */
  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) { /* 忽略不支持的环境 */ }

  if (reduceMotion) {
    render(0.35);
    if (pauseBtn) { pauseBtn.disabled = true; }
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
