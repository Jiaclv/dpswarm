  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const els = {
        pelican: $('pelican'), head: $('head'),
        armA: $('armA'), armB: $('armB'), chainringSpin: $('chainringSpin'),
        pedalA: $('pedalA'), pedalB: $('pedalB'),
        rearSpin: $('rearSpin'), frontSpin: $('frontSpin'),
        legA: $('legA'), legB: $('legB'),
        kneeA: $('kneeA'), kneeB: $('kneeB'),
        footA: $('footA'), footB: $('footB'),
        beakUp: $('beakUp'), beakLow: $('beakLow'),
        wingF: $('wingF'), wingB: $('wingB'),
        eye: $('eye'), pupil: $('pupil'),
        roadMarks: $('roadMarks')
      };

      // 中轴（牙盘中心）与曲柄半径
      const C = { x: 440, y: 372 };
      const R = 32;
      const WHEEL_R = 80;

      // 两个髋关节（隐藏于身体内部）及大腿/小腿长度
      const hips = [
        { x: 432, y: 240, l1: 77, l2: 88 },
        { x: 452, y: 244, l1: 77, l2: 88 }
      ];

      // 两段式腿部逆向运动学：髋固定，脚踩踏板，膝盖朝前
      function ik(H, P, l1, l2) {
        let dx = P.x - H.x, dy = P.y - H.y;
        let d = Math.hypot(dx, dy);
        const max = l1 + l2 - 0.6;
        if (d > max) { dx *= max / d; dy *= max / d; d = max; }
        const ux = dx / d, uy = dy / d;
        const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
        const kx1 = H.x + a * ux - h * uy, ky1 = H.y + a * uy + h * ux;
        const kx2 = H.x + a * ux + h * uy, ky2 = H.y + a * uy - h * ux;
        return kx1 >= kx2 ? { x: kx1, y: ky1 } : { x: kx2, y: ky2 };
      }

      const start = performance.now();

      function frame(now) {
        const t = (now - start) / 1000;
        const th = t * 2.7;               // 曲柄角（rad）
        const sn = Math.sin(th), cs = Math.cos(th);
        const deg = th * 180 / Math.PI;

        // 两个脚踏的世界坐标
        const p1 = { x: C.x + R * sn, y: C.y - R * cs };
        const p2 = { x: C.x - R * sn, y: C.y + R * cs };

        // 曲柄 / 牙盘 / 脚踏
        els.armA.setAttribute('transform', 'rotate(' + deg + ')');
        els.armB.setAttribute('transform', 'rotate(' + (deg + 180) + ')');
        els.chainringSpin.setAttribute('transform', 'rotate(' + deg + ')');
        els.pedalA.setAttribute('transform', 'translate(' + (p1.x - C.x) + ' ' + (p1.y - C.y) + ')');
        els.pedalB.setAttribute('transform', 'translate(' + (p2.x - C.x) + ' ' + (p2.y - C.y) + ')');

        // 车轮与地面标线：线速度 = 曲柄角速度 × 曲柄半径
        const wdeg = deg * R / WHEEL_R;
        els.rearSpin.setAttribute('transform', 'rotate(' + wdeg + ')');
        els.frontSpin.setAttribute('transform', 'rotate(' + wdeg + ')');
        els.roadMarks.setAttribute('stroke-dashoffset', String(-((th * R) % 64)));

        // 双腿 IK：髋 A → 脚踏 1，髋 B → 脚踏 2
        [
          [els.legA, els.kneeA, els.footA, hips[0], p1],
          [els.legB, els.kneeB, els.footB, hips[1], p2]
        ].forEach(function (row) {
          const leg = row[0], knee = row[1], foot = row[2], H = row[3], P = row[4];
          const K = ik(H, P, H.l1, H.l2);
          leg.setAttribute('d',
            'M ' + H.x + ' ' + H.y + ' L ' + K.x.toFixed(1) + ' ' + K.y.toFixed(1) +
            ' L ' + P.x.toFixed(1) + ' ' + P.y.toFixed(1));
          knee.setAttribute('transform', 'translate(' + K.x.toFixed(1) + ' ' + K.y.toFixed(1) + ')');
          foot.setAttribute('transform', 'translate(' + P.x.toFixed(1) + ' ' + P.y.toFixed(1) + ')');
        });

        // 身体随踩踏节奏起伏、头部反向轻晃
        const b2 = Math.sin(2 * th);
        els.pelican.setAttribute('transform',
          'translate(0 ' + (2.6 * b2 + 0.6).toFixed(2) + ') rotate(' + (1.4 * b2).toFixed(2) + ' 430 195)');
        els.head.setAttribute('transform',
          'translate(0 ' + (1.8 * Math.sin(2 * th + 1.2)).toFixed(2) + ') rotate(' +
          (2 * Math.sin(2 * th + 0.7)).toFixed(2) + ' 612 110)');

        // 喙张合
        const open = 0.5 + 0.5 * Math.sin(t * 2.1);
        els.beakUp.setAttribute('transform', 'rotate(' + (-(2 + 9 * open)) + ' 646 100)');
        els.beakLow.setAttribute('transform', 'rotate(' + (1 + 8 * open) + ' 650 116)');

        // 翅膀扇动（前后翅膀反相）
        els.wingF.setAttribute('transform',
          'rotate(' + (10 + 17 * Math.sin(t * 2.8) + 6 * Math.sin(t * 5.7)).toFixed(1) + ' 470 185)');
        els.wingB.setAttribute('transform',
          'rotate(' + (-(8 + 15 * Math.sin(t * 2.8 + 2.6))).toFixed(1) + ' 470 185)');

        // 眨眼
        const bt = t % 3.9;
        const sy = bt < 0.13 ? 0.08 : 1;
        els.eye.setAttribute('transform',
          'translate(626 96) scale(1 ' + sy + ') translate(-626 -96)');
        els.pupil.setAttribute('transform', 'translate(' + (1.5 * open).toFixed(2) + ' 0)');

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
