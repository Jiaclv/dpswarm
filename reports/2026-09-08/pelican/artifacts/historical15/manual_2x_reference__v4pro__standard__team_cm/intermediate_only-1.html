<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var CX = 598, CY = 408, CR = 26;          // 曲柄中心 / 曲柄半径
  var HIP = { x: 552, y: 306 };             // 髋关节
  var L1 = 74, L2 = 66;                     // 大腿 / 小腿长度
  var SPEED = 210, WHEEL_R = 56, CRANK_W = 5.2;
  var RAD = Math.PI / 180;
  var last = performance.now(), t = 0, blinkStart = -10;
  var wheelAng = { rear: 0, front: 0 };

  function setTr(el, x, y) {
    el.setAttribute('transform', 'translate(' + x + ',' + y + ')');
  }
  function rot(el, deg, x, y) {
    el.setAttribute('transform', 'rotate(' + deg + ' ' + x + ' ' + y + ')');
  }

  // 两圆交点法求膝关节（大腿 L1、小腿 L2 的两连杆 IK）
  function kneeFor(foot) {
    var dx = foot.x - HIP.x, dy = foot.y - HIP.y;
    var d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.5), L1 + L2 - 1);
    var nx = dx / d, ny = dy / d;
    var a = (d * d + L1 * L1 - L2 * L2) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var bx = HIP.x + nx * a, by = HIP.y + ny * a;
    var k1 = { x: bx - ny * h, y: by + nx * h };
    var k2 = { x: bx + ny * h, y: by - nx * h };
    return k1.y < k2.y ? k1 : k2; // 膝盖取较高的解
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now; t += dt;

    var th = CRANK_W * t;
    // 车轮（向右行驶 → 顺时针旋转）
    var wheelD = (SPEED / WHEEL_R) * dt;
    wheelAng.rear += wheelD; wheelAng.front += wheelD;
    rot($('wheelRear'), wheelAng.rear / RAD, 468, 414);
    rot($('wheelFront'), wheelAng.front / RAD, 728, 414);

    // 曲柄与踏板
    rot($('crank'), th / RAD, CX, CY);
    var p1 = { x: CX + CR * Math.cos(th), y: CY + CR * Math.sin(th) };
    var p2 = { x: CX - CR * Math.cos(th), y: CY - CR * Math.sin(th) };
    setTr($('pedalNear'), p1.x, p1.y);
    setTr($('pedalFar'), p2.x, p2.y);
    setTr($('footNear'), p1.x, p1.y);
    setTr($('footFar'), p2.x, p2.y);

    // 双腿 IK
    var k1 = kneeFor(p1), k2 = kneeFor(p2);
    $('legNear').setAttribute('d', 'M' + HIP.x + ',' + HIP.y + ' L' + k1.x + ',' + k1.y + ' L' + p1.x + ',' + p1.y);
    $('legFar').setAttribute('d', 'M' + HIP.x + ',' + HIP.y + ' L' + k2.x + ',' + k2.y + ' L' + p2.x + ',' + p2.y);

    // 鹈鹕：身体起伏 + 轻微前后摆动 + 点头
    setTr($('pelican'), 2 * Math.sin(th), 2.5 * Math.sin(2 * th));
    rot($('head'), 2.5 * Math.sin(2 * th + 0.8), 612, 220);
    // 翅膀 / 尾羽
    rot($('wingFar'), -16 + 27 * Math.sin(t * 9.2), 548, 254);
    rot($('wingNear'), -2 + 5 * Math.sin(t * 6.5 - 0.6), 560, 258);
    rot($('tail'), 5 * Math.sin(t * 9.2 + 1), 478, 258);
    // 喉囊晃动 / 下喙张合
    var psw = 2.5 * Math.sin(t * 3.1);
    var psc = 1 + 0.05 * Math.sin(t * 2.6);
    $('pouch').setAttribute('transform',
      'translate(654,216) rotate(' + psw + ') scale(' + psc + ',' + psc + ') translate(-654,-216)');
    rot($('beakLower'), 3.5 * (0.5 + 0.5 * Math.sin(t * 0.7)), 652, 213);
    // 眨眼
    if (t - blinkStart > 3.4) blinkStart = t;
    var bt = t - blinkStart;
    var eye = bt < 0.12 ? Math.max(0.12, 1 - bt / 0.12) : 1;
    $('eye').setAttribute('transform', 'translate(641,206) scale(1,' + eye + ') translate(-641,-206)');

    // 环境
    rot($('rays'), t * 7, 140, 108);
    var sc = 1 + 0.04 * Math.sin(t * 1.6);
    $('sunCore').setAttribute('transform', 'translate(140,108) scale(' + sc + ') translate(-140,-108)');

    setTr($('hillsBack'), -((t * 10) % 300), 0);
    setTr($('hillsFront'), -((t * 18) % 220), 0);
    setTr($('wavesA'), -((t * 45) % 160), 0);
    setTr($('wavesB'), -((t * 30) % 160), 0);
    setTr($('boat'), 1350 - ((t * 35) % 1600), 415 + 2 * Math.sin(t * 1.1));
    setTr($('dashes'), -((t * SPEED) % 110), 0);
    setTr($('flowers'), -((t * SPEED) % 150), 0);
    setTr($('cloud1'), 1350 - ((t * 16) % 1510), 80 + 3 * Math.sin(t * 0.5));
    setTr($('cloud2'), 1350 - ((t * 24 + 700) % 1510), 170);
    setTr($('cloud3'), 1350 - ((t * 11 + 300) % 1510), 52);
    setTr($('gull'), 1250 - ((t * 30) % 1500), 130 + 4 * Math.sin(t * 2));
    rot($('gullL'), 26 * Math.sin(t * 11), 0, 0);
    rot($('gullR'), -26 * Math.sin(t * 11), 0, 0);

    $('sl1').setAttribute('opacity', 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 7)));
    $('sl2').setAttribute('opacity', 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 7 + 2)));
    $('sl3').setAttribute('opacity', 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 7 + 4)));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
