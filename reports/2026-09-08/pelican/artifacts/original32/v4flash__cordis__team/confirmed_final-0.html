<style>

<body>
<h1>鹈鹕骑自行车 &#128690;</h1>
<p class="note">纯内联 SVG + SMIL 动画 · 无任何外部资源 · 可直接双击打开</p>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车 2D 动画">

  <!-- ===================== background ===================== -->

  <g>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 150 100;360 150 100" dur="42s" repeatCount="indefinite"/>
      <g stroke="#ffcb5c" stroke-width="5" stroke-linecap="round">
        <line x1="150" y1="22" x2="150" y2="38"/>
        <line x1="150" y1="162" x2="150" y2="178"/>
        <line x1="72" y1="100" x2="88" y2="100"/>
        <line x1="212" y1="100" x2="228" y2="100"/>

    </g>
  </g>

      <circle cx="0" cy="0" r="30"/><circle cx="-34" cy="16" r="20"/><circle cx="30" cy="14" r="22"/>

    <g>
