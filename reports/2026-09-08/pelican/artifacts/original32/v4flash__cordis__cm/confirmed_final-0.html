    raysG: $("raysG"), c1: $("c1"), c2: $("c2"), c3: $("c3"), c4: $("c4"),
    g1: $("g1"), g2: $("g2"), boatEl: $("boatEl"), foam: $("foam"),
    wv1: $("wv1"), wv2: $("wv2"), sd1: $("sd1"), sd2: $("sd2"), sd3: $("sd3"), sd4: $("sd4"),
    tileA: $("tileA"), tileB: $("tileB"), st1: $("st1"), st2: $("st2"), st3: $("st3"), st4: $("st4"),
    farLegG: $("farLegG"), farLeg: $("farLeg"), wR: $("wR"), wF: $("wF"),
    crk: $("crk"), pedF: $("pedF"), birdG: $("birdG"), legN: $("legN"),
    wingRock: $("wingRock"), headRock: $("headRock"), eyePos: $("eyePos"), scarfP: $("scarfP")
  };

  // 泡沫：一串向下的圆弧
  var foamD = "M 0 413.5";
  for (var i = 0; i < 40; i++) { foamD += " q 12 -6.5 24 0"; }
  E.foam.setAttribute("d", foamD);

  // [元素, 初始x, y, 缩放, 速度]
  var clouds = [[E.c1, 170, 92, .9, 8], [E.c2, 640, 58, 1.1, 13], [E.c3, 950, 152, .7, 6], [E.c4, 420, 210, .55, 11]];
  var gulls = [[E.g1, 760, 176, .9, 15], [E.g2, 300, 238, .6, 10]];
  var streaks = [[E.st1, 260, 168], [E.st2, 430, 214], [E.st3, 590, 262], [E.st4, 720, 305]];
  var sandRows = [[E.sd1, 250, 60], [E.sd2, 250, 48], [E.sd3, 430, 74], [E.sd4, 430, 74]];
  var waveRows = [[E.wv1, 20, 60], [E.wv2, 26, 44]];

  // 双腿逆运动学：固定髋 → 求膝，使膝尽量靠近地面侧
  function ik(Hx, Hy, Tx, Ty, l1, l2) {
    var dx = Tx - Hx, dy = Ty - Hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    var L = l1 + l2 - 0.6; if (d > L) { d = L; }
    var lo = Math.abs(l1 - l2) + 2; if (d < lo) { d = lo; }
    var a = Math.acos(Math.min(1, Math.max(-1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
    var b = Math.atan2(dy, dx);
    var k1 = [Hx + l1 * Math.cos(b + a), Hy + l1 * Math.sin(b + a)];
    var k2 = [Hx + l1 * Math.cos(b - a), Hy + l1 * Math.sin(b - a)];
    var tgt = Ty - 46;
    return (Math.abs(k1[1] - tgt) <= Math.abs(k2[1] - tgt)) ? k1 : k2;
  }

  var blinkNext = 2800, blinkStart = -1;

  function frame(ms) {
    var t = ms / 1000;
    var deg = (t * CYC * 360) % 360;
    var rad = deg * Math.PI / 180;
    var bob = Math.sin(2 * rad + 1.1) * 3;    // 车身起伏
    var i, j;

    // 太阳光芒
    E.raysG.setAttribute("transform", "rotate(" + fmt((t * 6) % 360) + " 115 100)");

    // 云
    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var cx = ((c[1] - t * c[4]) % 1300 + 1300) % 1300 - 140;
      c[0].setAttribute("transform", "translate(" + fmt(cx) + " " + c[2] + ") scale(" + c[3] + ")");
    }
    // 海鸥（上下轻摆 = 振翅感）
    var gb = Math.sin(t * 2.1) * 3;
    for (i = 0; i < gulls.length; i++) {
      var g = gulls[i];
      var gx = ((g[1] - t * g[4]) % 1300 + 1300) % 1300 - 140;
      g[0].setAttribute("transform", "translate(" + fmt(gx) + " " + fmt(g[2] + gb) + ") scale(" + g[3] + ")");
    }
    // 小船
    var bx = ((150 - t * 15) % 1150 + 1150) % 1150 - 90;
    E.boatEl.setAttribute("transform", "translate(" + fmt(bx) + " 364) scale(.9)");

    // 泡沫向左流
    E.foam.setAttribute("transform", "translate(" + (-((t * 46) % 48)) + " 0)");
    // 海浪虚线移动
    for (i = 0; i < waveRows.length; i++) {
      var w = waveRows[i];
      w[0].setAttribute("stroke-dashoffset", ((t * w[1]) % w[2]));
    }
    // 沙纹虚线
    for (i = 0; i < sandRows.length; i++) {
      var r = sandRows[i];
      r[0].setAttribute("stroke-dashoffset", ((t * r[1] + i * 13) % r[2]));
    }
    // 地面图块
    var tm = (t * 430) % 480;
    E.tileA.setAttribute("x", -tm);
    E.tileB.setAttribute("x", 480 - tm);
    // 速度线
    var sm = (t * 430) % 1060;
    for (i = 0; i < streaks.length; i++) {
      var s = streaks[i];
      s[0].setAttribute("transform", "translate(" + fmt(s[1] - sm) + " " + s[2] + ")");
    }

    // 车轮与曲柄同角
    var rd = fmt(deg);
    E.wR.setAttribute("transform", "rotate(" + rd + " 330 358)");
    E.wF.setAttribute("transform", "rotate(" + rd + " 580 358)");
    E.crk.setAttribute("transform", "rotate(" + rd + " 430 358)");

    // 两脚踏相位相反
    var nc = Math.cos(rad), ns = Math.sin(rad);
    var px = CRX + CR * nc, py = CRY + CR * ns;   // 近侧
    var fx = CRX - CR * nc, fy = CRY - CR * ns;   // 远侧
    E.pedF.setAttribute("transform", "translate(" + fmt(fx - 2) + " " + fmt(fy - 4) + ")");
    E.pedN.setAttribute("transform", "translate(" + fmt(px - 2) + " " + fmt(py - 4) + ")");

    // 车身起伏
    E.farLegG.setAttribute("transform", "translate(0 " + fmt(bob) + ")");
    E.birdG.setAttribute("transform", "translate(0 " + fmt(bob) + ")");

    // 双腿 IK（组内局部坐标）
    var k = ik(398, 280, px - 1, py - 4 - bob, 50, 58);
    E.legN.setAttribute("d", "M 398 280 L " + fmt(k[0]) + " " + fmt(k[1]) +
                        " L " + fmt(px - 1) + " " + fmt(py - 4 - bob));
    k = ik(384, 283, fx - 1, fy - 4 - bob, 46, 56);
    E.farLeg.setAttribute("d", "M 384 283 L " + fmt(k[0]) + " " + fmt(k[1]) +
                        " L " + fmt(fx - 1) + " " + fmt(fy - 4 - bob));

    // 点头与翅膀
    E.headRock.setAttribute("transform", "rotate(" + fmt(Math.sin(2 * rad + 2.6) * 1.8) + " 498 112)");
    E.wingRock.setAttribute("transform", "rotate(" + fmt(Math.sin(2 * rad + 1.2) * 2.2) + " 448 196)");

    // 眨眼
    var sc = 1;
    if (blinkStart < 0 && ms > blinkNext) { blinkStart = ms; }
    if (blinkStart >= 0) {
      var bk = (ms - blinkStart) / 130;
      if (bk >= 1) { blinkStart = -1; blinkNext = ms + 2600 + Math.random() * 2400; }
      else { sc = 1 - 0.9 * Math.sin(Math.PI * bk); }
    }
    E.eyePos.setAttribute("transform", "translate(520 99) scale(1 " + fmt(sc) + ")");

    // 围巾波浪（上下两条边，尾部更长更抖）
    var ph = t * 13, arrT = [], arrB = [], p, xx, yy, wt;
    for (j = 0; j <= 15; j++) {
      p = j / 15;
      xx = 466 - p * 240;
      wt = 1.6 + 3.4 * p;
      yy = 158 + Math.sin(p * 9 + ph) * wt + p * p * 13;
      arrT.push([fmt(xx), fmt(yy - 5 + 1.2 * p)]);
      arrB.push([fmt(xx), fmt(yy + 5 - 1.2 * p)]);
    }
    var d = "M " + arrT[0][0] + " " + arrT[0][1];
    for (j = 1; j <= 15; j++) { d += " L " + arrT[j][0] + " " + arrT[j][1]; }
    for (j = 15; j >= 0; j--) { d += " L " + arrB[j][0] + " " + arrB[j][1]; }
    E.scarfP.setAttribute("d", d + " Z");

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
