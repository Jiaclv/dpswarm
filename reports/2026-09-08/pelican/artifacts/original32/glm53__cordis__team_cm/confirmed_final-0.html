<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  html, body { margin: 0; padding: 0; background: #dff0fa; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .stage { max-width: 920px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { margin: 10px 0 8px; font-size: 26px; color: #23567a; font-weight: 600; }
  svg { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: 0 6px 24px rgba(30, 60, 90, .18); }
</style>
</head>
<body>
<div class="stage">
  <h1>鹈鹕骑自行车 · Pelican Riding a Bicycle</h1>

  <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="鹈鹕骑自行车的动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5bb5e8"/>
        <stop offset="0.6" stop-color="#a8dcf5"/>
        <stop offset="1" stop-color="#e3f4fb"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#fff7c0"/>
        <stop offset="0.7" stop-color="#ffd94a"/>
        <stop offset="1" stop-color="#f5b81f"/>
      </radialGradient>
      <g id="cloud">
        <ellipse cx="0" cy="0" rx="42" ry="18" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="-30" cy="9" rx="26" ry="14" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="31" cy="9" rx="28" ry="14" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="0" cy="-13" rx="24" ry="15" fill="#ffffff" opacity="0.95"/>
      </g>
      <g id="wheel">
        <circle r="48" fill="none" stroke="#2f2f35" stroke-width="9"/>
        <circle r="44" fill="none" stroke="#8a8a90" stroke-width="2"/>
        <circle r="7" fill="#3a3a40"/>
        <g stroke="#9a9aa0" stroke-width="2">
          <line x1="0" y1="-44" x2="0" y2="44"/>
          <line x1="-44" y1="0" x2="44" y2="0"/>
          <line x1="-31.1" y1="-31.1" x2="31.1" y2="31.1"/>
          <line x1="31.1" y1="-31.1" x2="-31.1" y2="31.1"/>
        </g>
      </g>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

    <!-- 太阳与旋转光芒 -->
    <g transform="translate(760,90)">
      <g>
        <animateTransform type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <g stroke="#ffd94a" stroke-width="5" stroke-linecap="round">
          <line x1="0" y1="-52" x2="0" y2="-72"/>
          <line x1="0" y1="52" x2="0" y2="72"/>
          <line x1="52" y1="0" x2="72" y2="0"/>
          <line x1="-52" y1="0" x2="-72" y2="0"/>
          <line x1="36.8" y1="-36.8" x2="50.9" y2="-50.9"/>
          <line x1="36.8" y1="36.8" x2="50.9" y2="50.9"/>
          <line x1="-36.8" y1="-36.8" x2="-50.9" y2="-50.9"/>
          <line x1="-36.8" y1="36.8" x2="-50.9" y2="50.9"/>
        </g>
      </g>
      <circle r="46" fill="url(#sun)"/>
    </g>

    <!-- 漂移的云朵 -->
    <g transform="translate(880,110) scale(1.1)">
      <g><animateTransform type="translate" values="0 0; -1900 0" dur="80s" repeatCount="indefinite"/><use href="#cloud" xlink:href="#cloud"/></g>
    </g>
    <g transform="translate(980,70) scale(0.7)">
      <g><animateTransform type="translate" values="0 0; -1900 0" dur="110s" begin="-45s" repeatCount="indefinite"/><use href="#cloud" xlink:href="#cloud"/></g>
    </g>
    <g transform="translate(820,170) scale(0.85)">
      <g><animateTransform type="translate" values="0 0; -1900 0" dur="65s" begin="-25s" repeatCount="indefinite"/><use href="#cloud" xlink:href="#cloud"/></g>
    </g>

    <!-- 远山（视差滚动，慢） -->
    <g>
      <animateTransform type="translate" values="0 0; -900 0" dur="40s" repeatCount="indefinite"/>
      <path d="M0,470 L0,320 L90,250 L150,340 L230,290 L320,360 L400,260 L470,350 L560,300 L640,380 L720,290 L810,370 L900,310 L900,470 Z" fill="#a9cbe8"/>
      <path d="M0,470 L0,320 L90,250 L150,340 L230,290 L320,360 L400,260 L470,350 L560,300 L640,380 L720,290 L810,370 L900,310 L900,470 Z" fill="#a9cbe8" transform="translate(900,0)"/>
    </g>

    <!-- 近山（视差滚动，较快） -->
    <g>
      <animateTransform type="translate" values="0 0; -900 0" dur="22s" repeatCount="indefinite"/>
      <path d="M0,475 L0,385 L120,340 L260,400 L400,360 L540,410 L680,370 L820,420 L900,385 L900,475 Z" fill="#7db27d"/>
      <path d="M0,475 L0,385 L120,340 L260,400 L400,360 L540,410 L680,370 L820,420 L900,385 L900,475 Z" fill="#7db27d" transform="translate(900,0)"/>
    </g>

    <!-- 草地 -->
    <rect x="0" y="470" width="900" height="50" fill="#79b647"/>
    <!-- 路面 -->
    <rect x="0" y="520" width="900" height="80" fill="#4b4b52"/>
    <line x1="0" y1="522" x2="900" y2="522" stroke="#7a7a82" stroke-width="3"/>
    <line x1="0" y1="598" x2="900" y2="598" stroke="#7a7a82" stroke-width="3"/>
    <!-- 滚动的虚线车道线（制造前进感） -->
    <line x1="0" y1="560" x2="900" y2="560" stroke="#f2c94c" stroke-width="6" stroke-dasharray="50 40" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;90" dur="0.9s" repeatCount="indefinite"/>
    </line>

    <!-- 车底阴影 -->
    <ellipse cx="410" cy="524" rx="200" ry="7" fill="#000000" opacity="0.12"/>

    <!-- 灰尘 / 速度线（位于车轮后方，保持在地面） -->
    <g fill="#c9c9c9">
      <circle cx="185" cy="513" r="5"><animate attributeName="opacity" values="0;0.6;0" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="173" cy="508" r="4"><animate attributeName="opacity" values="0;0.5;0" dur="1s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="201" cy="516" r="4"><animate attributeName="opacity" values="0;0.5;0" dur="1s" begin="0.6s" repeatCount="indefinite"/></circle>
    </g>
    <g stroke="#a8a8a8" stroke-width="3" stroke-linecap="round">
      <line x1="150" y1="505" x2="195" y2="505"><animate attributeName="opacity" values="0;0.7;0" dur="0.8s" repeatCount="indefinite"/></line>
      <line x1="135" y1="514" x2="185" y2="514"><animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.27s" repeatCount="indefinite"/></line>
      <line x1="160" y1="495" x2="190" y2="495"><animate attributeName="opacity" values="0;0.6;0" dur="0.8s" begin="0.53s" repeatCount="indefinite"/></line>
      <line x1="500" y1="505" x2="545" y2="505"><animate attributeName="opacity" values="0;0.6;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/></line>
      <line x1="485" y1="514" x2="535" y2="514"><animate attributeName="opacity" values="0;0.6;0" dur="0.8s" begin="0.1s" repeatCount="indefinite"/></line>
    </g>

    <!-- 整体上下颠簸组（自行车 + 鹈鹕） -->
    <g>
      <animateTransform type="translate" values="0 0; 0 -2.5; 0 0" dur="1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

      <!-- 后轮 / 前轮（辐条旋转） -->
      <g transform="translate(235,472)">
        <g><animateTransform type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/><use href="#wheel" xlink:href="#wheel"/></g>
      </g>
      <g transform="translate(585,472)">
        <g><animateTransform type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/><use href="#wheel" xlink:href="#wheel"/></g>
      </g>

      <!-- 车架、前叉、车把、座管 -->
      <g stroke="#2b4d66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="235" y1="472" x2="400" y2="478"/>
        <line x1="400" y1="478" x2="355" y2="335"/>
        <line x1="355" y1="335" x2="535" y2="340"/>
        <line x1="400" y1="478" x2="535" y2="340"/>
        <line x1="535" y1="340" x2="585" y2="472"/>
        <path d="M535,340 L545,322 Q552,316 561,319"/>
        <line x1="355" y1="335" x2="352" y2="324"/>
      </g>
      <!-- 车座 -->
      <ellipse cx="352" cy="322" rx="27" ry="8" fill="#22262c"/>

      <!-- 曲柄 + 脚踏（脚踏反向旋转保持水平） -->
      <g>
        <animateTransform type="rotate" from="0 400 478" to="360 400 478" dur="1.1s" repeatCount="indefinite"/>
        <circle cx="400" cy="478" r="15" fill="none" stroke="#555555" stroke-width="4"/>
        <line x1="400" y1="478" x2="400" y2="451" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
        <line x1="400" y1="478" x2="400" y2="505" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(400,451)">
          <animateTransform type="rotate" from="360" to="0" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-17" y="-4" width="34" height="8" rx="3" fill="#333333"/>
        </g>
        <g transform="translate(400,505)">
          <animateTransform type="rotate" from="360" to="0" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-17" y="-4" width="34" height="8" rx="3" fill="#333333"/>
        </g>
      </g>

      <!-- 两条橙色腿（随曲柄周期摆动踩踏，周期 1.1s） -->
      <polyline fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="points" dur="1.1s" repeatCount="indefinite" values="352,340 391,390.5 400,451;352,340 400.6,394.5 419.1,458.9;352,340 404.5,404 427,478;352,340 400.6,413.6 419.1,497.1;352,340 391,417.5 400,505;352,340 381.5,413.6 380.9,497.1;352,340 377.5,404 373,478;352,340 381.5,394.5 380.9,458.9"/>
      </polyline>
      <polyline fill="none" stroke="#e0860a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="points" dur="1.1s" repeatCount="indefinite" values="352,340 391,417.5 400,505;352,340 381.5,413.6 380.9,497.1;352,340 377.5,404 373,478;352,340 381.5,394.5 380.9,458.9;352,340 391,390.5 400,451;352,340 400.6,394.5 419.1,458.9;352,340 404.5,404 427,478;352,340 400.6,413.6 419.1,497.1"/>
      </polyline>

      <!-- 尾羽 -->
      <path d="M288,288 L248,279 L288,296 L250,298 L289,304 L258,313 L293,310 Z" fill="#f3f3f3" stroke="#c9c9c9" stroke-width="1.5"/>

      <!-- 身体（白色） -->
      <ellipse cx="336" cy="296" rx="62" ry="44" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/>

      <!-- S 形脖子 -->
      <path d="M386,268 C398,238 392,204 428,202" fill="none" stroke="#c0c0c0" stroke-width="19" stroke-linecap="round"/>
      <path d="M386,268 C398,238 392,204 428,202" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>

      <!-- 头部 -->
      <circle cx="443" cy="204" r="16" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/>

      <!-- 长喙上颚 -->
      <path d="M457,198 C492,196 526,204 554,211 L554,215 C526,211 492,207 457,207 Z" fill="#f6b23a"/>
      <!-- 喉囊（橙黄色） -->
      <path d="M457,208 C490,211 518,215 542,213 C522,238 506,260 486,266 C474,270 464,256 458,238 C455,228 456,217 457,208 Z" fill="#f5a623"/>

      <!-- 眼睛 -->
      <circle cx="449" cy="197" r="4.2" fill="#1c1c1c"/>
      <circle cx="450.2" cy="195.4" r="1.6" fill="#ffffff"/>

      <!-- 翅膀搭在车把上 -->
      <path d="M292,300 C320,292 380,300 460,316 C505,326 540,330 556,320 C540,336 500,338 440,332 C380,324 320,312 292,304 Z" fill="#e9e9e9" stroke="#c5c5c5" stroke-width="1.5"/>
      <path d="M330,308 C380,314 440,322 510,326" fill="none" stroke="#d3d3d3" stroke-width="2"/>
      <path d="M330,316 C380,320 440,326 500,330" fill="none" stroke="#d3d3d3" stroke-width="2"/>
    </g>
  </svg>
</div>
</body>
</html>
