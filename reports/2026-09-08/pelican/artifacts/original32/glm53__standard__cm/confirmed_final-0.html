<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html,body{margin:0;padding:0;background:linear-gradient(180deg,#0b1220,#141c2f);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  svg{width:min(96vw,1080px);height:auto;display:block;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.45);}
  text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
  .cloud{animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1300px)}}
  .chain{stroke-dasharray:8 5;animation:chainRun .2s linear infinite;}
  @keyframes chainRun{to{stroke-dashoffset:-13}}
  .woosh{stroke:#ffffff;stroke-width:5;stroke-linecap:round;opacity:0;animation:woosh .85s linear infinite;}
  @keyframes woosh{0%{transform:translate(70px,0);opacity:0}12%{opacity:.75}100%{transform:translate(-170px,0);opacity:0}}
</style>
</head>
<body>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的2D动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6ff"/><stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <radialGradient id="sunGrad"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd23f"/></radialGradient>
    <path id="hillTile" d="M0 470 L0 440 Q120 398 240 434 Q300 452 360 442 Q480 396 600 438 Q660 452 720 442 Q840 400 960 440 L960 470 Z"/>
    <g id="cloudShape" fill="#ffffff" opacity="0.92">
      <ellipse rx="42" ry="18"/><ellipse cx="32" cy="8" rx="34" ry="14"/>
      <ellipse cx="-30" cy="8" rx="30" ry="12"/><ellipse cx="4" cy="-11" rx="26" ry="13"/>
    </g>
    <path id="tuft" d="M0 0 Q1 -10 3 -1 Q5 -8 7 0 Q9 -11 11 -1 Q13 -7 15 0 Z" fill="#4f9f4a"/>
    <rect id="dash" x="30" y="498" width="90" height="8" rx="4" fill="#f6c445"/>
  </defs>

  <!-- 天空、太阳 -->
  <rect width="960" height="470" fill="url(#sky)"/>
  <g transform="translate(830 90)">
    <g stroke="#ffd23f" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <line y1="-46" y2="-62"/><line y1="-46" y2="-62" transform="rotate(30)"/>
      <line y1="-46" y2="-62" transform="rotate(60)"/><line y1="-46" y2="-62" transform="rotate(90)"/>
      <line y1="-46" y2="-62" transform="rotate(120)"/><line y1="-46" y2="-62" transform="rotate(150)"/>
      <line y1="-46" y2="-62" transform="rotate(180)"/><line y1="-46" y2="-62" transform="rotate(210)"/>
      <line y1="-46" y2="-62" transform="rotate(240)"/><line y1="-46" y2="-62" transform="rotate(270)"/>
      <line y1="-46" y2="-62" transform="rotate(300)"/><line y1="-46" y2="-62" transform="rotate(330)"/>
    </g>
    <circle r="36" fill="url(#sunGrad)"/>
  </g>

  <!-- 云（外层定位、内层做位移动画） -->
  <g transform="translate(1010 72)"><g class="cloud" style="animation-duration:58s;animation-delay:-14s"><use href="#cloudShape"/></g></g>
  <g transform="translate(780 130) scale(.66)"><g class="cloud" style="animation-duration:76s;animation-delay:-42s"><use href="#cloudShape"/></g></g>
  <g transform="translate(1180 44) scale(1.15)"><g class="cloud" style="animation-duration:66s;animation-delay:-25s"><use href="#cloudShape"/></g></g>

  <!-- 远山（JS 视差滚动） -->
  <g id="hills" fill="#c7e8b8">
    <use href="#hillTile"/><use href="#hillTile" x="960"/>
  </g>

  <!-- 草肩 + 草丛 -->
  <rect y="447" width="960" height="10" fill="#8ed17a"/>
  <g id="grass">
    <use href="#tuft" x="24" y="452"/><use href="#tuft" x="92" y="450"/><use href="#tuft" x="158" y="451"/><use href="#tuft" x="208" y="453"/>
    <use href="#tuft" x="264" y="450"/><use href="#tuft" x="332" y="452"/><use href="#tuft" x="398" y="451"/><use href="#tuft" x="448" y="450"/>
    <use href="#tuft" x="504" y="453"/><use href="#tuft" x="572" y="450"/><use href="#tuft" x="638" y="452"/><use href="#tuft" x="688" y="451"/>
    <use href="#tuft" x="744" y="450"/><use href="#tuft" x="812" y="453"/><use href="#tuft" x="878" y="450"/><use href="#tuft" x="928" y="452"/>
    <use href="#tuft" x="984" y="451"/><use href="#tuft" x="1052" y="450"/><use href="#tuft" x="1118" y="453"/><use href="#tuft" x="1168" y="451"/>
  </g>

  <!-- 公路 + 车道虚线 -->
  <rect y="455" width="960" height="85" fill="#5c6370"/>
  <rect y="455" width="960" height="6" fill="#494f58"/>
  <g id="dashes">
    <use href="#dash"/><use href="#dash" x="240"/><use href="#dash" x="480"/><use href="#dash" x="720"/><use href="#dash" x="960"/>
  </g>

  <!-- 地面阴影 + 速度线 -->
  <ellipse cx="480" cy="471" rx="155" ry="11" fill="#1f2937" opacity=".22"/>
  <line class="woosh" x1="330" y1="236" x2="396" y2="236" style="animation-delay:0s"/>
  <line class="woosh" x1="316" y1="300" x2="388" y2="300" style="animation-delay:.28s"/>
  <line class="woosh" x1="334" y1="348" x2="392" y2="348" style="animation-delay:.56s"/>

  <!-- ===== 鹈鹕 + 自行车 ===== -->
  <!-- 远侧腿 / 曲柄 / 踏板（画在最底层） -->
  <polyline id="legF" points="459,299 480,350 495,394" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="footF"><path d="M-3 -2 L14 -3 L20 2 L14 5 L-3 6 Z" fill="#b45f06"/></g>
  <line id="armF" x1="475" y1="400" x2="455" y2="400" stroke="#3f3f46" stroke-width="6" stroke-linecap="round"/>
  <g id="pedalF"><rect x="-11" y="-4" width="22" height="8" rx="3" fill="#1f1f24"/></g>

  <!-- 车轮 -->
  <g transform="translate(390 400)">
    <circle r="55" fill="none" stroke="#26262b" stroke-width="9"/>
    <circle r="47" fill="none" stroke="#cfd4da" stroke-width="4"/>
    <g id="spokesR" stroke="#9aa0a8" stroke-width="2.5">
      <line y2="-46"/><line y2="-46" transform="rotate(45)"/><line y2="-46" transform="rotate(90)"/><line y2="-46" transform="rotate(135)"/>
      <line y2="-46" transform="rotate(180)"/><line y2="-46" transform="rotate(225)"/><line y2="-46" transform="rotate(270)"/><line y2="-46" transform="rotate(315)"/>
    </g>
    <circle r="6" fill="#3f3f46"/>
  </g>
  <g transform="translate(590 400)">
    <circle r="55" fill="none" stroke="#26262b" stroke-width="9"/>
    <circle r="47" fill="none" stroke="#cfd4da" stroke-width="4"/>
    <g id="spokesF" stroke="#9aa0a8" stroke-width="2.5">
      <line y2="-46"/><line y2="-46" transform="rotate(45)"/><line y2="-46" transform="rotate(90)"/><line y2="-46" transform="rotate(135)"/>
      <line y2="-46" transform="rotate(180)"/><line y2="-46" transform="rotate(225)"/><line y2="-46" transform="rotate(270)"/><line y2="-46" transform="rotate(315)"/>
    </g>
    <circle r="6" fill="#3f3f46"/>
  </g>

  <!-- 车架 / 链条 / 车座 / 车把 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="chain" d="M390 392 L475 376" stroke="#40404a" stroke-width="4"/>
    <path class="chain" d="M475 424 L390 408" stroke="#40404a" stroke-width="4"/>
    <circle cx="390" cy="400" r="8" stroke="#52525b" stroke-width="4"/>
    <circle cx="475" cy="400" r="24" stroke="#52525b" stroke-width="5"/>
    <circle cx="475" cy="400" r="5" fill="#52525b" stroke="none"/>
    <path d="M390 400 H475 L449 306 Z M449 306 L566 312 L475 400 Z M566 312 L590 400" stroke="#0d9488" stroke-width="7"/>
    <path d="M449 306 L445 291" stroke="#3f3f46" stroke-width="6"/>
    <path d="M566 312 L571 294 Q574 283 561 281" stroke="#3f3f46" stroke-width="7"/>
    <rect x="420" y="285" width="48" height="9" rx="4.5" fill="#27272a" stroke="none"/>
    <circle cx="561" cy="282" r="5" fill="#27272a" stroke="none"/>
  </g>

  <!-- 鹈鹕本体（JS 上下起伏） -->
  <g id="pelican">
    <path d="M402 262 L370 242 L392 257 L364 251 L389 264 L368 269 L401 271 Z" fill="#fff" stroke="#d8dce3" stroke-width="2"/>
    <ellipse cx="452" cy="252" rx="56" ry="40" fill="#fff" stroke="#d8dce3" stroke-width="3"/>
    <ellipse cx="459" cy="263" rx="40" ry="25" fill="#f2f6fa"/>
    <path d="M466 244 C498 236 490 210 497 194 C501 185 508 180 514 178" fill="none" stroke="#d8dce3" stroke-width="28" stroke-linecap="round"/>
    <path d="M466 244 C498 236 490 210 497 194 C501 185 508 180 514 178" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <circle cx="514" cy="178" r="19" fill="#fff" stroke="#d8dce3" stroke-width="3"/>
    <circle cx="521" cy="171" r="3.6" fill="#26262b"/>
    <circle cx="522.4" cy="169.6" r="1.3" fill="#fff"/>
    <circle cx="520" cy="188" r="4.5" fill="#f9a8d4" opacity=".75"/>
    <path d="M522 166 L596 186 Q601 188 596 191 L522 181 Q517 174 522 166 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <path d="M524 181 Q552 244 588 190 Q552 222 524 181 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 524 181;2.4 524 181;0 524 181;-1.6 524 181;0 524 181" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(549 201)">
      <path d="M0 2 L8 -9 L13 -7 L10 3 Z" fill="#7fb7d9" stroke="#4d7fa3" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="-8;8;-8" dur="1.3s" repeatCount="indefinite"/>
    </g>
    <path d="M458 234 C496 238 534 260 564 286 L556 293 C526 275 492 257 456 252 Z" fill="#e8ecf2" stroke="#c7cdd6" stroke-width="2"/>
    <path d="M518 256 L532 266 M536 270 L546 279" stroke="#c7cdd6" stroke-width="2" fill="none"/>
  </g>

  <!-- 近侧曲柄 / 踏板 / 腿（画在最上层） -->
  <line id="armN" x1="475" y1="400" x2="495" y2="380" stroke="#52525b" stroke-width="6" stroke-linecap="round"/>
  <g id="pedalN"><rect x="-11" y="-4" width="22" height="8" rx="3" fill="#2b2b31" stroke="#111114" stroke-width="1"/></g>
  <polyline id="legN" points="447,295 480,350 495,374" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="footN"><path d="M-3 -2 L14 -3 L20 2 L14 5 L-3 6 Z" fill="#d97706"/></g>

  <!-- 标题 -->
  <text x="34" y="56" font-size="26" font-weight="700" fill="#1e3a5f" opacity=".85">鹈鹕骑行 🚲</text>
  <text x="34" y="84" font-size="15" fill="#3b5b7f" opacity=".8">纯 SVG + CSS + 一点点 JS 的 2D 动画</text>
</svg>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  // 几何常量：五通(曲柄中心)、曲柄半径、车轮半径与周期
  var BBX=475,BBY=400,CR=20,TW=1.0,TC=2.2,RW=55;
  var V=2*Math.PI*RW/TW;               // 地面滚动线速度
  var hipN={x:447,y:295},hipF={x:459,y:299},L1=66,L2=66; // 髋关节与大腿/小腿长
  var spokesR=$('spokesR'),spokesF=$('spokesF'),hills=$('hills'),grass=$('grass'),dashes=$('dashes'),
      pelican=$('pelican'),armN=$('armN'),armF=$('armF'),pedalN=$('pedalN'),pedalF=$('pedalF'),
      legN=$('legN'),legF=$('legF'),footN=$('footN'),footF=$('footF');
  // 两段式腿部 IK：已知髋和踏板(踝)位置，求膝盖（向前进方向弯曲）
  function knee(hx,hy,fx,fy){
    var dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy)||0.001;
    var dm=Math.min(Math.max(d,1),L1+L2-0.5);
    var ux=dx/d,uy=dy/d,a=(L1*L1-L2*L2+dm*dm)/(2*dm),h=Math.sqrt(Math.max(L1*L1-a*a,0));
    return [hx+a*ux+h*uy, hy+a*uy-h*ux];
  }
  var t0=null;
  function frame(now){
    if(t0===null)t0=now;
    var t=(now-t0)/1000;
    // 车轮旋转 + 视差滚动（远山慢、路面快）
    var wd=(t/TW*360)%360;
    spokesR.setAttribute('transform','rotate('+wd.toFixed(2)+')');
    spokesF.setAttribute('transform','rotate('+wd.toFixed(2)+')');
    hills.setAttribute('transform','translate('+(-(t*30)%960).toFixed(1)+' 0)');
    var gx=-((t*V)%240);
    grass.setAttribute('transform','translate('+gx.toFixed(1)+' 0)');
    dashes.setAttribute('transform','translate('+gx.toFixed(1)+' 0)');
    // 曲柄：与车轮同向(顺时针)，踏板始终保持水平；身体随踏频上下起伏
    var a=t/TC*2*Math.PI;
    var bob=2.5*Math.sin(2*a);
    pelican.setAttribute('transform','translate(0 '+bob.toFixed(2)+')');
    var nx=BBX+CR*Math.sin(a), ny=BBY-CR*Math.cos(a);
    var fx=BBX-CR*Math.sin(a), fy=BBY+CR*Math.cos(a);
    armN.setAttribute('x2',nx.toFixed(1));armN.setAttribute('y2',ny.toFixed(1));
    armF.setAttribute('x2',fx.toFixed(1));armF.setAttribute('y2',fy.toFixed(1));
    pedalN.setAttribute('transform','translate('+nx.toFixed(1)+' '+ny.toFixed(1)+')');
    pedalF.setAttribute('transform','translate('+fx.toFixed(1)+' '+fy.toFixed(1)+')');
    // 双腿 IK（髋部随身体起伏）
    var hn={x:hipN.x,y:hipN.y+bob}, hf={x:hipF.x,y:hipF.y+bob};
    var anx={x:nx+1,y:ny-6}, afx={x:fx+1,y:fy-6};
    var kn=knee(hn.x,hn.y,anx.x,anx.y), kf=knee(hf.x,hf.y,afx.x,afx.y);
    legN.setAttribute('points',hn.x.toFixed(1)+','+hn.y.toFixed(1)+' '+kn[0].toFixed(1)+','+kn[1].toFixed(1)+' '+anx.x.toFixed(1)+','+anx.y.toFixed(1));
    legF.setAttribute('points',hf.x.toFixed(1)+','+hf.y.toFixed(1)+' '+kf[0].toFixed(1)+','+kf[1].toFixed(1)+' '+afx.x.toFixed(1)+','+afx.y.toFixed(1));
    footN.setAttribute('transform','translate('+anx.x.toFixed(1)+' '+anx.y.toFixed(1)+')');
    footF.setAttribute('transform','translate('+afx.x.toFixed(1)+' '+afx.y.toFixed(1)+')');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
