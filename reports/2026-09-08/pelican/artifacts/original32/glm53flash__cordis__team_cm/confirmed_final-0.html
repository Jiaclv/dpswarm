<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #8ecae6; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }

  /* 车轮辐条旋转 */
  .spin { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 太阳光芒缓慢旋转 */
  .rays { animation: spin 46s linear infinite; transform-box: fill-box; transform-origin: center; }

  /* 云朵飘动 */
  .cloud { animation: drift linear infinite; }
  .c1 { animation-duration: 60s; animation-delay: -12s; }
  .c2 { animation-duration: 85s; animation-delay: -40s; }
  .c3 { animation-duration: 72s; animation-delay: -63s; }
  @keyframes drift { from { transform: translateX(1030px); } to { transform: translateX(-300px); } }

  /* 远山慢速视差滚动 */
  .hills { animation: hillscroll 26s linear infinite; }
  @keyframes hillscroll { to { transform: translateX(-960px); } }

  /* 草丛快速滚动 */
  .tufts { animation: hillscroll 2.75s linear infinite; }

  /* 公路中线虚线滚动 */
  .dashline { animation: dashmove2 0.235s linear infinite; }
  @keyframes dashmove2 { to { stroke-dashoffset: -80; } }

  /* 链条转动 */
  .chain { animation: chainmove 0.3s linear infinite; }
  @keyframes chainmove { to { stroke-dashoffset: -12; } }

  /* 鹈鹕身体随踩踏轻微起伏 */
  .bob { animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(4px); } }

  /* 尾巴轻摆 */
  .tail { animation: wag 0.7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 85% 85%; }
  @keyframes wag { from { transform: rotate(0deg); } to { transform: rotate(3.5deg); } }

  /* 喉囊轻微颤动 */
  .pouch { animation: pouchwob 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 20% 10%; }
  @keyframes pouchwob { from { transform: scale(1, 1); } to { transform: scale(1.045, 1.07); } }

  /* 眨眼 */
  .lid { animation: blink 5.2s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink {
    0%, 90% { transform: scaleY(0.04); }
    93.5%   { transform: scaleY(1); }
    96%, 100% { transform: scaleY(0.04); }
  }

  /* 速度线 */
  .speed { animation: speed 1.15s linear infinite; }
  .s2 { animation-delay: -0.4s; }
  .s3 { animation-delay: -0.8s; }
  @keyframes speed {
    0%   { transform: translateX(70px); opacity: 0; }
    25%  { opacity: 0.85; }
    100% { transform: translateX(-160px); opacity: 0; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
