<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #eaf4ff 0%, #f7fbff 60%, #eef7ee 100%);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { width: min(960px, 96vw); }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(30, 60, 90, .18);
  }
  .caption {
    color: #39516b;
    margin-top: 14px;
    font-size: 14px;
    letter-spacing: .05em;
    text-align: center;
  }
  .caption b { color: #17324d; }
  noscript p { color: #b0552a; }
</style>
</head>
<body>
<main class="stage">
  <svg id="scene" viewBox="0 0 900 560" role="img" aria-label="一只白色鹈鹕在乡间道路上骑 teal 色自行车的动画，车轮旋转、双腿蹬踏、白云飘过">
    <title>鹈鹕骑自行车</title>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#8fd0f2"/>
        <stop offset="0.65" stop-color="#cfeaf9"/>
        <stop offset="1"   stop-color="#eaf7e8"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffcf5c"/>
        <stop offset="1" stop-color="#f2a03d"/>
      </linearGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="900" height="560" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g>
      <circle cx="770" cy="95" r="72" fill="url(#sunGlow)">
        <animate attributeName="r" values="64;82;64" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="95" r="38" fill="#ffd94d"/>
    </g>

    <!-- 白云（JS 驱动飘动） -->
    <g id="clouds" fill="#ffffff" opacity="0.92">
      <g id="cloud1">
        <ellipse cx="0"   cy="0"   rx="46" ry="18"/>
        <ellipse cx="30"  cy="-10" rx="30" ry="15"/>
        <ellipse cx="-32" cy="-6"  rx="26" ry="13"/>
      </g>
      <g id="cloud2">
        <ellipse cx="0"   cy="0"   rx="46" ry="18"/>
        <ellipse cx="30"  cy="-10" rx="30" ry="15"/>
        <ellipse cx="-32" cy="-6"  rx="26" ry="13"/>
      </g>
      <g id="cloud3">
        <ellipse cx="0"   cy="0"   rx="46" ry="18"/>
        <ellipse cx="30"  cy="-10" rx="30" ry="15"/>
        <ellipse cx="-32" cy="-6"  rx="26" ry="13"/>
      </g>
    </g>

    <!-- 远山（视差滚动，JS 驱动） -->
    <g id="hillsFar" fill="#cfe6c1">
      <path d="M0 471 C50 434 118 430 170 458 C215 480 260 468 305 444 C350 420 392 424 436 442 C480 460 520 452 560 432 C600 412 648 420 690 442 C740 466 800 458 850 440 C870 434 888 444 900 452 L900 471 Z"/>
      <path d="M0 471 C50 434 118 430 170 458 C215 480 260 468 305 444 C350 420 392 424 436 442 C480 460 520 452 560 432 C600 412 648 420 690 442 C740 466 800 458 850 440 C870 434 888 444 900 452 L900 471 Z" transform="translate(900 0)"/>
    </g>

    <!-- 近处丘陵（视差滚动，JS 驱动） -->
    <g id="hillsNear" fill="#b7dba3">
      <path d="M0 471 C80 452 140 462 210 456 C280 450 330 434 400 444 C470 454 520 466 590 458 C660 450 730 436 800 446 C850 452 880 462 900 458 L900 471 Z"/>
      <path d="M0 471 C80 452 140 462 210 456 C280 450 330 434 400 444 C470 454 520 466 590 458 C660 450 730 436 800 446 C850 452 880 462 900 458 L900 471 Z" transform="translate(900 0)"/>
    </g>

    <!-- 草地与公路 -->
    <rect x="0" y="470" width="900" height="16" fill="#9cc98a"/>
    <rect x="0" y="486" width="900" height="74" fill="#74747f"/>
    <rect x="0" y="486" width="900" height="5"  fill="#585863"/>
    <line id="roadDash" x1="0" y1="524" x2="900" y2="524"
          stroke="#f2f2ea" stroke-width="7" stroke-dasharray="54 46" stroke-dashoffset="0"/>

    <!-- 风的速度线 -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="150" y1="262" x2="60" y2="262" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -110 0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
      </line>
      <line x1="160" y1="308" x2="55" y2="308" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -110 0" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
      </line>
      <line x1="140" y1="356" x2="50" y2="356" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -110 0" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- 车下阴影 -->
    <ellipse cx="430" cy="489" rx="260" ry="9" fill="#20242b" opacity="0.14"/>

    <!-- 后轮扬起的尘土 -->
    <g fill="#d8cbb6">
      <g opacity="0">
        <circle cx="150" cy="472" r="9"/>
        <circle cx="168" cy="478" r="6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -72 -14" dur="1.5s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.3;1" dur="1.5s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <circle cx="146" cy="470" r="7"/>
        <circle cx="162" cy="477" r="5"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -72 -14" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.3;1" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ===== 远侧腿（画在车架后面，颜色更深） ===== -->
    <line id="thighF" x1="386" y1="297" x2="420" y2="360" stroke="#c77e1c" stroke-width="14" stroke-linecap="round"/>
    <line id="shinF"  x1="420" y1="360" x2="430" y2="412" stroke="#a86a14" stroke-width="9"  stroke-linecap="round"/>
    <path id="footF"  d="M-14 0 L22 -1 L16 7 L-10 7 Z" fill="#a86a14" transform="translate(430 412)"/>
    <line id="crankF" x1="430" y1="418" x2="430" y2="460" stroke="#3c3c44" stroke-width="8" stroke-linecap="round"/>
    <rect id="pedalF" x="-16" y="-5" width="32" height="10" rx="4" fill="#3c3c44" transform="translate(430 460)"/>

    <!-- ===== 自行车 ===== -->
    <!-- 后轮 -->
    <g>
      <circle cx="250" cy="400" r="80" fill="none" stroke="#2f2f36" stroke-width="13"/>
      <circle cx="250" cy="400" r="70" fill="none" stroke="#d9d9de" stroke-width="5"/>
      <g id="spokesR" stroke="#9aa0a8" stroke-width="2.5">
        <line x1="250" y1="336" x2="250" y2="464"/>
        <line x1="186" y1="400" x2="314" y2="400"/>
        <line x1="205" y1="355" x2="295" y2="445"/>
        <line x1="205" y1="445" x2="295" y2="355"/>
        <line x1="250" y1="336" x2="250" y2="464" transform="rotate(22.5 250 400)"/>
        <line x1="186" y1="400" x2="314" y2="400" transform="rotate(22.5 250 400)"/>
        <line x1="205" y1="355" x2="295" y2="445" transform="rotate(22.5 250 400)"/>
        <line x1="205" y1="445" x2="295" y2="355" transform="rotate(22.5 250 400)"/>
      </g>
      <circle cx="250" cy="400" r="9" fill="#4a4a52"/>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="640" cy="400" r="80" fill="none" stroke="#2f2f36" stroke-width="13"/>
      <circle cx="640" cy="400" r="70" fill="none" stroke="#d9d9de" stroke-width="5"/>
      <g id="spokesF" stroke="#9aa0a8" stroke-width="2.5">
        <line x1="640" y1="336" x2="640" y2="464"/>
        <line x1="576" y1="400" x2="704" y2="400"/>
        <line x1="595" y1="355" x2="685" y2="445"/>
        <line x1="595" y1="445" x2="685" y2="355"/>
        <line x1="640" y1="336" x2="640" y2="464" transform="rotate(22.5 640 400)"/>
        <line x1="576" y1="400" x2="704" y2="400" transform="rotate(22.5 640 400)"/>
        <line x1="595" y1="355" x2="685" y2="445" transform="rotate(22.5 640 400)"/>
        <line x1="595" y1="445" x2="685" y2="355" transform="rotate(22.5 640 400)"/>
      </g>
      <circle cx="640" cy="400" r="9" fill="#4a4a52"/>
    </g>

    <!-- 链条（虚线流动） -->
    <line id="chainTop"    x1="250" y1="388" x2="430" y2="388" stroke="#4a4a52" stroke-width="5" stroke-dasharray="10 7"/>
    <line id="chainBottom" x1="250" y1="412" x2="430" y2="448" stroke="#4a4a52" stroke-width="5" stroke-dasharray="10 7"/>

    <!-- 车架 -->
    <path d="M250 400 L430 418 L368 286
             M250 400 L372 301
             M430 418 L602 341
             M379 299 L599 295
             M595 281 L640 400"
          fill="none" stroke="#2f9e8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 飞轮与牙盘 -->
    <circle cx="250" cy="400" r="12" fill="none" stroke="#5b5b64" stroke-width="4"/>
    <circle cx="430" cy="418" r="30" fill="none" stroke="#5b5b64" stroke-width="5"/>
    <circle cx="430" cy="418" r="6" fill="#5b5b64"/>

    <!-- 座杆 / 车座 -->
    <line x1="368" y1="286" x2="360" y2="268" stroke="#4a4a52" stroke-width="6" stroke-linecap="round"/>
    <path d="M336 266 q24 -10 52 -2 q-6 10 -26 10 q-22 0 -26 -8 z" fill="#33333b"/>

    <!-- 把立 / 车把 -->
    <path d="M596 281 L588 258 L614 250" fill="none" stroke="#4a4a52" stroke-width="6" stroke-linecap="round"/>
    <circle cx="618" cy="249" r="5" fill="#33333b"/>

    <!-- ===== 鹈鹕（整体随蹬踏轻微起伏，JS 驱动） ===== -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M320 210 C282 196 254 186 240 176 C258 200 250 208 236 214 C262 220 268 228 258 240 C288 240 306 248 318 254 Z"
            fill="#fdfdf7" stroke="#cfd2da" stroke-width="3" stroke-linejoin="round"/>
      <!-- 身体 -->
      <ellipse cx="384" cy="232" rx="88" ry="60" fill="#fdfdf7" stroke="#cfd2da" stroke-width="3"
               transform="rotate(-8 384 232)"/>
      <!-- 前胸（遮住身体轮廓线，让脖子自然衔接） -->
      <circle cx="450" cy="204" r="26" fill="#fdfdf7"/>
      <!-- 翅膀（SMIL 扑动） -->
      <g id="wing">
        <path d="M416 204 C470 194 456 240 404 258 C372 268 342 258 346 242 C356 226 388 212 416 204 Z"
              fill="#eef0f5" stroke="#c3c7d2" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M372 254 C396 246 414 236 428 222 M354 246 C376 236 392 228 406 218"
              fill="none" stroke="#c3c7d2" stroke-width="2" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 412 210; 7 412 210; 0 412 210; -4 412 210; 0 412 210"
                          keyTimes="0;0.25;0.5;0.75;1" dur="2.6s" repeatCount="indefinite"/>
      </g>
      <!-- 脖子（双层描边形成轮廓） -->
      <path d="M444 198 C490 190 504 158 501 128" fill="none" stroke="#cfd2da" stroke-width="26" stroke-linecap="round"/>
      <path d="M444 198 C490 190 504 158 501 128" fill="none" stroke="#fdfdf7" stroke-width="20" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="505" cy="120" r="23" fill="#fdfdf7" stroke="#cfd2da" stroke-width="3"/>
      <!-- 喉囊（先画，压在上喙之下） -->
      <path d="M523 121 C562 126 616 132 651 138 C620 166 556 170 534 131 Z"
            fill="#f2953a" stroke="#d68f2b" stroke-width="2" stroke-linejoin="round"/>
      <!-- 囊里的小鱼 -->
      <path d="M596 152 l18 9 l-3 -15 z" fill="#74c7e4" stroke="#4293bd" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- 上喙 -->
      <path d="M522 103 C562 104 618 114 652 129 L650 138 C616 127 564 119 523 120 Z"
            fill="url(#beakGrad)" stroke="#d68f2b" stroke-width="2" stroke-linejoin="round"/>
      <!-- 喙尖小钩 -->
      <path d="M652 129 q6 3 4 9 l-6 -2 z" fill="#e09a2e"/>
      <!-- 鼻孔线 -->
      <path d="M540 108 l16 3" stroke="#d68f2b" stroke-width="2" stroke-linecap="round"/>
      <!-- 眼睛 -->
      <circle cx="512" cy="111" r="4.6" fill="#2e2e36"/>
      <circle cx="513.5" cy="109.4" r="1.5" fill="#ffffff"/>
    </g>

    <!-- ===== 近侧曲柄 / 脚踏 / 腿（画在最上层） ===== -->
    <line id="crankN" x1="430" y1="418" x2="430" y2="376" stroke="#3c3c44" stroke-width="9" stroke-linecap="round"/>
    <rect id="pedalN" x="-16" y="-5" width="32" height="10" rx="4" fill="#26262c" transform="translate(430 376)"/>
    <line id="thighN" x1="398" y1="296" x2="432" y2="356" stroke="#f6a63b" stroke-width="15" stroke-linecap="round"/>
    <line id="shinN"  x1="432" y1="356" x2="428" y2="410" stroke="#f6a63b" stroke-width="10" stroke-linecap="round"/>
    <path id="footN"  d="M-14 0 L24 -1 L17 7 L-10 7 Z" fill="#f6a63b" transform="translate(428 410)"/>
  </svg>

  <p class="caption">🚲 <b>鹈鹕骑行号</b> —— 纯 SVG + 原生 requestAnimationFrame 驱动，无任何外部依赖</p>
  <noscript><p style="text-align:center;color:#b0552a;">当前浏览器禁用了 JavaScript：画面仍可显示，但车轮与蹬踏动画不会运行。</p></noscript>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // ---- 几何常量（与上方 SVG 坐标一一对应） ----
  var RW = { x: 250, y: 400 };          // 后轮轴心
  var BB = { x: 430, y: 418 };          // 五通（曲柄轴心）
  var CRANK = 42;                        // 曲柄长
  var GEAR = 2.2;                        // 牙盘:飞轮 传动比
  var ROAD_SPEED = 250;                  // 路面视速度 px/s
  var CRANK_SPEED = 2.6;                 // 蹬踏角速度 rad/s

  var hipN = { x: 398, y: 296 };        // 近侧髋关节
  var hipF = { x: 386, y: 297 };        // 远侧髋关节
  var THIGH = 95, SHIN = 101;            // 大腿 / 小腿长度

  // ---- 元素引用 ----
  var el = {
    spokesR: $('spokesR'), spokesF: $('spokesF'),
    crankN: $('crankN'), crankF: $('crankF'),
    pedalN: $('pedalN'), pedalF: $('pedalF'),
    thighN: $('thighN'), shinN: $('shinN'), footN: $('footN'),
    thighF: $('thighF'), shinF: $('shinF'), footF: $('footF'),
    pelican: $('pelican'),
    roadDash: $('roadDash'),
    chainTop: $('chainTop'), chainBottom: $('chainBottom'),
    hillsFar: $('hillsFar'), hillsNear: $('hillsNear')
  };

  // ---- 云 ----
  var clouds = [
    { node: $('cloud1'), x: 720, y: 88,  s: 1.0,  v: 22 },
    { node: $('cloud2'), x: 320, y: 152, s: 0.72, v: 34 },
    { node: $('cloud3'), x: 980, y: 54,  s: 1.25, v: 15 }
  ];

  // ---- 状态 ----
  var crankA = -0.6, wheelA = 0, road = 0, chainOff = 0, t = 0;

  // 两骨反向运动学：髋(hx,hy) → 踝(fx,fy)，膝盖朝前(+x)
  function ik(hx, hy, fx, fy, l1, l2) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    var dc = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.0001), l1 + l2 - 0.0001);
    var ux = dx / d, uy = dy / d;
    var a = (l1 * l1 - l2 * l2 + dc * dc) / (2 * dc);
    var h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    return [hx + a * ux + h * uy, hy + a * uy - h * ux];
  }

  function setLine(node, x1, y1, x2, y2) {
    node.setAttribute('x1', x1.toFixed(2));
    node.setAttribute('y1', y1.toFixed(2));
    node.setAttribute('x2', x2.toFixed(2));
    node.setAttribute('y2', y2.toFixed(2));
  }

  // 一条腿：髋 → 膝 → 踝 + 蹼脚落在踏板上
  function updateLeg(side, hip, pedal, bob) {
    var ankleX = pedal.x - 3, ankleY = pedal.y - 9;
    var k = ik(hip.x, hip.y + bob, ankleX, ankleY, THIGH, SHIN);
    setLine(el['thigh' + side], hip.x, hip.y + bob, k[0], k[1]);
    setLine(el['shin' + side], k[0], k[1], ankleX, ankleY);
    el['foot' + side].setAttribute('transform',
      'translate(' + pedal.x.toFixed(2) + ' ' + (pedal.y - 6).toFixed(2) + ')');
  }

  var last = (typeof performance !== 'undefined' ? performance.now() : 0);

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    t += dt;

    // 曲柄与车轮
    crankA += CRANK_SPEED * dt;
    wheelA += CRANK_SPEED * GEAR * dt;
    var wheelDeg = (wheelA * 180 / Math.PI).toFixed(2);
    el.spokesR.setAttribute('transform', 'rotate(' + wheelDeg + ' 250 400)');
    el.spokesF.setAttribute('transform', 'rotate(' + wheelDeg + ' 640 400)');

    // 踏板位置（近远相差 180°）
    var c = Math.cos(crankA), s = Math.sin(crankA);
    var pedalN = { x: BB.x + c * CRANK, y: BB.y + s * CRANK };
    var pedalF = { x: BB.x - c * CRANK, y: BB.y - s * CRANK };

    setLine(el.crankN, BB.x, BB.y, pedalN.x, pedalN.y);
    setLine(el.crankF, BB.x, BB.y, pedalF.x, pedalF.y);
    el.pedalN.setAttribute('transform', 'translate(' + pedalN.x.toFixed(2) + ' ' + pedalN.y.toFixed(2) + ')');
    el.pedalF.setAttribute('transform', 'translate(' + pedalF.x.toFixed(2) + ' ' + pedalF.y.toFixed(2) + ')');

    // 身体随蹬踏起伏，双腿用 IK 跟随踏板
    var bob = 2.0 * Math.sin(crankA);
    el.pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    updateLeg('N', hipN, pedalN, bob);
    updateLeg('F', hipF, pedalF, bob);

    // 链条 / 路面 / 视差山丘
    chainOff += CRANK_SPEED * 30 * dt;
    el.chainTop.setAttribute('stroke-dashoffset', (-chainOff % 17).toFixed(2));
    el.chainBottom.setAttribute('stroke-dashoffset', (chainOff % 17).toFixed(2));

    road += ROAD_SPEED * dt;
    el.roadDash.setAttribute('stroke-dashoffset', (road % 100).toFixed(2));
    el.hillsFar.setAttribute('transform', 'translate(' + (-(road * 0.10 % 900)).toFixed(2) + ' 0)');
    el.hillsNear.setAttribute('transform', 'translate(' + (-(road * 0.30 % 900)).toFixed(2) + ' 0)');

    // 云
    for (var i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      cl.x -= cl.v * dt;
      if (cl.x < -260) cl.x += 1360;
      cl.node.setAttribute('transform',
        'translate(' + cl.x.toFixed(2) + ' ' + cl.y + ') scale(' + cl.s + ')');
    }

    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(frame);
    }
  }

  // 初始化云位置，随后启动主循环
  for (var i = 0; i < clouds.length; i++) {
    clouds[i].node.setAttribute('transform',
      'translate(' + clouds[i].x + ' ' + clouds[i].y + ') scale(' + clouds[i].s + ')');
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
