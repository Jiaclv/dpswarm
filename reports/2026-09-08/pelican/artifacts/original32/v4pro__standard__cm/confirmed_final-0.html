    transform-box: fill-box;
    transform-origin: 50% 15%;
    transform: scaleY(0);
    animation: blink 4.4s infinite;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(0); }
    92.5% { transform: scaleY(1); }
    95% { transform: scaleY(0); }
  }
  /* 喉囊呼吸 */
  .pouch {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: pouch 2.8s ease-in-out infinite;
  }
  @keyframes pouch {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05, 1.09); }
  }
  /* 上喙轻张 */
  .beakup {
    transform-box: fill-box;
    transform-origin: 0% 85%;
    animation: chirp 3.4s infinite;
  }
  @keyframes chirp {
    0%, 70%, 100% { transform: rotate(0deg); }
    76%, 84% { transform: rotate(-4deg); }
  }
</style>

<script>
(function () {
  "use strict";
  var BB = { x: 392, y: 308 };      // 中轴
  var R  = 24;                       // 曲柄半径
  var crankW = 2 * Math.PI / 1.0;    // 踏频：1 圈/秒
  var speed  = 200;                  // 地面速度 px/s
  var wheelW = speed / 52;           // 轮子角速度 rad/s（半径 52）

  var crankG   = document.getElementById('crankG');
  var pedalN   = document.getElementById('pedalN');
  var pedalF   = document.getElementById('pedalF');
  var spokesR  = document.getElementById('spokesR');
  var spokesF  = document.getElementById('spokesF');
  var legN     = document.getElementById('legN');
  var legF     = document.getElementById('legF');
  var chain    = document.getElementById('chain');
  var road     = document.getElementById('roadDashes');
  var trees    = document.getElementById('trees');
  var tufts    = document.getElementById('tufts');
  var bodyG    = document.getElementById('bodyG');
  var wingG    = document.getElementById('wingG');
  var headG    = document.getElementById('headG');

  // 两段式腿的逆向运动学：已知髋 H 与脚踏 F，求膝 K（取靠前的一解）
  function ik(H, F, L1, L2) {
    var dx = F.x - H.x, dy = F.y - H.y;
    var d = Math.hypot(dx, dy);
    var a = Math.acos(Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
    var ux = dx / d, uy = dy / d;
    var c = Math.cos(a), s = Math.sin(a);
    var k1 = { x: H.x + L1 * (ux * c - uy * s), y: H.y + L1 * (ux * s + uy * c) };
    var k2 = { x: H.x + L1 * (ux * c + uy * s), y: H.y + L1 * (-ux * s + uy * c) };
    return k1.x >= k2.x ? k1 : k2;
  }

  var t0 = null;
  function frame(t) {
    if (t0 === null) t0 = t;
    var sec = (t - t0) / 1000;
    var a = crankW * sec;                    // 曲柄角（弧度）
    var aDeg = a * 180 / Math.PI;

    // 脚踏位置（右前左后，相差 180°）
    var pnx = BB.x + R * Math.sin(a),  pny = BB.y - R * Math.cos(a);
    var pfx = BB.x - R * Math.sin(a),  pfy = BB.y + R * Math.cos(a);

    // 曲柄与脚踏
    crankG.setAttribute('transform', 'rotate(' + aDeg + ' 392 308)');
    pedalN.setAttribute('transform', 'rotate(' + (-aDeg) + ' 392 284)');
    pedalF.setAttribute('transform', 'rotate(' + (-aDeg) + ' 392 332)');

    // 身体随踩踏轻微起伏，腿随之伸缩
    var bob = 1.6 * Math.sin(2 * a);
    var Hn = { x: 350, y: 198 + bob };
    var Hf = { x: 366, y: 204 + bob * 0.8 };

    var kn = ik(Hn, { x: pnx, y: pny }, 58, 88);
    var kf = ik(Hf, { x: pfx, y: pfy }, 56, 84);

    legN.setAttribute('d', 'M' + Hn.x + ' ' + Hn.y +
                          ' L' + kn.x.toFixed(1) + ' ' + kn.y.toFixed(1) +
                          ' L' + pnx.toFixed(1) + ' ' + pny.toFixed(1));
    legF.setAttribute('d', 'M' + Hf.x + ' ' + Hf.y +
                          ' L' + kf.x.toFixed(1) + ' ' + kf.y.toFixed(1) +
                          ' L' + pfx.toFixed(1) + ' ' + pfy.toFixed(1));

    // 车轮
    var wDeg = wheelW * sec * 180 / Math.PI;
    spokesR.setAttribute('transform', 'rotate(' + wDeg + ' 290 308)');
    spokesF.setAttribute('transform', 'rotate(' + wDeg + ' 472 308)');

    // 链条与路面虚线
    chain.setAttribute('stroke-dashoffset', (120 * sec) % 10);
    road.setAttribute('stroke-dashoffset', (speed * sec) % 68);

    // 背景滚动（树木视差 0.55 倍）
    trees.setAttribute('transform', 'translate(' + (-(speed * 0.55 * sec) % 800) + ',0)');
    tufts.setAttribute('transform', 'translate(' + (-(speed * sec) % 800) + ',0)');

    // 身体起伏、头部摆动、翅膀扇动
    bodyG.setAttribute('transform', 'translate(0,' + bob + ')');
    headG.setAttribute('transform', 'rotate(' + (1.8 * Math.sin(2 * a + 0.7)) + ' 396 140)');
    wingG.setAttribute('transform', 'rotate(' + (-12 * Math.sin(2 * Math.PI * sec / 3.4)) + ' 350 148)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
