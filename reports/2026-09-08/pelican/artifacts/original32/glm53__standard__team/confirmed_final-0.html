<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican Ride</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 20%,#182433,#0c1219 75%);font-family:system-ui,"Microsoft YaHei",sans-serif}
  svg{width:min(97vw,150vh);max-height:97vh;display:block;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);cursor:pointer}
  svg.paused *{animation-play-state:paused!important}

  /* ---------- 通用关键帧 ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}
  @keyframes slide{to{transform:translateX(-900px)}}
  @keyframes roadDash{to{stroke-dashoffset:-80}}
  @keyframes chainMove{to{stroke-dashoffset:-12}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
  @keyframes shadowPulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.93)}}
  @keyframes neckSway{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.4deg)}}
  @keyframes wingFlap{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(3.2deg)}}
  @keyframes pouchW{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,1.07)}}
  @keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
  @keyframes scarfW{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  @keyframes puff{0%{transform:translate(0,0) scale(.35);opacity:.5}70%{opacity:.28}100%{transform:translate(-74px,-30px) scale(1.8);opacity:0}}
  @keyframes speed{0%{transform:translateX(14px);opacity:0}25%{opacity:.8}100%{transform:translateX(-96px);opacity:0}}
  @keyframes sunRays{to{transform:rotate(360deg)}}
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes gullFly{from{transform:translate(950px,116px)}to{transform:translate(-180px,92px)}}
  @keyframes gullFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
  @keyframes fishW{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}

  /* ---------- 腿部蹬踏（两连杆 IK 关键帧，随曲柄 2.4s 一圈）---------- */
  @keyframes thighK{0%{transform:rotate(77.4deg)}12.5%{transform:rotate(77.5deg)}25%{transform:rotate(90.2deg)}37.5%{transform:rotate(109.3deg)}50%{transform:rotate(122.7deg)}62.5%{transform:rotate(119.4deg)}75%{transform:rotate(101.3deg)}87.5%{transform:rotate(85.8deg)}100%{transform:rotate(77.4deg)}}
  @keyframes shinK{0%{transform:rotate(-63.8deg)}12.5%{transform:rotate(-46.3deg)}25%{transform:rotate(-53deg)}37.5%{transform:rotate(-75.9deg)}50%{transform:rotate(-101deg)}62.5%{transform:rotate(-116.3deg)}75%{transform:rotate(-111.1deg)}87.5%{transform:rotate(-89.7deg)}100%{transform:rotate(-63.8deg)}}
  @keyframes footK{0%{transform:rotate(-13.6deg)}12.5%{transform:rotate(-31.2deg)}25%{transform:rotate(-37.2deg)}37.5%{transform:rotate(-33.3deg)}50%{transform:rotate(-21.7deg)}62.5%{transform:rotate(-3.2deg)}75%{transform:rotate(9.8deg)}87.5%{transform:rotate(4deg)}100%{transform:rotate(-13.6deg)}}

  /* ---------- 元素动画绑定 ---------- */
  .scroll{animation:slide 50s linear infinite}
  .spinW{transform-origin:0 0;animation:spin 1s linear infinite}
  .crank{transform-origin:0 0;animation:spin 2.4s linear infinite}
  .pedal{transform-origin:0 0;animation:spinRev 2.4s linear infinite}
  .thigh{transform-origin:0 0;animation:thighK 2.4s linear infinite}
  .shin{transform-origin:0 0;animation:shinK 2.4s linear infinite}
  .foot{transform-origin:0 0;animation:footK 2.4s linear infinite}
  .legFar .thigh,.legFar .shin,.legFar .foot{animation-delay:-1.2s}
  .chain{stroke-dasharray:7 5;animation:chainMove .23s linear infinite}
  .roadDash{stroke-dasharray:44 36;animation:roadDash .163s linear infinite}
  .bob{animation:bob 1.2s ease-in-out infinite}
  .shadowPulse{transform-origin:0 0;animation:shadowPulse 1.2s ease-in-out infinite}
  .neckSway{transform-origin:0 0;animation:neckSway 2.4s ease-in-out infinite}
  .wingFlap{transform-origin:0 0;animation:wingFlap 1.2s ease-in-out infinite}
  .pouchW{transform-origin:0 0;animation:pouchW 1.2s ease-in-out infinite}
  .blink{transform-origin:0 0;animation:blink 4.4s linear infinite}
  .scarfW{transform-origin:0 0;animation:scarfW 1.1s ease-in-out infinite}
  .puff{transform-origin:0 0;animation:puff 1s linear infinite}
  .speed{animation:speed .8s linear infinite}
  .sunRays{transform-origin:0 0;animation:sunRays 36s linear infinite}
  .sunPulse{transform-origin:0 0;animation:sunPulse 4s ease-in-out infinite}
  .gullMove{animation:gullFly 26s linear infinite}
  .gullFlap{transform-origin:0 0;animation:gullFlap .5s ease-in-out infinite}
  .fishW{transform-origin:0 0;animation:fishW .9s ease-in-out infinite}

  @media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
</head>
<body>
<svg viewBox="0 0 900 600" role="img" aria-label="一只白色鹈鹕戴着红围巾，骑红色自行车在乡间公路上前行，车轮旋转、双腿蹬踏，背景滚动">
  <desc>纯 SVG + CSS 绘制的 2D 动画：鹈鹕骑自行车。点击画面可暂停或继续。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f2"/>
      <stop offset=".72" stop-color="#d9f2fc"/>
      <stop offset="1" stop-color="#f2f9ec"/>
    </linearGradient>
    <g id="cloud" fill="#fff">
      <ellipse cx="0" cy="0" rx="30" ry="17"/>
      <ellipse cx="24" cy="7" rx="22" ry="13"/>
      <ellipse cx="-25" cy="8" rx="20" ry="12"/>
      <ellipse cx="2" cy="10" rx="34" ry="12"/>
    </g>
    <g id="cloudsFarPat" fill="#ffffff" opacity=".88">
      <use href="#cloud" transform="translate(120,64) scale(1.05)"/>
      <use href="#cloud" transform="translate(470,132) scale(.7)"/>
      <use href="#cloud" transform="translate(735,52) scale(.55)"/>
    </g>
    <g id="cloudsNearPat" fill="#ffffff" opacity=".98">
      <use href="#cloud" transform="translate(255,102) scale(1.3)"/>
      <use href="#cloud" transform="translate(680,152) scale(.95)"/>
    </g>
    <g id="gull" stroke="#5b6c7a" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-30 0 C -18 -12, -8 -12, 0 -2 C 8 -12, 18 -12, 30 0"/>
    </g>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(760,88)">
    <g class="sunRays" stroke="#ffd94d" stroke-width="5" stroke-linecap="round">
      <line x1="46" y1="0" x2="60" y2="0"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(45)"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(90)"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(135)"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(180)"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(225)"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(270)"/>
      <line x1="46" y1="0" x2="60" y2="0" transform="rotate(315)"/>
    </g>
    <g class="sunPulse">
      <circle r="34" fill="#ffd94d" stroke="#f0b429" stroke-width="4"/>
    </g>
  </g>

  <!-- 云（双层视差滚动） -->
  <g class="scroll" style="animation-duration:50s">
    <use href="#cloudsFarPat"/>
    <use href="#cloudsFarPat" x="900"/>
  </g>
  <g class="scroll" style="animation-duration:30s">
    <use href="#cloudsNearPat"/>
    <use href="#cloudsNearPat" x="900"/>
  </g>

  <!-- 远处海鸥 -->
  <g class="gullMove"><g class="gullFlap"><use href="#gull"/></g></g>
  <g class="gullMove" style="animation-delay:-13s">
    <g transform="translate(34,42) scale(.7)"><g class="gullFlap" style="animation-delay:-.22s"><use href="#gull"/></g></g>
  </g>

  <!-- 远山（视差层 1） -->
  <g class="scroll" style="animation-duration:14s">
    <g id="hillsFarPat">
      <path d="M0 500 C 60 466, 130 466, 190 500 C 240 474, 310 474, 370 500 C 430 468, 500 468, 560 500 C 620 474, 690 474, 750 500 C 800 480, 850 480, 900 500 L 900 505 L 0 505 Z" fill="#c7e6b7"/>
    </g>
    <use href="#hillsFarPat" x="900"/>
  </g>

  <!-- 近山（视差层 2） -->
  <g class="scroll" style="animation-duration:6.5s">
    <g id="hillsNearPat">
      <path d="M0 502 C 90 448, 200 448, 290 502 C 360 468, 440 468, 510 502 C 590 450, 700 450, 790 502 C 830 484, 860 484, 900 502 L 900 508 L 0 508 Z" fill="#9fd48d"/>
    </g>
    <use href="#hillsNearPat" x="900"/>
  </g>

  <!-- 路边草皮带 -->
  <rect x="0" y="500" width="900" height="24" fill="#7fbf6e"/>

  <!-- 行道树（近景滚动层） -->
  <g class="scroll" style="animation-duration:1.84s">
    <g id="treesPat">
      <rect x="166" y="436" width="9" height="80" rx="3.5" fill="#8a5a33" stroke="#6d441f" stroke-width="2"/>
      <circle cx="143" cy="436" r="21" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
      <circle cx="198" cy="433" r="23" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
      <circle cx="170" cy="418" r="34" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
      <circle cx="160" cy="410" r="12" fill="#6abf63"/>
      <g transform="translate(760,514) scale(.72)">
        <rect x="-4" y="-78" width="8" height="78" rx="3" fill="#8a5a33" stroke="#6d441f" stroke-width="2"/>
        <circle cx="-22" cy="-74" r="18" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
        <circle cx="22" cy="-76" r="19" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
        <circle cx="0" cy="-92" r="32" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
      </g>
      <ellipse cx="500" cy="505" rx="27" ry="15" fill="#4f9d4f" stroke="#3d7d3d" stroke-width="3"/>
      <ellipse cx="523" cy="508" rx="15" ry="10" fill="#6abf63"/>
      <path d="M60 516 q3 -9 6 0 M320 514 q3 -9 6 0 M640 516 q3 -9 6 0 M860 514 q3 -9 6 0" stroke="#4c8a44" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g stroke="#4c8a44" stroke-width="2">
        <line x1="230" y1="518" x2="230" y2="510"/><circle cx="230" cy="508" r="3" fill="#e8656e" stroke="none"/>
        <line x1="410" y1="516" x2="410" y2="509"/><circle cx="410" cy="507" r="3" fill="#f3c53d" stroke="none"/>
        <line x1="700" y1="518" x2="700" y2="510"/><circle cx="700" cy="508" r="3" fill="#e8656e" stroke="none"/>
      </g>
    </g>
    <use href="#treesPat" x="900"/>
  </g>

  <!-- ============ 公路 ============ -->
  <rect x="0" y="524" width="900" height="76" fill="#575a61"/>
  <rect x="0" y="524" width="900" height="7" fill="#4a4d53"/>
  <line x1="0" y1="534" x2="900" y2="534" stroke="#dfe3e6" stroke-width="3.5"/>
  <line class="roadDash" x1="-60" y1="566" x2="960" y2="566" stroke="#f4d03f" stroke-width="7"/>

  <!-- 车影 -->
  <g transform="translate(430,530)">
    <g class="shadowPulse">
      <ellipse rx="235" ry="9" fill="#000" opacity=".18"/>
    </g>
  </g>

  <!-- 尾部扬尘 -->
  <g transform="translate(245,520)" fill="#cfc8bd">
    <circle class="puff" r="7"/>
    <circle class="puff" r="7" style="animation-delay:-.33s"/>
    <circle class="puff" r="7" style="animation-delay:-.66s"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#9fb9c8" stroke-width="6" stroke-linecap="round">
    <line class="speed" x1="130" y1="296" x2="196" y2="296"/>
    <line class="speed" x1="112" y1="330" x2="186" y2="330" style="animation-delay:-.27s"/>
    <line class="speed" x1="136" y1="364" x2="192" y2="364" style="animation-delay:-.54s"/>
  </g>

  <!-- ============ 骑手：鹈鹕 + 自行车（整体轻微起伏）============ -->
  <g class="bob">

    <!-- 远侧腿（暗色，随远侧踏板，相位差半圈） -->
    <g transform="translate(320,330)">
      <g class="legFar">
        <g class="thigh">
          <path d="M0 0 L95 0" stroke="#c9711c" stroke-width="13" stroke-linecap="round" fill="none"/>
          <g transform="translate(95,0)">
            <g class="shin">
              <path d="M0 0 L95 0" stroke="#c9711c" stroke-width="10" stroke-linecap="round" fill="none"/>
              <g transform="translate(95,0)">
                <g class="foot">
                  <path d="M-6 -5 L26 -4 Q34 0 26 4 L-4 6 Q-10 0 -6 -5 Z" fill="#c9711c" stroke="#8f5410" stroke-width="3"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- 远侧曲柄与踏板（车架后侧） -->
    <g transform="translate(395,445)">
      <g class="crank">
        <path d="M0 0 L-38 0" stroke="#3c3f45" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(-38,0)">
          <g class="pedal">
            <rect x="-15" y="-5" width="30" height="9" rx="3.5" fill="#33363b" stroke="#23252a" stroke-width="2"/>
          </g>
        </g>
        <circle r="5.5" fill="#23252a"/>
      </g>
    </g>

    <!-- 后轮 -->
    <g transform="translate(250,440)">
      <circle r="78" fill="none" stroke="#3a3d42" stroke-width="12"/>
      <circle r="69" fill="none" stroke="#cfd4d9" stroke-width="5"/>
      <g class="spinW">
        <path d="M-64 0 H64 M0 -64 V64 M-45.3 -45.3 L45.3 45.3 M-45.3 45.3 L45.3 -45.3" stroke="#aab2ba" stroke-width="3.5"/>
      </g>
      <circle r="9.5" fill="none" stroke="#46494e" stroke-width="4"/>
      <circle r="6.5" fill="#7d838b" stroke="#565b61" stroke-width="2"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(610,440)">
      <circle r="78" fill="none" stroke="#3a3d42" stroke-width="12"/>
      <circle r="69" fill="none" stroke="#cfd4d9" stroke-width="5"/>
      <g class="spinW">
        <path d="M-64 0 H64 M0 -64 V64 M-45.3 -45.3 L45.3 45.3 M-45.3 45.3 L45.3 -45.3" stroke="#aab2ba" stroke-width="3.5"/>
      </g>
      <circle r="6.5" fill="#7d838b" stroke="#565b61" stroke-width="2"/>
    </g>

    <!-- 车架（描边 + 红色） -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#23252a" stroke-width="13">
        <path d="M395 445 L320 322"/>
        <path d="M320 322 L553 322"/>
        <path d="M395 445 L560 350"/>
        <path d="M553 322 L563 352" stroke-width="15"/>
        <path d="M563 352 L610 440"/>
        <path d="M250 440 L322 326"/>
        <path d="M250 440 L395 445"/>
      </g>
      <g stroke="#d7483f" stroke-width="8">
        <path d="M395 445 L320 322"/>
        <path d="M320 322 L553 322"/>
        <path d="M395 445 L560 350"/>
        <path d="M553 322 L563 352" stroke-width="10"/>
        <path d="M563 352 L610 440"/>
        <path d="M250 440 L322 326"/>
        <path d="M250 440 L395 445"/>
      </g>
    </g>

    <!-- 链条（虚线流动） -->
    <path class="chain" d="M250 429 L395 422 A 23 23 0 0 1 395 468 L 250 451 A 11 11 0 0 1 250 429 Z" fill="none" stroke="#46494e" stroke-width="5"/>

    <!-- 车座 -->
    <line x1="320" y1="322" x2="316" y2="312" stroke="#55585e" stroke-width="7" stroke-linecap="round"/>
    <rect x="292" y="303" width="50" height="12" rx="6" fill="#7a4a21" stroke="#4c2d12" stroke-width="3"/>

    <!-- 车把 + 车铃 -->
    <g fill="none" stroke-linecap="round">
      <path d="M553 322 L548 305 C 544 298, 534 299, 530 306" stroke="#23252a" stroke-width="10"/>
      <path d="M553 322 L548 305 C 544 298, 534 299, 530 306" stroke="#8b9098" stroke-width="6"/>
    </g>
    <circle cx="529" cy="307" r="5.5" fill="#23252a"/>
    <circle cx="543" cy="297" r="5" fill="#f3c53d" stroke="#23252a" stroke-width="2.5"/>

    <!-- 前车筐 + 小鱼 -->
    <path d="M576 318 L558 331 M624 318 L565 335" stroke="#6d441f" stroke-width="4" stroke-linecap="round"/>
    <rect x="572" y="285" width="58" height="34" rx="5" fill="#c99a5b" stroke="#6d441f" stroke-width="3.5"/>
    <path d="M572 297 H630 M572 308 H630 M586 285 V319 M600 285 V319 M614 285 V319" stroke="#8a6234" stroke-width="2"/>
    <g transform="translate(598,282)">
      <g class="fishW">
        <path d="M-16 -2 C -8 -13, 8 -13, 16 -3 C 8 6, -8 6, -16 -2 Z" fill="#8fc0d8" stroke="#4d7d95" stroke-width="3"/>
        <path d="M-16 -2 L-26 -9 L-23 0 L-26 8 Z" fill="#8fc0d8" stroke="#4d7d95" stroke-width="3"/>
        <circle cx="8" cy="-4" r="1.8" fill="#23343f"/>
      </g>
    </g>

    <!-- 近侧曲柄、牙盘与踏板 -->
    <g transform="translate(395,445)">
      <g class="crank">
        <circle r="21" fill="none" stroke="#53575e" stroke-width="5.5" stroke-dasharray="4 3"/>
        <path d="M0 0 L38 0" stroke="#53575e" stroke-width="7.5" stroke-linecap="round"/>
        <g transform="translate(38,0)">
          <g class="pedal">
            <rect x="-16" y="-5" width="32" height="9" rx="3.5" fill="#3c3f45" stroke="#23252a" stroke-width="2"/>
          </g>
        </g>
        <circle r="5" fill="#23252a"/>
      </g>
    </g>

    <!-- 近侧腿（亮色，踩近侧踏板） -->
    <g transform="translate(320,330)">
      <g class="thigh">
        <path d="M0 0 L95 0" stroke="#f0922b" stroke-width="13" stroke-linecap="round" fill="none"/>
        <g transform="translate(95,0)">
          <g class="shin">
            <path d="M0 0 L95 0" stroke="#f0922b" stroke-width="10" stroke-linecap="round" fill="none"/>
            <g transform="translate(95,0)">
              <g class="foot">
                <path d="M-6 -5 L28 -4 Q36 0 28 4 L-4 6 Q-10 0 -6 -5 Z" fill="#f0922b" stroke="#a66514" stroke-width="3"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- 鹈鹕身体 -->
    <g stroke-linejoin="round">
      <path d="M306 296 C 288 282, 272 280, 256 284 C 266 292, 260 298, 250 302 C 262 306, 258 312, 252 316 C 270 318, 290 312, 304 306 Z" fill="#fff" stroke="#33322e" stroke-width="4"/>
      <path d="M304 292 C 322 250, 372 238, 406 260 C 430 275, 434 300, 419 325 C 402 349, 351 353, 325 337 C 308 327, 297 309, 304 292 Z" fill="#fff" stroke="#33322e" stroke-width="4.5"/>
      <path d="M338 341 C 368 348, 398 339, 413 320 C 406 344, 366 354, 338 341 Z" fill="#e9e4da"/>
    </g>

    <!-- 翅膀搭在车把上 -->
    <g transform="translate(398,272)">
      <g class="wingFlap">
        <path d="M-6 -4 C 32 -14, 88 0, 130 28 C 133 33, 130 38, 122 38 C 82 38, 34 34, 2 26 C -8 22, -12 0, -6 -4 Z" fill="#fff" stroke="#33322e" stroke-width="4.5"/>
        <path d="M108 30 L114 23 M92 29 L97 22" stroke="#33322e" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 脖子、围巾与头（轻轻摇摆） -->
    <g transform="translate(438,222)">
      <g class="neckSway">
        <path d="M398 260 C 420 252, 432 236, 438 210 C 443 188, 452 172, 470 163" stroke="#33322e" stroke-width="41" fill="none" stroke-linecap="round"/>
        <path d="M398 260 C 420 252, 432 236, 438 210 C 443 188, 452 172, 470 163" stroke="#fff" stroke-width="33" fill="none" stroke-linecap="round"/>
        <g transform="translate(434,236)">
          <path class="scarfW" d="M0 -7 C -15 -11, -32 -7, -46 3 C -33 6, -20 8, -7 8 C 0 8, 3 3, 0 -7 Z" fill="#e04f3f" stroke="#33322e" stroke-width="3"/>
          <circle r="5" fill="#c93d2f" stroke="#33322e" stroke-width="2.5"/>
        </g>
        <circle cx="474" cy="161" r="23.5" fill="#fff" stroke="#33322e" stroke-width="4.5"/>
        <path d="M455 150 C 449 138, 459 132, 467 141 C 463 143, 459 146, 455 150 Z" fill="#fff" stroke="#33322e" stroke-width="3.5"/>
        <!-- 喉囊（微微晃动） -->
        <g transform="translate(468,168)">
          <g class="pouchW">
            <path d="M-6 -4 C -2 40, 38 70, 92 46 C 88 53, 80 58, 71 60 C 25 70, -10 40, -12 -2 Z" fill="#f8c357" stroke="#33322e" stroke-width="4"/>
          </g>
        </g>
        <!-- 上喙 -->
        <path d="M461 152 C 500 141, 553 168, 590 207 L 584 215 C 550 187, 505 164, 459 168 Z" fill="#f5a623" stroke="#33322e" stroke-width="4"/>
        <path d="M472 158 L500 153" stroke="#d98c1a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 眼睛（眨眼） -->
        <g transform="translate(476,146)">
          <g class="blink">
            <circle r="5" fill="#23343f"/>
