<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    display: grid; place-items: center;
    background: #141a23;
  }
  svg {
    width: min(96vw, 1000px); height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  .cloud { fill: #ffffff; }
  .cloud1 { animation: drift 30s linear infinite; }
  .cloud2 { animation: drift 44s linear infinite; animation-delay: -22s; }
  .cloud3 { animation: drift 37s linear infinite; animation-delay: -14s; }
  @keyframes drift { from { transform: translateX(-240px); } to { transform: translateX(1160px); } }

  .dash { stroke-dasharray: 46 30; animation: dashmove .5s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset: 76; } }

  .chain { stroke-dasharray: 5 4; animation: chainmove .35s linear infinite; }
  @keyframes chainmove { to { stroke-dashoffset: -9; } }

  .wind { opacity: 0; animation: windmove 1.1s ease-out infinite; }
  .wind.w2 { animation-delay: .35s; }
  .wind.w3 { animation-delay: .7s; }
  @keyframes windmove {
    0%   { transform: translateX(36px);  opacity: 0; }
    25%  { opacity: .75; }
    100% { transform: translateX(-70px); opacity: 0; }
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进的2D动画">

      <!-- 喉囊 -->

    <path d="M424 240 C464 230 520 244 560 266" stroke="#fbf6ea" stroke-width="13" fill="none" stroke-linecap="round"/>

    <path id="legNearIn"  d="M395 290 L469.9 332.3 L463 418" fill="none" stroke="#f48c06" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // 几何参数
  var C = { x: 425, y: 418 };   // 中轴（曲柄中心）
  var R = 38;                   // 曲柄长
  var HIP = { x: 395, y: 290 }; // 髋关节
  var L1 = 86, L2 = 86;         // 大腿 / 小腿长度
  var TAU = Math.PI * 2;
  var OMEGA = TAU / 1.4;        // 踩踏角速度

  var legNearOut = $('legNearOut'), legNearIn = $('legNearIn');
  var legFarOut = $('legFarOut'),   legFarIn = $('legFarIn');
  var crankNear = $('crankNear'),   crankFar = $('crankFar');
  var pedalNear = $('pedalNear'),   pedalFar = $('pedalFar');
  var bodyG = $('pelicanBody');

  // 两段式反向运动学：给定髋与脚，求膝盖（膝盖向前弯）
  function knee(H, F) {
    var dx = F.x - H.x, dy = F.y - H.y;
    var d = Math.hypot(dx, dy) || 0.001;
    var dc = Math.min(d, L1 + L2 - 0.5);
    var a = (L1 * L1 - L2 * L2 + dc * dc) / (2 * dc);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var ux = dx / d, uy = dy / d;
    var bx = H.x + a * ux, by = H.y + a * uy;
    var k1 = { x: bx - h * uy, y: by + h * ux };
    var k2 = { x: bx + h * uy, y: by - h * ux };
    return k1.x > k2.x ? k1 : k2;
  }

  function setLeg(out, inn, H, F) {
    var K = knee(H, F);
    var d = 'M' + H.x.toFixed(1) + ' ' + H.y.toFixed(1) +
            ' L' + K.x.toFixed(1) + ' ' + K.y.toFixed(1) +
            ' L' + F.x.toFixed(1) + ' ' + F.y.toFixed(1);
    out.setAttribute('d', d);
    inn.setAttribute('d', d);
  }

  var start = performance.now();
  function frame(now) {
    var t = (now - start) / 1000;
    var th = t * OMEGA;

    var p1 = { x: C.x + R * Math.cos(th),            y: C.y + R * Math.sin(th) };
    var p2 = { x: C.x + R * Math.cos(th + Math.PI),  y: C.y + R * Math.sin(th + Math.PI) };

    // 身体随踩踏轻微起伏，髋关节同步
    var bob = 2.4 * Math.sin(2 * th);
    var hip = { x: HIP.x, y: HIP.y + bob };
    bodyG.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

    crankNear.setAttribute('x2', p1.x.toFixed(1));
    crankNear.setAttribute('y2', p1.y.toFixed(1));
    crankFar.setAttribute('x2', p2.x.toFixed(1));
    crankFar.setAttribute('y2', p2.y.toFixed(1));

    pedalNear.setAttribute('transform', 'translate(' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) + ')');
    pedalFar.setAttribute('transform', 'translate(' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1) + ')');

    setLeg(legNearOut, legNearIn, hip, p1);
    setLeg(legFarOut, legFarIn, hip, p2);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
