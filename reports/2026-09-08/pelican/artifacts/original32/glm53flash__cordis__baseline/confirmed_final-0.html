<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px; box-sizing: border-box;
    background: linear-gradient(160deg, #dfe9f3 0%, #f6f8fa 55%, #eef3ee 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #33414d;
  }
  .stage {
    background: #fff; border-radius: 18px; overflow: hidden; line-height: 0;
    box-shadow: 0 18px 50px rgba(40, 60, 90, .18);
  }
  svg { display: block; width: min(92vw, 860px); height: auto; }
  .caption { text-align: center; line-height: 1.6; }
  .caption strong { font-size: 17px; }
  .caption small { color: #7b8794; }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的2D动画">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd9ff"/>
      <stop offset=".65" stop-color="#cfeefe"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed07a"/>
      <stop offset="1" stop-color="#63b054"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565660"/>
      <stop offset="1" stop-color="#3f3f49"/>
    </linearGradient>
    <radialGradient id="sunglow">
      <stop offset="0" stop-color="#ffe680" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <circle cx="700" cy="88" r="70" fill="url(#sunglow)"/>
  <g stroke="#ffd93b" stroke-width="5" stroke-linecap="round" opacity=".85">
    <animateTransform attributeName="transform" type="rotate" from="0 700 88" to="360 700 88" dur="80s" repeatCount="indefinite"/>
    <line x1="752" y1="88" x2="768" y2="88"/>
    <line x1="745" y1="114" x2="759" y2="122"/>
    <line x1="726" y1="133" x2="734" y2="147"/>
    <line x1="700" y1="140" x2="700" y2="156"/>
    <line x1="674" y1="133" x2="666" y2="147"/>
    <line x1="655" y1="114" x2="641" y2="122"/>
    <line x1="648" y1="88" x2="632" y2="88"/>
    <line x1="655" y1="62" x2="641" y2="54"/>
    <line x1="674" y1="43" x2="666" y2="29"/>
    <line x1="700" y1="36" x2="700" y2="20"/>
    <line x1="726" y1="43" x2="734" y2="29"/>
    <line x1="745" y1="62" x2="759" y2="54"/>
  </g>
  <circle cx="700" cy="88" r="40" fill="#ffd93b"/>

  <!-- 云（视差飘动） -->
  <g fill="#ffffff" opacity=".92">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1250 0" dur="34s" repeatCount="indefinite"/>
      <g transform="translate(880 95)">
        <ellipse cx="0" cy="0" rx="52" ry="20"/><ellipse cx="-30" cy="6" rx="30" ry="14"/>
        <ellipse cx="30" cy="8" rx="34" ry="15"/><ellipse cx="6" cy="-12" rx="28" ry="16"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1300 0" dur="46s" begin="-22s" repeatCount="indefinite"/>
      <g transform="translate(900 170)">
        <ellipse cx="0" cy="0" rx="44" ry="16"/><ellipse cx="-26" cy="5" rx="24" ry="12"/>
        <ellipse cx="24" cy="6" rx="28" ry="13"/><ellipse cx="4" cy="-10" rx="22" ry="13"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1150 0" dur="26s" begin="-9s" repeatCount="indefinite"/>
      <g transform="translate(760 60)">
        <ellipse cx="0" cy="0" rx="38" ry="14"/><ellipse cx="-20" cy="4" rx="20" ry="10"/>
        <ellipse cx="20" cy="5" rx="22" ry="11"/>
      </g>
    </g>
  </g>

  <!-- 远景山丘、树（无限循环滚动） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="46s" repeatCount="indefinite"/>
    <g id="hills">
      <ellipse cx="140" cy="440" rx="230" ry="120" fill="#bfe6a8"/>
      <ellipse cx="470" cy="450" rx="270" ry="140" fill="#aedc96"/>
      <ellipse cx="720" cy="445" rx="200" ry="110" fill="#c4e9ad"/>
      <g>
        <rect x="76" y="372" width="8" height="26" rx="3" fill="#8d6e4d"/>
        <path d="M80 330 L100 374 L60 374 Z" fill="#5fae64"/>
        <rect x="596" y="360" width="10" height="34" rx="3" fill="#8d6e4d"/>
        <path d="M601 300 L636 370 L566 370 Z" fill="#4f9557"/>
        <path d="M601 326 L630 376 L572 376 Z" fill="#5fae64"/>
      </g>
      <circle cx="238" cy="402" r="14" fill="#6fb371"/>
      <circle cx="256" cy="398" r="17" fill="#7cc469"/>
      <circle cx="272" cy="404" r="12" fill="#6fb371"/>
    </g>
    <use href="#hills" x="800"/>
  </g>

  <!-- 草地与公路 -->
  <rect y="388" width="800" height="22" fill="url(#grass)"/>
  <rect y="410" width="800" height="90" fill="url(#road)"/>
  <rect y="410" width="800" height="5" fill="#63636e"/>
  <line x1="0" y1="452" x2="800" y2="452" stroke="#f4d35e" stroke-width="6" stroke-dasharray="46 34">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur=".3s" repeatCount="indefinite"/>
  </line>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="255" x2="215" y2="255" opacity="0">
      <animate attributeName="opacity" values="0;.75;0" dur="1.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="30 0" to="-120 0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="118" y1="310" x2="196" y2="310" opacity="0">
      <animate attributeName="opacity" values="0;.7;0" dur="1.3s" begin=".35s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="30 0" to="-120 0" dur="1.3s" begin=".35s" repeatCount="indefinite"/>
    </line>
    <line x1="155" y1="365" x2="230" y2="365" opacity="0">
      <animate attributeName="opacity" values="0;.65;0" dur="1.2s" begin=".7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="30 0" to="-120 0" dur="1.2s" begin=".7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="398" cy="416" rx="158" ry="8" fill="#1c2330" opacity=".22"/>

  <!-- ============ 自行车 + 鹈鹕 ============ -->
  <g>

    <!-- 远侧曲柄与踏板（在车架后面） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 395 352" to="360 395 352" dur="1.2s" repeatCount="indefinite"/>
      <line x1="395" y1="352" x2="357" y2="352" stroke="#b03a3f" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(357 352)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-4" width="20" height="8" rx="3" fill="#33333a"/>
        </g>
      </g>
    </g>

    <!-- 后轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 310 350" to="360 310 350" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="310" cy="350" r="48" fill="none" stroke="#c9ced6" stroke-width="3"/>
      <g stroke="#aab2bd" stroke-width="2">
        <line x1="356" y1="350" x2="264" y2="350"/>
        <line x1="342.5" y1="382.5" x2="277.5" y2="317.5"/>
        <line x1="310" y1="396" x2="310" y2="304"/>
        <line x1="277.5" y1="382.5" x2="342.5" y2="317.5"/>
      </g>
    </g>
    <circle cx="310" cy="350" r="55" fill="none" stroke="#2b2b2e" stroke-width="9"/>
    <circle cx="310" cy="350" r="7" fill="#6b7280"/>
    <circle cx="310" cy="350" r="10" fill="none" stroke="#8a8f98" stroke-width="3"/>

    <!-- 前轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 490 350" to="360 490 350" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="490" cy="350" r="48" fill="none" stroke="#c9ced6" stroke-width="3"/>
      <g stroke="#aab2bd" stroke-width="2">
        <line x1="536" y1="350" x2="444" y2="350"/>
        <line x1="522.5" y1="382.5" x2="457.5" y2="317.5"/>
        <line x1="490" y1="396" x2="490" y2="304"/>
        <line x1="457.5" y1="382.5" x2="522.5" y2="317.5"/>
      </g>
    </g>
    <circle cx="490" cy="350" r="55" fill="none" stroke="#2b2b2e" stroke-width="9"/>
    <circle cx="490" cy="350" r="7" fill="#6b7280"/>

    <!-- 远侧腿（深色，相位差180°） -->
    <path fill="none" stroke="#d96c00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
          d="M375 295 L417 346 L357 352">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
        M375 295 L417 346 L357 352;
        M375 295 L427 335 L368 325;
        M375 295 L436 270 L395 314;
        M375 295 L435 267 L422 325;
        M375 295 L441 293 L433 352;
        M375 295 L436 321 L422 379;
        M375 295 L425 338 L395 390;
        M375 295 L418 345 L368 379;
        M375 295 L417 346 L357 352"/>
    </path>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M310 350 L360 272"/>
      <path d="M360 272 L395 352"/>
      <path d="M395 352 L310 350"/>
      <path d="M362 270 L462 268"/>
      <path d="M462 268 L395 352"/>
      <path d="M464 250 L472 292"/>
      <path d="M472 292 L490 350"/>
    </g>

    <!-- 座杆与车座 -->
    <path d="M360 272 L355 253" stroke="#5b6470" stroke-width="5" stroke-linecap="round"/>
    <rect x="336" y="244" width="40" height="11" rx="5.5" fill="#3d3d44" transform="rotate(-5 356 249)"/>

    <!-- 车把 -->
    <path d="M464 250 L461 233" stroke="#5b6470" stroke-width="5" stroke-linecap="round"/>
    <path d="M461 233 Q452 224 441 227" stroke="#5b6470" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M448 226 L437 230" stroke="#2b2b2e" stroke-width="9" stroke-linecap="round"/>

    <!-- 链条（随踏频流动） -->
    <g stroke="#8a8f98" stroke-width="3" stroke-dasharray="5 3" fill="none">
      <path d="M310 341 L395 338">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur=".45s" repeatCount="indefinite"/>
      </path>
      <path d="M395 366 L310 359">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur=".45s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="395" cy="352" r="14" fill="none" stroke="#8a8f98" stroke-width="4"/>

    <!-- 鹈鹕（身体轻微起伏） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur=".6s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <g fill="#e9e6da" stroke="#d5d1c2" stroke-width="2" stroke-linejoin="round">
        <path d="M300 262 L252 234 L288 268 Z"/>
        <path d="M298 274 L244 264 L290 284 Z"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="345" cy="288" rx="74" ry="50" fill="#fbfaf6" stroke="#ddd8ca" stroke-width="2.5"/>
      <ellipse cx="352" cy="300" rx="56" ry="34" fill="#ffffff" opacity=".55"/>

      <!-- 翅膀（轻摆） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 344 282; 5 344 282; 0 344 282" dur="1.2s" repeatCount="indefinite"/>
        <path d="M310 268 Q366 256 396 282 Q378 312 322 306 Q298 288 310 268 Z" fill="#efede3" stroke="#d5d1c2" stroke-width="2"/>
        <path d="M328 298 Q352 302 378 292" stroke="#d5d1c2" stroke-width="1.5" fill="none"/>
        <path d="M324 286 Q348 290 382 278" stroke="#d5d1c2" stroke-width="1.5" fill="none"/>
      </g>

      <!-- 扶把的翅膀"手臂" -->
      <path d="M382 274 Q416 260 442 231" stroke="#d5d1c2" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M382 274 Q416 260 442 231" stroke="#fbfaf6" stroke-width="8.5" fill="none" stroke-linecap="round"/>
      <circle cx="443" cy="229" r="5" fill="#fbfaf6" stroke="#d5d1c2" stroke-width="1.5"/>

      <!-- 脖子 -->
      <path d="M398 270 C390 244 406 226 426 212 C446 198 450 200 452 192" stroke="#ddd8ca" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M398 270 C390 244 406 226 426 212 C446 198 450 200 452 192" stroke="#fbfaf6" stroke-width="15" fill="none" stroke-linecap="round"/>

      <!-- 头部（轻微晃动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 428 218; 2.5 428 218; -2 428 218"
                          keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
                          dur="2.4s" repeatCount="indefinite"/>
        <circle cx="456" cy="182" r="19" fill="#fbfaf6" stroke="#ddd8ca" stroke-width="2.5"/>

        <!-- 喉囊（随呼吸鼓动） -->
        <path fill="#fca311" stroke="#e08900" stroke-width="1.5"
              d="M467 184 C496 234 544 232 584 197 L584 194 L467 178 Z">
          <animate attributeName="d" dur=".6s" repeatCount="indefinite" values="
            M467 184 C496 234 544 232 584 197 L584 194 L467 178 Z;
            M467 184 C498 244 546 240 584 198 L584 194 L467 178 Z;
            M467 184 C496 234 544 232 584 197 L584 194 L467 178 Z"/>
        </path>
        <!-- 上喙 -->
        <path d="M464 175 Q520 176 586 194 Q589 197 584 200 Q524 196 464 185 Z"
              fill="#f77f00" stroke="#d96c00" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M468 185 L566 197" stroke="#d96c00" stroke-width="1.5"/>
        <path d="M478 180 L494 182" stroke="#d96c00" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 眼睛（会眨） -->
        <circle cx="460" cy="173" r="6" fill="#ffffff" stroke="#cfc9b8" stroke-width="1"/>
        <ellipse cx="461.5" cy="174" rx="3" ry="3.2" fill="#2b2b2e">
          <animate attributeName="ry" values="3.2;3.2;0.3;3.2;3.2" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="460.5" cy="171.8" r="1.1" fill="#ffffff"/>

        <!-- 头盔 -->
        <path d="M436 175 Q436 149 457 147 Q479 149 478 171 Q457 163 436 175 Z" fill="#e63946" stroke="#c22f3b" stroke-width="1.5"/>
        <path d="M449 151 Q451 160 450 168" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
        <path d="M463 150 Q464 158 463 166" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
        <path d="M434 174 Q457 166 480 170" stroke="#c22f3b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M442 180 Q448 196 458 198" stroke="#c22f3b" stroke-width="2" fill="none" opacity=".8"/>
      </g>
    </g>

    <!-- 近侧曲柄与踏板（保持水平） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 395 352" to="360 395 352" dur="1.2s" repeatCount="indefinite"/>
      <line x1="395" y1="352" x2="433" y2="352" stroke="#e63946" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(433 352)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-11" y="-4.5" width="22" height="9" rx="4" fill="#3a3a40"/>
          <rect x="-11" y="-4.5" width="22" height="9" rx="4" fill="none" stroke="#23232a" stroke-width="1.5"/>
        </g>
      </g>
    </g>
    <circle cx="395" cy="352" r="4.5" fill="#4a4f57"/>

    <!-- 近侧腿（踩踏，与曲柄同步） -->
    <path fill="none" stroke="#f77f00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
          d="M375 295 L441 293 L433 352">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
        M375 295 L441 293 L433 352;
        M375 295 L436 321 L422 379;
        M375 295 L425 338 L395 390;
        M375 295 L418 345 L368 379;
        M375 295 L417 346 L357 352;
        M375 295 L427 335 L368 325;
        M375 295 L436 270 L395 314;
        M375 295 L435 267 L422 325;
        M375 295 L441 293 L433 352"/>
    </path>

  </g>
</svg>
</div>

<div class="caption">
  <strong>🚲 鹈鹕骑自行车</strong> · 纯 SVG + SMIL 2D 动画<br>
  <small>单文件 · 无依赖 · 双击用浏览器打开即可播放</small>
</div>

</body>
</html>
