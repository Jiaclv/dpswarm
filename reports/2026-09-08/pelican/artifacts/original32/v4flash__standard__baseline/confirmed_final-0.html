<style>
  :root { --ink:#2c4454; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:26px 14px;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%, #fdf6e4 0%, #f4ead2 42%, #e8dcc0 100%);
    color:var(--ink);
  }
  .stage {
    width:min(98vw,1080px);
    border-radius:22px; overflow:hidden;
    background:#fff;
    box-shadow:0 18px 44px rgba(84,62,30,.22), 0 3px 10px rgba(84,62,30,.16);
    border:1px solid rgba(120,90,40,.14);
  }
  .stage svg { display:block; width:100%; height:auto; }
  .note { font-size:13.5px; opacity:.78; letter-spacing:.02em; }
  .note b { color:#b3592a; }

  /* ---- CSS 辅助动画(线性平移/滚动的无限循环) ---- */
  .cloud { fill:#ffffff; }
  .c1 { animation:drift1 40s linear infinite; }
  .c2 { animation:drift2 58s linear infinite; }
  .c3 { animation:drift3 76s linear infinite; }
  @keyframes drift1 { from { translate:1100px 0px; } to { translate:-430px 0px; } }
  @keyframes drift2 { from { translate:1120px 0px; } to { translate:-450px 0px; } }
  @keyframes drift3 { from { translate:1180px 0px; } to { translate:-470px 0px; } }

  .tuftrow { animation:tilefast 2.2s linear infinite; }
  .bushrow { animation:tileslow 4.4s linear infinite; }
  @keyframes tilefast { to { translate:-490.088px 0px; } }
  @keyframes tileslow { to { translate:-490.088px 0px; } }

  .rdash { animation:roadmove 2.2s linear infinite; }
  @keyframes roadmove { to { stroke-dashoffset:490.088px; } }
  .chainrun { animation:chaingo .43s linear infinite; }
  @keyframes chaingo { to { stroke-dashoffset:-18px; } }
</style>
</head>
