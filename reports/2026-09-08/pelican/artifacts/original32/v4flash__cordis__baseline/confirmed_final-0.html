<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · Pelican on a Bike</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #cfe9fb 0%, #f6efdc 60%, #fbe7c9 100%);
    padding: 18px;
  }
  main { width: min(96vw, 1040px); }
  header {
    text-align: center;
    color: #174a5e;
    margin-bottom: 12px;
  }
  header h1 { font-size: clamp(1.1rem, 3vw, 1.6rem); margin: 0 0 2px; letter-spacing: 2px; }
  header p { margin: 0; font-size: .85rem; opacity: .7; }
  .stage {
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(25, 60, 95, .22), 0 3px 10px rgba(25, 60, 95, .12);
    background: #bfe6ff;
  }
  .stage svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🦤 鹈鹕骑车 · Pelican on a Bike</h1>
    <p>纯 SVG 矢量绘制 · 车轮 / 曲柄 / 双腿 IK / 扑翼 / 视差风景 实时动画</p>
  </header>
  <div class="stage">
  <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进的二维动画">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd3ff"/>
        <stop offset="0.55" stop-color="#c8ecff"/>
        <stop offset="1" stop-color="#eaf9ff"/>
      </linearGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
        <stop offset="0.55" stop-color="#ffe9a8" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
      </radialGradient>

      <!-- ============ 周期风景素材（宽度 1000，周期重复，保证无缝） ============ -->
      <g id="cloudShape">
        <ellipse cx="0" cy="2" rx="30" ry="11"/>
        <circle cx="-20" cy="-6" r="12"/>
        <circle cx="-4" cy="-13" r="15"/>
        <circle cx="16" cy="-8" r="12"/>
        <circle cx="28" cy="-1" r="9"/>
      </g>
      <g id="stripCloud">
        <g transform="translate(90 118) scale(1.15)"><use href="#cloudShape"/></g>
        <g transform="translate(305 62) scale(0.8)"><use href="#cloudShape"/></g>
        <g transform="translate(575 108) scale(1.3)"><use href="#cloudShape"/></g>
        <g transform="translate(815 78) scale(0.9)"><use href="#cloudShape"/></g>
      </g>

      <g id="stripHills">
        <path id="hillPath" d="" fill="#c7ddb9"/>
      </g>

      <g id="treeShape">
        <rect x="-4" y="402" width="8" height="40" fill="#8a6a48"/>
        <circle cx="0" cy="386" r="25" fill="#7cc066"/>
        <circle cx="-20" cy="401" r="16" fill="#8fce79"/>
        <circle cx="21" cy="399" r="16" fill="#8fce79"/>
        <circle cx="1" cy="367" r="13" fill="#9ad583"/>
        <circle cx="-9" cy="380" r="6" fill="#b1e39a" opacity="0.8"/>
      </g>
      <g id="stripTrees">
        <use href="#treeShape" x="120"/>
        <use href="#treeShape" x="450"/>
        <use href="#treeShape" x="780"/>
      </g>

      <g id="stripDash">

      </g>

      <g id="tuftShape">
        <path d="M-4 0 C -7 -9 -14 -13 -19 -8" fill="none" stroke="#6cbe58" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M0 0 C 1 -12 9 -17 15 -10" fill="none" stroke="#7fcb68" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M5 0 C 7 -7 13 -8 16 -3" fill="none" stroke="#5db04a" stroke-width="3.2" stroke-linecap="round"/>
        <ellipse cx="-11" cy="1" rx="3.4" ry="2.4" fill="#b9c6cc"/>
        <ellipse cx="12" cy="2" rx="2.6" ry="1.9" fill="#c7d3d9"/>

    <g>
      <circle cx="120" cy="95" r="66" fill="url(#sunGlow)"/>

      <path d="M470 258 L510 370" stroke="#e05a4a" stroke-width="5"/>

    <!-- ============ 前腿（在前，色浅） ============ -->

    <!-- ============ 鹈鹕身体（含整体起伏 bob） ============ -->

      <!-- 髋部（覆盖腿根，与身体同色） -->

      <!-- 大嘴 + 喉囊 -->

      <path d="M414 102 C 428 112 446 110 456 99" fill="none" stroke="#dd8412" stroke-width="2" opacity="0.6"/>

</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---- 常量 ---- */
  var V = 543;          // 地面视差速度 px/s
  var CRANK_DPS = 270;  // 曲柄角速度 °/s
  var GEAR = 1.6;       // 车轮 / 曲柄 传动比
  var BB = { x: 362, y: 374 };
  var HIP = { x: 306, y: 250 };
  var A = 92, B = 88, CR = 18;

  /* ---- 周期性路径：山丘 / 车道线 / 辐条 ---- */
  var hillPath = 'M0 440';
  for (var i = 1; i <= 64; i++) {
    var x = i * 15.625;
    var y = 440 - 34 * (0.5 - 0.5 * Math.cos(2 * Math.PI * x / 500))
               - 12 * (0.5 - 0.5 * Math.cos(2 * Math.PI * x / 1000));
    hillPath += ' L' + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  hillPath += ' L1000 560 L0 560 Z';
  $('hillPath').setAttribute('d', hillPath);

  var dashD = '';
  for (var dx = 8; dx < 1000; dx += 100) {
    dashD += 'M' + dx + ' 462 h24 v5 h-24 z';
  }
  $('dashPath').setAttribute('d', dashD);

  function spokesD2(cx) {
    var s = '';
    for (var i = 0; i < 12; i++) {
      var a = i * 30 * Math.PI / 180;
      s += 'M' + (cx + 8 * Math.cos(a)).toFixed(1) + ' ' + (370 + 8 * Math.sin(a)).toFixed(1)
         + 'L' + (cx + 57 * Math.cos(a)).toFixed(1) + ' ' + (370 + 57 * Math.sin(a)).toFixed(1);
    }
    return s;
  }
  $('spokesRear').setAttribute('d', spokesD2(235));
  $('spokesFront').setAttribute('d', spokesD2(510));

  /* ---- 引用元素 ---- */
  var layers = Array.prototype.slice.call(document.querySelectorAll('g.par'));
  var crankG = $('crankG'), spR = $('spokesRG'), spF = $('spokesFG');
  var bob = $('bob'), farWing = $('farWing');

  /* ---- 双腿 2 骨 IK：髋固定，脚踩在旋转的脚踏上 ---- */
  function ik(foot) {
    var d = Math.hypot(foot.x - HIP.x, foot.y - HIP.y);
    var base = Math.atan2(foot.y - HIP.y, foot.x - HIP.x);
    var cosB = (d * d + A * A - B * B) / (2 * d * A);
    cosB = Math.max(-1, Math.min(1, cosB));
    var be = Math.acos(cosB);
    var k1 = { x: HIP.x + A * Math.cos(base + be), y: HIP.y + A * Math.sin(base + be) };
    var k2 = { x: HIP.x + A * Math.cos(base - be), y: HIP.y + A * Math.sin(base - be) };
    return k1.x >= k2.x ? k1 : k2; // 膝盖统一向前
  }
  function leg(paths, foot) {
    var k = ik(foot);
    paths.thigh.setAttribute('d', 'M' + HIP.x + ' ' + HIP.y + ' L' + k.x.toFixed(1) + ' ' + k.y.toFixed(1));
    paths.shin.setAttribute('d', 'M' + k.x.toFixed(1) + ' ' + k.y.toFixed(1) + ' L' + foot.x.toFixed(1) + ' ' + foot.y.toFixed(1));
    paths.foot.setAttribute('d', 'M' + foot.x.toFixed(1) + ' ' + foot.y.toFixed(1)
      + ' L' + (foot.x + 26).toFixed(1) + ' ' + (foot.y + 3).toFixed(1));
  }

  var rear = { thigh: $('rThigh'), shin: $('rShin'), foot: $('rFoot') };
  var front = { thigh: $('fThigh'), shin: $('fShin'), foot: $('fFoot') };

  /* ---- 动画主循环 ---- */
  var last = performance.now(), t = 0;
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (!(dt > 0)) dt = 0.016;
    t += dt;

    var crankDeg = t * CRANK_DPS;
    var a = crankDeg * Math.PI / 180;
    crankG.setAttribute('transform', 'rotate(' + crankDeg + ' 362 374)');

    var wheelDeg = crankDeg * GEAR;
    spR.setAttribute('transform', 'rotate(' + wheelDeg + ' 235 370)');
    spF.setAttribute('transform', 'rotate(' + wheelDeg + ' 510 370)');

    for (var i = 0; i < layers.length; i++) {
      var k = parseFloat(layers[i].getAttribute('data-k'));
      var off = (t * V * k) % 1000;
      layers[i].setAttribute('transform', 'translate(' + (-off).toFixed(2) + ' 0)');
    }

    var sa = Math.sin(a), ca = Math.cos(a);
    var f1 = { x: BB.x + CR * sa, y: BB.y - CR * ca };
    var f2 = { x: BB.x - CR * sa, y: BB.y + CR * ca };
    leg(rear, f2);   // 后腿踩后侧脚踏
    leg(front, f1);  // 前腿踩前侧脚踏

    var flap = 10 + 26 * Math.sin(2 * Math.PI * t / 1.35); // 远翅扑动
    farWing.setAttribute('transform', 'rotate(' + flap.toFixed(1) + ' 322 136)');

    var bobY = 1.8 * Math.sin(2 * Math.PI * t / 1.35 + 1.1); // 身体随扑翼轻微起伏
    bob.setAttribute('transform', 'translate(0 ' + bobY.toFixed(2) + ')');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
