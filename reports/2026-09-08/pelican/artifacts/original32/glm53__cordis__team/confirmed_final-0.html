<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
       background:linear-gradient(#fdfbf7,#e9f1f6);
       font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .frame{background:#fff;border-radius:18px;padding:14px;box-shadow:0 14px 36px rgba(31,45,61,.16)}
  svg{display:block;width:min(92vw,880px);height:auto;border-radius:12px}
  .caption{color:#5b6b7a;font-size:14px;letter-spacing:.12em}

  /* ---------- 动画 ---------- */
  .cloud-a{animation:drift 55s linear infinite;animation-delay:-10s}
  .cloud-b{animation:drift 90s linear infinite;animation-delay:-45s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1350px)}}

  .hills{animation:scrollX 22s linear infinite}
  .ground{animation:scrollX 2.6s linear infinite}
  @keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-800px)}}

  .dash{animation:dashMove .42s linear infinite}
  @keyframes dashMove{from{stroke-dashoffset:0}to{stroke-dashoffset:120}}

  .chain{animation:chainF .18s linear infinite}
  @keyframes chainF{from{stroke-dashoffset:0}to{stroke-dashoffset:-9}}

  .sun-rays{animation:spin 36s linear infinite;transform-origin:90px 80px}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spinRev{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

  .wheel{animation:spin 1.1s linear infinite}
  .wheel-rear{transform-origin:235px 405px}
  .wheel-front{transform-origin:455px 405px}

  .crank{animation:spin 1.1s linear infinite;transform-origin:330px 400px}
  .pedal{animation:spinRev 1.1s linear infinite}
  .pedal-a{transform-origin:330px 362px}
  .pedal-b{transform-origin:330px 438px}

  .bob{animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}

  .wing{animation:flap 1.1s ease-in-out infinite;transform-origin:320px 264px}
  @keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}

  .shadow{animation:shadowPulse 1.1s ease-in-out infinite;transform-origin:345px 466px}
  @keyframes shadowPulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}

  .whoosh{animation:whoosh 1.1s ease-in-out infinite}
  @keyframes whoosh{0%,100%{opacity:.15}50%{opacity:.75}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在乡间公路上骑自行车">
  <desc>2D 动画：白色鹈鹕长喙带喉囊，骑着红色自行车，车轮旋转、双腿蹬踏，云朵与远山视差滚动。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8c93"/>
      <stop offset="1" stop-color="#9aa8b0"/>
    </linearGradient>
    <g id="tuft" fill="#6fbf4f">
      <path d="M-6 420 l3 -9 l4 9 z"/>
      <path d="M0 420 l4 -13 l4 13 z"/>
      <path d="M8 420 l4 -10 l4 10 z"/>
    </g>
    <g id="daisy">
      <circle cx="0" cy="412" r="3.5" fill="#ff8fb1"/>
      <circle cx="0" cy="412" r="1.4" fill="#ffd54f"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="420" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g class="sun-rays" stroke="#ffd54f" stroke-width="5" stroke-linecap="round">
    <line x1="90" y1="18" x2="90" y2="34"/>
    <line x1="90" y1="126" x2="90" y2="142"/>
    <line x1="28" y1="80" x2="44" y2="80"/>
    <line x1="136" y1="80" x2="152" y2="80"/>
    <line x1="46" y1="36" x2="57" y2="47"/>
    <line x1="123" y1="113" x2="134" y2="124"/>
    <line x1="46" y1="124" x2="57" y2="113"/>
    <line x1="123" y1="47" x2="134" y2="36"/>
  </g>
  <circle cx="90" cy="80" r="34" fill="#ffd54f"/>
  <circle cx="90" cy="80" r="34" fill="#ffe082" opacity=".55"/>

  <!-- 云（视差·最远） -->
  <g class="cloud-a" fill="#ffffff" opacity=".92">
    <ellipse cx="945" cy="76" rx="26" ry="14"/>
    <ellipse cx="980" cy="85" rx="46" ry="20"/>
    <ellipse cx="1020" cy="74" rx="30" ry="16"/>
  </g>
  <g class="cloud-b" fill="#ffffff" opacity=".8">
    <ellipse cx="1150" cy="150" rx="36" ry="15"/>
    <ellipse cx="1190" cy="141" rx="24" ry="12"/>
  </g>

  <!-- 远山（视差·慢） -->
  <g class="hills" fill="#cdeab5">
    <path d="M0 420 Q120 336 250 420 Q380 344 510 420 Q640 338 770 420 L800 420 L0 420 Z"/>
    <path d="M800 420 Q920 336 1050 420 Q1180 344 1310 420 Q1440 338 1570 420 L1600 420 L800 420 Z"/>
  </g>

  <!-- 公路 -->
  <rect y="420" width="800" height="80" fill="url(#roadGrad)"/>
  <rect y="420" width="800" height="6" fill="#6c7a82"/>
  <line class="dash" x1="-60" y1="463" x2="860" y2="463" stroke="#f5f5f5" stroke-width="6" stroke-dasharray="50 70" stroke-linecap="round"/>

  <!-- 路边草丛小花（近景·快，800px 周期无缝滚动） -->
  <g class="ground">
    <use href="#tuft" x="40"/><use href="#tuft" x="170"/><use href="#tuft" x="300"/>
    <use href="#tuft" x="430"/><use href="#tuft" x="560"/><use href="#tuft" x="690"/>
    <use href="#daisy" x="105"/><use href="#daisy" x="365"/><use href="#daisy" x="625"/>
    <use href="#tuft" x="840"/><use href="#tuft" x="970"/><use href="#tuft" x="1100"/>
    <use href="#tuft" x="1230"/><use href="#tuft" x="1360"/><use href="#tuft" x="1490"/>
    <use href="#daisy" x="905"/><use href="#daisy" x="1165"/><use href="#daisy" x="1425"/>
  </g>

  <!-- 速度线 -->
  <g class="whoosh" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="126" y1="242" x2="172" y2="242"/>
    <line x1="106" y1="266" x2="158" y2="266"/>
  </g>

  <!-- 车下阴影 -->
  <ellipse class="shadow" cx="345" cy="466" rx="128" ry="9" fill="rgba(20,40,60,.16)"/>

  <!-- ========== 自行车 ========== -->
  <!-- 后轮（辐条旋转） -->
  <g class="wheel wheel-rear">
    <circle cx="235" cy="405" r="52" fill="none" stroke="#33383d" stroke-width="9"/>
    <circle cx="235" cy="405" r="43" fill="none" stroke="#cfd8dc" stroke-width="3"/>
    <g stroke="#b0bec5" stroke-width="2.5">
      <line x1="279" y1="405" x2="191" y2="405"/>
      <line x1="273.1" y1="427" x2="196.9" y2="383"/>
      <line x1="257" y1="443.1" x2="213" y2="366.9"/>
      <line x1="235" y1="449" x2="235" y2="361"/>
      <line x1="213" y1="443.1" x2="257" y2="366.9"/>
      <line x1="196.9" y1="427" x2="273.1" y2="383"/>
    </g>
    <circle cx="235" cy="405" r="6.5" fill="#546e7a"/>
  </g>
  <!-- 前轮（辐条旋转） -->
  <g class="wheel wheel-front">
    <circle cx="455" cy="405" r="52" fill="none" stroke="#33383d" stroke-width="9"/>
    <circle cx="455" cy="405" r="43" fill="none" stroke="#cfd8dc" stroke-width="3"/>
    <g stroke="#b0bec5" stroke-width="2.5">
      <line x1="499" y1="405" x2="411" y2="405"/>
      <line x1="493.1" y1="427" x2="416.9" y2="383"/>
      <line x1="477" y1="443.1" x2="433" y2="366.9"/>
      <line x1="455" y1="449" x2="455" y2="361"/>
      <line x1="433" y1="443.1" x2="477" y2="366.9"/>
      <line x1="416.9" y1="427" x2="493.1" y2="383"/>
    </g>
    <circle cx="455" cy="405" r="6.5" fill="#546e7a"/>
  </g>

  <!-- 后飞轮 -->
  <circle cx="235" cy="405" r="7" fill="none" stroke="#546e7a" stroke-width="3.5"/>

  <!-- 红色菱形车架 -->
  <g stroke="#e53935" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="285" y1="300" x2="330" y2="400"/>
    <line x1="287" y1="304" x2="429" y2="297"/>
    <line x1="429" y1="297" x2="330" y2="400"/>
    <line x1="330" y1="400" x2="235" y2="405"/>
    <line x1="285" y1="300" x2="237" y2="404"/>
    <line x1="429" y1="297" x2="455" y2="405"/>
  </g>

  <!-- 车把 -->
  <path d="M429 296 L425 276 Q425 268 433 268 L450 268" fill="none" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
  <line x1="446" y1="268" x2="457" y2="268" stroke="#263238" stroke-width="10" stroke-linecap="round"/>

  <!-- 链条（流动） -->
  <line class="chain" x1="235" y1="398" x2="330" y2="384" stroke="#455a64" stroke-width="3.5" stroke-dasharray="5 4"/>
  <line class="chain" x1="330" y1="416" x2="235" y2="412" stroke="#455a64" stroke-width="3.5" stroke-dasharray="5 4"/>

  <!-- 曲柄 + 脚踏（保持水平）+ 小腿（随踏板平移伸缩） -->
  <g class="crank">
    <circle cx="330" cy="400" r="16" fill="none" stroke="#546e7a" stroke-width="4"/>
    <line x1="330" y1="400" x2="330" y2="362" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
    <line x1="330" y1="400" x2="330" y2="438" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="330" cy="400" r="5" fill="#37474f"/>
    <!-- 远侧踏板（初始在下方） -->
    <g class="pedal pedal-b">
      <line x1="330" y1="438" x2="308" y2="360" stroke="#d88f1d" stroke-width="10" stroke-linecap="round"/>
      <rect x="316" y="433" width="28" height="10" rx="3" fill="#1d262a"/>
      <path d="M320 431 L349 429 Q356 433 349 438 L321 439 Q314 435 320 431 Z" fill="#d88f1d"/>
    </g>
    <!-- 近侧踏板（初始在上方） -->
    <g class="pedal pedal-a">
      <line x1="330" y1="362" x2="312" y2="300" stroke="#f7a832" stroke-width="10" stroke-linecap="round"/>
      <rect x="316" y="357" width="28" height="10" rx="3" fill="#263238"/>
      <path d="M320 355 L349 353 Q356 357 349 362 L321 363 Q314 359 320 355 Z" fill="#f7a832"/>
    </g>
  </g>

  <!-- 大腿套管（盖住小腿上端，形成伸缩蹬踏） -->
  <line x1="296" y1="312" x2="314" y2="366" stroke="#d88f1d" stroke-width="15" stroke-linecap="round"/>
  <line x1="306" y1="306" x2="318" y2="376" stroke="#f7a832" stroke-width="16" stroke-linecap="round"/>

  <!-- 翅膀手臂扶车把 -->
  <g class="wing" fill="none" stroke-linecap="round">
    <path d="M318 266 C356 254 406 258 446 268" stroke="#d7dde2" stroke-width="15"/>
    <path d="M318 266 C356 254 406 258 446 268" stroke="#fdfdfd" stroke-width="11"/>
    <path d="M446 267 L461 261 M445 269 L463 267 M445 271 L460 276" stroke="#d7dde2" stroke-width="2"/>
  </g>

  <!-- ========== 鹈鹕 ========== -->
  <g class="bob">
    <!-- 尾羽 -->
    <path d="M252 250 L216 236 L224 258 L214 274 L250 282 Z" fill="#fdfdfd" stroke="#d7dde2" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 脖子 -->
    <path d="M318 278 C356 270 348 212 372 176" fill="none" stroke="#d7dde2" stroke-width="27" stroke-linecap="round"/>
    <path d="M318 278 C356 270 348 212 372 176" fill="none" stroke="#fdfdfd" stroke-width="22" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="292" cy="268" rx="60" ry="42" fill="#fdfdfd" stroke="#d7dde2" stroke-width="2.5" transform="rotate(-12 292 268)"/>
    <!-- 头冠羽 -->
    <path d="M359 152 Q346 146 342 152 Q350 154 356 158 Z" fill="#e8eef1"/>
    <!-- 头 -->
    <circle cx="378" cy="162" r="21" fill="#fdfdfd" stroke="#d7dde2" stroke-width="2.5"/>
    <!-- 喉囊 -->
    <path d="M392 172 Q404 206 448 204 Q466 200 474 172 Z" fill="#f8c471" stroke="#e8a94e" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 大长喙 -->
    <path d="M392 150 L476 163 Q480 166 476 169 L392 172 Q386 161 392 150 Z" fill="#f6a11f" stroke="#e08e12" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="400" y1="156" x2="440" y2="160" stroke="#e08e12" stroke-width="1.5"/>
    <!-- 喙尖的小鱼 -->
    <path d="M474 166 L492 158 L489 171 Z" fill="#64aeea"/>
    <circle cx="482" cy="162" r="1.3" fill="#12333f"/>
    <!-- 眼睛 -->
    <circle cx="386" cy="155" r="3.6" fill="#2b2b2b"/>
    <circle cx="387.3" cy="153.8" r="1.2" fill="#ffffff"/>
  </g>
</svg>
</div>
<p class="caption">鹈鹕骑行中 · 纯 SVG + CSS 动画</p>
</body>
</html>
