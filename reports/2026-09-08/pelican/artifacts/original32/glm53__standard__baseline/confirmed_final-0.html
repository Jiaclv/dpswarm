<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行 · Pelican on a Bicycle</title>
<style>
  :root {
    --card-bg: #ffffff;
    --page-bg1: #1b2432;
    --page-bg2: #2c3a50;
    --ink: #22303f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--page-bg1), var(--page-bg2));
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 880px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  .card header {
    padding: 18px 26px 10px;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card h1 { font-size: 22px; letter-spacing: 1px; }
  .card header .sub { font-size: 12.5px; color: #7c8794; letter-spacing: 2px; }
  .stage { line-height: 0; }
  svg { width: 100%; height: auto; display: block; cursor: pointer; }
  .card footer {
    padding: 12px 26px 16px;
    font-size: 13px;
    color: #8a94a0;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  kbd {
    font-family: Consolas, monospace;
    background: #eef1f4;
    border: 1px solid #d6dbe0;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    font-size: 12px;
  }

  /* ============ 场景内动画（纯 CSS，无 JS 也可运行） ============ */

  /* 无限横向滚动：内容在 0..800，再复制一份平移到 +800，整体从 0 滑到 -800 */
  .loop { animation: slide var(--dur, 20s) linear infinite; }
  @keyframes slide { to { transform: translateX(-800px); } }

  /* 云：从右侧入场、向左飘出 */
  .cloud { animation: cloudmove var(--dur, 60s) linear infinite; animation-delay: var(--delay, 0s); }
  @keyframes cloudmove {
    from { transform: translateX(880px); }
    to   { transform: translateX(-240px); }
  }

  /* 太阳光芒缓慢旋转 */
  .sunrays {
    transform-box: view-box;
    transform-origin: 95px 78px;
    animation: spin 60s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 路面虚线向左滚动 */
  .dash-road  { animation: dashL 0.9s linear infinite; }
  @keyframes dashL { to { stroke-dashoffset: 600; } }

  /* 链条：上run 向前（曲柄方向），下run 向后 */
  .chain-top  { animation: chainF .5s linear infinite; }
  .chain-bot  { animation: chainB .5s linear infinite; }
  @keyframes chainF { to { stroke-dashoffset: -240; } }
  @keyframes chainB { to { stroke-dashoffset:  240; } }

  /* 尾气流尘 */
  .puff  { animation: puff 1.6s ease-out infinite; animation-delay: var(--delay, 0s); opacity: 0; }
  @keyframes puff {
    0%   { opacity: .55; transform: translateX(0); }
    100% { opacity: 0;   transform: translateX(-85px); }
  }

  /* 速度线 */
  .speedline { animation: whoosh 1.1s linear infinite; animation-delay: var(--delay, 0s); opacity: 0; }
  @keyframes whoosh {
    0%   { opacity: 0;    transform: translateX(14px); }
    30%  { opacity: .55; }
    100% { opacity: 0;    transform: translateX(-56px); }
  }

  /* 喉囊随踩踏微微晃动 */
  .pouch {
    transform-box: fill-box;
    transform-origin: 50% 10%;
    animation: pouch 0.8s ease-in-out infinite alternate;
  }
  @keyframes pouch { to { transform: scale(1, 1.07); } }

  /* 囊中小鱼摆尾 */
  .fish {
    transform-box: fill-box;
    transform-origin: 30% 100%;
    animation: fishwig .55s ease-in-out infinite alternate;
  }
  @keyframes fishwig { to { transform: rotate(14deg); } }

  /* 头部轻轻点头 */
  .headg {
    transform-box: view-box;
    transform-origin: 440px 118px;
    animation: nod 2.1s ease-in-out infinite alternate;
  }
  @keyframes nod { to { transform: rotate(2.2deg); } }

  /* 翅膀搭在车把上，随车身轻颤 */
  .wingg {
    transform-box: view-box;
    transform-origin: 362px 190px;
    animation: flutter 1.6s ease-in-out infinite alternate;
  }
  @keyframes flutter { to { transform: rotate(1.6deg); } }

  /* 点击暂停时停住所有 CSS 动画 */
  #scene.paused * { animation-play-state: paused !important; }

  @media (prefers-reduced-motion: reduce) {
    #scene * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="card">

    <div class="sub">PELICAN ON A BICYCLE · PURE SVG</div>

  <noscript><div style="padding:0 26px 16px;color:#b06a1f;font-size:13px;">未启用 JavaScript：装饰动画仍可播放，但蹬踏与车轮由脚本驱动，将保持静止。</div></noscript>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 几何常量（与上方 SVG 坐标一一对应） ---------- */
  var C = [408, 317];                 // 曲柄中心（五通）
  var CRANK = 27;                      // 曲柄长
  var HUB_R = [298, 325];              // 后轮心
  var HUB_F = [542, 325];              // 前轮心
  var HIP_N = [372, 228], L1N = 64, L2N = 62;   // 近侧腿：大腿/小腿
  var HIP_F = [360, 226], L1F = 66, L2F = 66;   // 远侧腿
  var GEAR = 2.3;                      // 轮/曲柄传动比
  var OMEGA = 2.4;                     // 曲柄角速度 rad/s

  var scene = $("scene");
  var el = {
    spokesR: $("spokesR"), spokesF: $("spokesF"),
    armN: $("armN"), armF: $("armF"),
    pedalN: $("pedalN"), pedalF: $("pedalF"),
    legN: $("legN"), legF: $("legF"),
    footN: $("footN"), footF: $("footF"),
    birdG: $("birdG"), spd: $("spd")
  };
  if (!scene || !el.spokesR) return;

  var phase = 0.6, wheelRot = 0, speed = 1, running = true, last = null;

  /* 两连杆逆运动学：给定髋、脚，求朝前的膝盖 */
  function knee(hip, foot, L1, L2) {
    var ux = foot[0] - hip[0], uy = foot[1] - hip[1];
    var d = Math.hypot(ux, uy) || 1e-6;
    var dmax = L1 + L2 - 0.5, dmin = Math.abs(L1 - L2) + 0.5;
    if (d > dmax) { ux *= dmax / d; uy *= dmax / d; d = dmax; }
    if (d < dmin) { var s = dmin / d; ux *= s; uy *= s; d = dmin; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    var nx = ux / d, ny = uy / d;
    return [hip[0] + a * nx + h * ny, hip[1] + a * ny - h * nx]; // 前向膝
  }
  function legD(hip, foot, L1, L2) {
    var k = knee(hip, foot, L1, L2);
    return "M" + hip[0].toFixed(1) + "," + hip[1].toFixed(1) +
           "L" + k[0].toFixed(1)  + "," + k[1].toFixed(1) +
           "L" + foot[0].toFixed(1) + "," + foot[1].toFixed(1);
  }
  function pedal(a) {
    return [C[0] + CRANK * Math.cos(a), C[1] + CRANK * Math.sin(a)];
  }

  function frame(now) {
    var dt = last === null ? 0 : Math.min((now - last) / 1000, 0.05);
    last = now;
    if (running) {
      var dPhase = OMEGA * speed * dt;
      phase += dPhase;
      wheelRot = (wheelRot + dPhase * GEAR * 180 / Math.PI) % 360;

      var pn = pedal(phase), pf = pedal(phase + Math.PI);
      var deg = phase * 180 / Math.PI;

      el.spokesR.setAttribute("transform", "rotate(" + wheelRot.toFixed(2) + " " + HUB_R[0] + " " + HUB_R[1] + ")");
      el.spokesF.setAttribute("transform", "rotate(" + wheelRot.toFixed(2) + " " + HUB_F[0] + " " + HUB_F[1] + ")");

      el.armN.setAttribute("x2", pn[0].toFixed(1)); el.armN.setAttribute("y2", pn[1].toFixed(1));
      el.armF.setAttribute("x2", pf[0].toFixed(1)); el.armF.setAttribute("y2", pf[1].toFixed(1));
      el.pedalN.setAttribute("transform", "translate(" + pn[0].toFixed(1) + "," + pn[1].toFixed(1) + ")");
      el.pedalF.setAttribute("transform", "translate(" + pf[0].toFixed(1) + "," + pf[1].toFixed(1) + ")");

      el.legN.setAttribute("d", legD(HIP_N, pn, L1N, L2N));
      el.legF.setAttribute("d", legD(HIP_F, pf, L1F, L2F));
      el.footN.setAttribute("transform", "translate(" + pn[0].toFixed(1) + "," + (pn[1] - 4).toFixed(1) + ")");
      el.footF.setAttribute("transform", "translate(" + pf[0].toFixed(1) + "," + (pf[1] - 4).toFixed(1) + ")");

      /* 车身随踩踏节律起伏 */
      var bob = 1.8 * Math.cos(2 * phase);
      el.birdG.setAttribute("transform", "translate(0," + bob.toFixed(2) + ")");
    }
    requestAnimationFrame(frame);
  }

  function setSpeed(s) {
    speed = Math.max(0.25, Math.min(3, s));
    el.spd.textContent = speed.toFixed(1) + "\u00d7";
  }
  function toggle() {
    running = !running;
    scene.classList.toggle("paused", !running);
  }

  scene.addEventListener("click", toggle);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp")   { setSpeed(speed + 0.25); e.preventDefault(); }
    if (e.key === "ArrowDown") { setSpeed(speed - 0.25); e.preventDefault(); }
  });

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    running = false; scene.classList.add("paused");
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
