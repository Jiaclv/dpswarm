        font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    Pelican Bike · 鹈鹕骑自行车 · SVG + JS

</svg>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  /* ---------- 物理参数 ---------- */
  var OMEGA = 2.8;        // 曲柄角速度 rad/s
  var GEAR  = 2;          // 传动比(后轮转速 = 2 × 曲柄转速)
  var WHEEL_R = 55;       // 轮半径
  var V = OMEGA * GEAR * WHEEL_R;   // 前进速度 ≈ 308 px/s
  var CRANK_R = 34;       // 曲柄长
  var BB = { x: 430, y: 415 };      // 中轴
  var HIP = { x: 398, y: 312 };     // 髋关节
  var THIGH = 74, SHIN = 70;

  /* ---------- 元素引用 ---------- */
  var spokesRear  = document.getElementById('spokesRear');
  var spokesFront = document.getElementById('spokesFront');
  var crankGroup  = document.getElementById('crankGroup');
  var pelican     = document.getElementById('pelican');
  var farWing     = document.getElementById('farWing');
  var farLeg      = document.getElementById('farLeg');
  var nearLeg     = document.getElementById('nearLeg');
  var farFoot     = document.getElementById('farFoot');
  var nearFoot    = document.getElementById('nearFoot');
  var lowerBeak   = document.getElementById('lowerBeak');
  var eyelid      = document.getElementById('eyelid');
  var scarf       = document.getElementById('scarf');
  var chainTop    = document.getElementById('chainTop');
  var chainBottom = document.getElementById('chainBottom');
  var dashes      = document.getElementById('dashes');
  var flowers     = document.getElementById('flowers');
  var trees       = document.getElementById('trees');
  var hillsBack   = document.getElementById('hillsBack');
  var hillsFront  = document.getElementById('hillsFront');
  var cloud1 = document.getElementById('cloud1');
  var cloud2 = document.getElementById('cloud2');
  var cloud3 = document.getElementById('cloud3');
  var sunRays = document.getElementById('sunRays');
  var streak1 = document.getElementById('streak1');
  var streak2 = document.getElementById('streak2');

  /* ---------- 生成辐条 ---------- */
  function buildSpokes(group, cx, cy) {
    var r = 47;
    for (var i = 0; i < 6; i++) {
      var a = i * Math.PI / 3;
      var line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', cx);
      line.setAttribute('y1', cy);
      line.setAttribute('x2', (cx + r * Math.cos(a)).toFixed(1));
      line.setAttribute('y2', (cy + r * Math.sin(a)).toFixed(1));
      line.setAttribute('stroke', '#90A4AE');
      line.setAttribute('stroke-width', '2.2');
      group.appendChild(line);
    }
  }
  buildSpokes(spokesRear, 340, 415);
  buildSpokes(spokesFront, 590, 415);

  /* ---------- 两骨 IK ---------- */
  function ik(hip, target) {
    var dx = target.x - hip.x, dy = target.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = THIGH + SHIN - 0.01;
    if (d > maxD) d = maxD;
    var a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(THIGH * THIGH - a * a, 0));
    var mx = hip.x + a * dx / d, my = hip.y + a * dy / d;
    var px = -dy / d, py = dx / d;
    var k1 = { x: mx + h * px, y: my + h * py };
    var k2 = { x: mx - h * px, y: my - h * py };
    return (k1.x >= k2.x) ? k1 : k2;   // 膝盖朝前
  }

  /* ---------- 视差滚动 ---------- */
  var c1x = 150, c2x = 520, c3x = 820;
  var hbx = 0, hfx = 0, tx = 0, fx = 0, dashX = 0;

  /* ---------- 状态 ---------- */
  var crank = 0, t = 0, last = performance.now();

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    t += dt;
    crank = (crank + OMEGA * dt) % (2 * Math.PI * 100);

    var crankDeg = crank * 180 / Math.PI;
    var wheelDeg = crankDeg * GEAR;
    var bobY = 2.6 * Math.sin(2 * crank);
    var bobRot = 1.1 * Math.sin(2 * crank + 0.5);

    /* 轮子与曲柄旋转 */
    spokesRear.setAttribute('transform', 'rotate(' + wheelDeg + ' 340 415)');
    spokesFront.setAttribute('transform', 'rotate(' + wheelDeg + ' 590 415)');
    crankGroup.setAttribute('transform', 'rotate(' + crankDeg + ' 430 415)');

    /* 踏板世界坐标 */
    var nearP = { x: BB.x + CRANK_R * Math.cos(crank),  y: BB.y + CRANK_R * Math.sin(crank) };
    var farP  = { x: BB.x - CRANK_R * Math.cos(crank),  y: BB.y - CRANK_R * Math.sin(crank) };

    /* 腿 IK */
    var nk = ik(HIP, nearP), fk = ik(HIP, farP);
    nearLeg.setAttribute('points', HIP.x + ',' + HIP.y + ' ' + nk.x + ',' + nk.y + ' ' + nearP.x + ',' + nearP.y);
    farLeg.setAttribute('points', HIP.x + ',' + HIP.y + ' ' + fk.x + ',' + fk.y + ' ' + farP.x + ',' + farP.y);

    /* 脚保持水平 */
    nearFoot.setAttribute('transform', 'translate(' + nearP.x + ' ' + nearP.y + ') rotate(' + (-crankDeg) + ')');
    farFoot.setAttribute('transform', 'translate(' + farP.x + ' ' + farP.y + ') rotate(' + (-crankDeg) + ')');

    /* 身体起伏 */
    pelican.setAttribute('transform', 'translate(0 ' + bobY + ') rotate(' + bobRot + ' 455 245)');

    /* 远端翅膀扇动 */
    farWing.setAttribute('transform', 'rotate(' + (16 * Math.sin(1.4 * t) - 6) + ' 470 245)');

    /* 喉囊开合 */
    lowerBeak.setAttribute('transform', 'rotate(' + (3 + 4.5 * Math.sin(1.2 * t + 0.8)) + ' 615 164)');

    /* 眨眼 */
    var cyc = t % 3.4;
    var closed = cyc > 3.22 && cyc < 3.37;
    eyelid.setAttribute('ry', closed ? 8 : 0.4);

    /* 围巾飘动 */
    var sp = '498,241';
    for (var i = 1; i <= 3; i++) {
      var sx = 498 - i * 34;
      var sy = 241 + Math.sin(t * 5.2 + i * 1.1) * 9 + i * 4;
      sp += ' ' + sx + ',' + sy.toFixed(1);
    }
    scarf.setAttribute('points', sp);

    /* 链条(上段向前、下段向后) */
    var off = (crank * 22) % 13;
    chainTop.setAttribute('stroke-dashoffset', -off);
    chainBottom.setAttribute('stroke-dashoffset', off);

    /* 背景视差 */
    c1x -= V * 0.12 * dt; if (c1x < -200) c1x += 1300;
    c2x -= V * 0.20 * dt; if (c2x < -200) c2x += 1300;
    c3x -= V * 0.28 * dt; if (c3x < -200) c3x += 1300;
    cloud1.setAttribute('transform', 'translate(' + c1x + ' 90)');
    cloud2.setAttribute('transform', 'translate(' + c2x + ' 60) scale(0.75)');
    cloud3.setAttribute('transform', 'translate(' + c3x + ' 130) scale(1.2)');

    hbx = (hbx - V * 0.08 * dt) % 900;
    hfx = (hfx - V * 0.15 * dt) % 900;
    hillsBack.setAttribute('transform', 'translate(' + hbx + ' 0)');
    hillsFront.setAttribute('transform', 'translate(' + hfx + ' 0)');

    tx = (tx - V * 0.35 * dt) % 960;
    trees.setAttribute('transform', 'translate(' + tx + ' 0)');

    fx = (fx - V * 1.15 * dt) % 960;
    flowers.setAttribute('transform', 'translate(' + fx + ' 0)');

    dashX = (dashX - V * dt) % 90;
    dashes.setAttribute('transform', 'translate(' + dashX + ' 0)');

    /* 太阳光芒与风线 */
    sunRays.setAttribute('transform', 'rotate(' + (t * 7) + ' 95 95)');

    var s1x = 870 - ((t * 330) % 460);
    var s2x = 870 - ((t * 330 + 170) % 460);
    streak1.setAttribute('x1', s1x); streak1.setAttribute('x2', s1x + 70);
    streak2.setAttribute('x1', s2x); streak2.setAttribute('x2', s2x + 70);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
