<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #e8f4fd 0%, #f7fbff 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 26px;
    box-shadow: 0 18px 50px rgba(30, 60, 110, 0.15);
    padding: 22px 26px 16px;
    max-width: 980px;
    width: 100%;
  }
  h1 {
    text-align: center;
    color: #1d5c8f;
    font-size: 26px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  p.sub {
    text-align: center;
    color: #6b7d93;
    font-size: 13px;
    margin-bottom: 12px;
  }
  svg { width: 100%; height: auto; display: block; border-radius: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>🚴 鹈鹕骑自行车</h1>
  <p class="sub">纯 SVG + SMIL 矢量 2D 动画 · 单文件 · 无任何外部依赖 · 打开即播放</p>

  <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车向前行进">
    <title>鹈鹕骑自行车</title>
    <desc>一只白色鹈鹕长着大喙与喉囊，正在骑红色自行车，车轮旋转、双腿蹬踏、背景云朵与路面后移。</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe3ff"/>
        <stop offset="1" stop-color="#eef8ff"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fcd34d"/>
        <stop offset="1" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="900" height="560" fill="url(#sky)"/>

    <!-- 太阳 -->
    <circle cx="835" cy="80" r="58" fill="#ffe08a" opacity="0.35"/>
    <circle cx="835" cy="80" r="42" fill="#ffd166"/>

    <!-- 云朵（视差滚动） -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="1080 105" to="-340 105" dur="13s" begin="-6s" repeatCount="indefinite"/>
      <g fill="#ffffff" opacity="0.92">
        <ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="-30" cy="6" rx="30" ry="14"/>
        <ellipse cx="30" cy="4" rx="34" ry="16"/><ellipse cx="6" cy="-12" rx="28" ry="15"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1150 58" to="-300 58" dur="17s" begin="-12s" repeatCount="indefinite"/>
      <g transform="scale(0.72)" fill="#ffffff" opacity="0.8">
        <ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="-30" cy="6" rx="30" ry="14"/>
        <ellipse cx="30" cy="4" rx="34" ry="16"/><ellipse cx="6" cy="-12" rx="28" ry="15"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 172" to="-260 172" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <g transform="scale(0.5)" fill="#ffffff" opacity="0.7">
        <ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="-30" cy="6" rx="30" ry="14"/>
        <ellipse cx="30" cy="4" rx="34" ry="16"/><ellipse cx="6" cy="-12" rx="28" ry="15"/>
      </g>
    </g>

    <!-- 远山 -->
    <path d="M0,537 L0,510 Q140,470 280,506 Q420,534 560,498 Q700,466 900,508 L900,537 Z" fill="#d8f3dc" opacity="0.95"/>
    <path d="M0,537 L0,522 Q200,492 420,522 Q640,548 900,516 L900,537 Z" fill="#b7e4c7" opacity="0.9"/>

    <!-- 路边灌木（向后滚动） -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="980 537" to="-140 537" dur="6.5s" repeatCount="indefinite"/>
      <g fill="#74c69d">
        <circle cx="0" cy="-14" r="16"/><circle cx="15" cy="-9" r="12"/><circle cx="-15" cy="-9" r="12"/>
        <circle cx="6" cy="-18" r="2.6" fill="#ffb703"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1180 537" to="-200 537" dur="9s" begin="-5s" repeatCount="indefinite"/>
      <g transform="scale(0.75)" fill="#74c69d">
        <circle cx="0" cy="-14" r="16"/><circle cx="15" cy="-9" r="12"/><circle cx="-15" cy="-9" r="12"/>
      </g>
    </g>

    <!-- 马路 -->
    <rect x="0" y="537" width="900" height="23" fill="#495057"/>
    <rect x="0" y="537" width="900" height="4" fill="#343a40"/>
    <line x1="-100" y1="549" x2="1000" y2="549" stroke="#f8f9fa" stroke-width="5" stroke-dasharray="45 35">
      <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.16s" repeatCount="indefinite"/>
    </line>

    <!-- 速度线 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="-10 0" to="-150 0" dur="0.9s" repeatCount="indefinite"/>
      <line x1="150" y1="252" x2="235" y2="252" stroke="#9ed2f0" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.75;0" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="-10 0" to="-160 0" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
      <line x1="130" y1="305" x2="215" y2="305" stroke="#9ed2f0" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="-10 0" to="-140 0" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
      <line x1="160" y1="352" x2="240" y2="352" stroke="#9ed2f0" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- 地面阴影 -->
    <ellipse cx="460" cy="541" rx="255" ry="8" fill="#14304d" opacity="0.16"/>

    <!-- 远侧腿（反向蹬踏） -->
    <path fill="none" stroke="#d1701c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M408,322 L471.7,370.5 L423,458">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M408,322 L471.7,370.5 L423,458;
                M408,322 L487.4,331.4 L455,426;
                M408,322 L479.2,358.3 L487,458;
                M408,322 L449.9,390.1 L455,490;
                M408,322 L471.7,370.5 L423,458"/>
    </path>

    <!-- 远侧曲柄 + 踏板 + 蹼足 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 455 458" to="360 455 458" dur="1.6s" repeatCount="indefinite"/>
      <line x1="455" y1="458" x2="423" y2="458" stroke="#343a40" stroke-width="8" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 423 458" to="-360 423 458" dur="1.6s" repeatCount="indefinite"/>
        <rect x="413" y="453" width="20" height="9" rx="3" fill="#343a40"/>
        <path d="M416,452 Q424,446 436,450 L434,457 Q424,459 416,456 Z" fill="#c96a15"/>
      </g>
    </g>

    <!-- 后轮 -->
    <g>
      <circle cx="330" cy="460" r="72" fill="none" stroke="#2b2d42" stroke-width="11"/>
      <circle cx="330" cy="460" r="64" fill="none" stroke="#8d99ae" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 330 460" to="360 330 460" dur="0.8s" repeatCount="indefinite"/>
        <g stroke="#868e96" stroke-width="4" stroke-linecap="round">
          <line x1="270" y1="460" x2="390" y2="460"/><line x1="330" y1="400" x2="330" y2="520"/>
          <line x1="287.6" y1="417.6" x2="372.4" y2="502.4"/><line x1="287.6" y1="502.4" x2="372.4" y2="417.6"/>
          <line x1="274.6" y1="437" x2="385.4" y2="483"/><line x1="274.6" y1="483" x2="385.4" y2="437"/>
          <line x1="307" y1="397.6" x2="353" y2="522.4"/><line x1="307" y1="522.4" x2="353" y2="397.6"/>
        </g>
        <line x1="330" y1="398" x2="330" y2="406" stroke="#343a40" stroke-width="3"/>
        <circle cx="330" cy="460" r="8" fill="#495057"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="590" cy="460" r="72" fill="none" stroke="#2b2d42" stroke-width="11"/>
      <circle cx="590" cy="460" r="64" fill="none" stroke="#8d99ae" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 590 460" to="360 590 460" dur="0.8s" repeatCount="indefinite"/>
        <g stroke="#868e96" stroke-width="4" stroke-linecap="round">
          <line x1="530" y1="460" x2="650" y2="460"/><line x1="590" y1="400" x2="590" y2="520"/>
          <line x1="547.6" y1="417.6" x2="632.4" y2="502.4"/><line x1="547.6" y1="502.4" x2="632.4" y2="417.6"/>
          <line x1="534.6" y1="437" x2="645.4" y2="483"/><line x1="534.6" y1="483" x2="645.4" y2="437"/>
          <line x1="567" y1="397.6" x2="613" y2="522.4"/><line x1="567" y1="522.4" x2="613" y2="397.6"/>
        </g>
        <line x1="590" y1="398" x2="590" y2="406" stroke="#343a40" stroke-width="3"/>
        <circle cx="590" cy="460" r="8" fill="#495057"/>
      </g>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M455,458 L330,460"/>
      <path d="M330,460 L418,350"/>
      <path d="M455,458 L418,350"/>
      <path d="M455,458 L565,400"/>
      <path d="M418,350 L578,352"/>
      <path d="M578,352 L565,400" stroke-width="11"/>
    </g>
    <path d="M565,400 Q572,432 590,460" fill="none" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
    <path d="M578,352 L588,330" fill="none" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
    <path d="M582,332 L612,326" fill="none" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
    <path d="M604,328 L614,326" fill="none" stroke="#212529" stroke-width="11" stroke-linecap="round"/>
    <path d="M418,350 L409,327" fill="none" stroke="#495057" stroke-width="6"/>
    <path d="M376,322 Q404,308 434,320 Q406,332 376,322 Z" fill="#343a40"/>

    <!-- 传动：飞轮 + 链条 + 牙盘 -->
    <circle cx="330" cy="460" r="8" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
    <g stroke="#555" stroke-width="3.5" stroke-dasharray="5 3.5" fill="none">
      <line x1="455" y1="443" x2="331" y2="452">
        <animate attributeName="stroke-dashoffset" from="0" to="17" dur="0.29s" repeatCount="indefinite"/>
      </line>
      <line x1="455" y1="473" x2="331" y2="468">
        <animate attributeName="stroke-dashoffset" from="17" to="0" dur="0.29s" repeatCount="indefinite"/>
      </line>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 455 458" to="360 455 458" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="455" cy="458" r="15" fill="#adb5bd" stroke="#495057" stroke-width="3" stroke-dasharray="4 3"/>
    </g>
    <circle cx="455" cy="458" r="5" fill="#495057"/>

    <!-- 近侧腿（蹬踏循环，与曲柄同步） -->
    <path fill="none" stroke="#f77f00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M408,322 L479.2,358.3 L487,458">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M408,322 L479.2,358.3 L487,458;
                M408,322 L449.9,390.1 L455,490;
                M408,322 L471.7,370.5 L423,458;
                M408,322 L487.4,331.4 L455,426;
                M408,322 L479.2,358.3 L487,458"/>
    </path>

    <!-- 近侧曲柄 + 踏板 + 蹼足 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 455 458" to="360 455 458" dur="1.6s" repeatCount="indefinite"/>
      <line x1="455" y1="458" x2="487" y2="458" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 487 458" to="-360 487 458" dur="1.6s" repeatCount="indefinite"/>
        <rect x="477" y="453" width="20" height="9" rx="3" fill="#212529"/>
        <path d="M480,452 Q488,446 500,450 L498,457 Q488,459 480,456 Z" fill="#f77f00"/>
      </g>
    </g>

    <!-- 鹈鹕（整体轻微起伏） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0; 0 -2.5; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <path d="M312,262 L268,236 L286,276 Z" fill="#ffffff" stroke="#d8d8d8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M306,276 L262,266 L292,292 Z" fill="#ffffff" stroke="#d8d8d8" stroke-width="2" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="385" cy="290" rx="88" ry="62" fill="#ffffff" stroke="#d8d8d8" stroke-width="2.5" transform="rotate(-8 385 290)"/>
      <path d="M352,268 Q392,262 420,286" fill="none" stroke="#e2e2e2" stroke-width="3" stroke-linecap="round"/>
      <path d="M344,286 Q384,280 414,304" fill="none" stroke="#e2e2e2" stroke-width="3" stroke-linecap="round"/>

      <!-- 颈 -->
      <path d="M446,262 Q494,246 498,198" fill="none" stroke="#e0e0e0" stroke-width="29" stroke-linecap="round"/>
      <path d="M446,262 Q494,246 498,198" fill="none" stroke="#fdfdfd" stroke-width="24" stroke-linecap="round"/>

      <!-- 头 + 冠羽 -->
      <path d="M486,168 Q472,154 482,148 Q490,162 496,166 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="500" cy="192" r="26" fill="#ffffff" stroke="#dcdcdc" stroke-width="2.5"/>

      <!-- 喙（上颌） -->
      <path d="M512,182 Q580,176 648,214 Q640,225 604,220 Q550,206 512,202 Z" fill="#f8961e" stroke="#e07b00" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M536,190 L556,192" stroke="#e07b00" stroke-width="2" stroke-linecap="round"/>

      <!-- 喉囊 -->
      <path d="M514,206 Q556,274 646,220 Q606,240 550,234 Q524,224 514,206 Z" fill="url(#pouch)" stroke="#e07b00" stroke-width="1" opacity="0.97"/>

      <!-- 喙里的小鱼尾巴 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 528 206; 8 528 206; 0 528 206; -6 528 206; 0 528 206" dur="0.9s" repeatCount="indefinite"/>
        <path d="M528,208 L514,182 L542,204 Z" fill="#7fb3d5" stroke="#5187a3" stroke-width="1.5" stroke-linejoin="round"/>
      </g>

      <!-- 眼睛（会眨） -->
      <ellipse cx="508" cy="183" rx="6.5" ry="6.5" fill="#ffffff" stroke="#999999" stroke-width="1"/>
      <circle cx="510" cy="184" r="3.1" fill="#1d3557"/>
      <circle cx="508.8" cy="182.6" r="1.1" fill="#ffffff"/>
      <ellipse cx="508" cy="183" rx="7" ry="0.2" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2">
        <animate attributeName="ry" values="0.2;0.2;7;7;0.2" keyTimes="0;0.9;0.93;0.96;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 翅膀扶在车把上（轻微摆动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 432 272; 2 432 272; 0 432 272; -1.5 432 272; 0 432 272" dur="1.6s" repeatCount="indefinite"/>
        <path d="M432,272 Q520,252 606,328" fill="none" stroke="#dcdcdc" stroke-width="25" stroke-linecap="round"/>
        <path d="M432,272 Q520,252 606,328" fill="none" stroke="#fdfdfd" stroke-width="19" stroke-linecap="round"/>
        <circle cx="606" cy="328" r="9" fill="#fdfdfd" stroke="#dcdcdc" stroke-width="1.5"/>
      </g>
    </g>
  </svg>
</div>
</body>
</html>
