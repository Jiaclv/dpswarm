<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #2b3040, #171a24);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage { padding: 24px; }
  .frame {
    width: min(92vw, 960px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
  }
  svg { display: block; width: 100%; height: auto; background: #bfe3f7; }
  .caption {
    color: #9aa3b5;
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    letter-spacing: .5px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑自行车的2D动画">
      <title>鹈鹕骑自行车</title>
      <desc>纯 SVG + SMIL 动画：鹈鹕踩踏板，车轮旋转，风景向后滚动。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a9dcf5"/>
          <stop offset="1" stop-color="#e9f8ff"/>
        </linearGradient>
        <radialGradient id="sunG" cx="50%" cy="45%" r="60%">
          <stop offset="0" stop-color="#fff6c9"/>
          <stop offset="55%" stop-color="#ffdf5e"/>
          <stop offset="100%" stop-color="#ffc93c"/>
        </radialGradient>
        <radialGradient id="bodyG" cx="40%" cy="32%" r="75%">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e6ebf0"/>
        </radialGradient>
        <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb347"/>
          <stop offset="1" stop-color="#f08c1a"/>
        </linearGradient>
      </defs>

      <!-- ======================= 天空 ======================= -->
      <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g transform="translate(110 105)">
        <g stroke="#ffc63f" stroke-width="5" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
          <line x1="52" y1="0" x2="70" y2="0"/>
          <line x1="45" y1="26" x2="60.6" y2="35"/>
          <line x1="26" y1="45" x2="35" y2="60.6"/>
          <line x1="0" y1="52" x2="0" y2="70"/>
          <line x1="-26" y1="45" x2="-35" y2="60.6"/>
          <line x1="-45" y1="26" x2="-60.6" y2="35"/>
          <line x1="-52" y1="0" x2="-70" y2="0"/>
          <line x1="-45" y1="-26" x2="-60.6" y2="-35"/>
          <line x1="-26" y1="-45" x2="-35" y2="-60.6"/>
          <line x1="0" y1="-52" x2="0" y2="-70"/>
          <line x1="26" y1="-45" x2="35" y2="-60.6"/>
          <line x1="45" y1="-26" x2="60.6" y2="-35"/>
        </g>
        <circle r="44" fill="url(#sunG)"/>
      </g>

      <!-- 云（缓慢向左漂移，与地面形成视差） -->
      <g fill="#ffffff" opacity="0.92">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="55s" repeatCount="indefinite"/>
        <g id="cloudSet">
          <g transform="translate(150 90)">
            <ellipse rx="42" ry="18"/>
            <ellipse cx="30" cy="-9" rx="28" ry="15"/>
            <ellipse cx="-32" cy="-5" rx="24" ry="12"/>
            <ellipse cx="56" cy="2" rx="20" ry="10"/>
          </g>
          <g transform="translate(460 148)" opacity="0.8">
            <ellipse rx="30" ry="12"/>
            <ellipse cx="22" cy="-6" rx="18" ry="10"/>
            <ellipse cx="-20" cy="-3" rx="16" ry="8"/>
          </g>
          <g transform="translate(730 65)">
            <ellipse rx="36" ry="15"/>
            <ellipse cx="26" cy="-8" rx="22" ry="12"/>
            <ellipse cx="-26" cy="-4" rx="20" ry="10"/>
            <ellipse cx="46" cy="1" rx="16" ry="8"/>
          </g>
        </g>
        <use href="#cloudSet" x="1000"/>
      </g>

      <!-- 远山（慢速视差） -->
      <g fill="#bcd9a0" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-320 0" dur="5.4s" repeatCount="indefinite"/>
        <path d="M -60 505 Q 100 430 260 505 T 580 505 T 900 505 T 1220 505 T 1540 505 V 530 H -60 Z"/>
      </g>
      <!-- 近山（稍快） -->
      <g fill="#9cc178">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="2.2s" repeatCount="indefinite"/>
        <path d="M -60 508 Q 40 462 140 508 T 340 508 T 540 508 T 740 508 T 940 508 T 1140 508 T 1340 508 V 530 H -60 Z"/>
      </g>

      <!-- 草地 -->
      <rect x="0" y="486" width="900" height="30" fill="#a4cf7d"/>

      <!-- 路边树木花草（地面速度滚动） -->
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-345.6 0" dur="1s" repeatCount="indefinite"/>
        <g id="treeRow">
          <rect x="26" y="470" width="8" height="36" fill="#7a5233"/>
          <circle cx="30" cy="450" r="24" fill="#5fae57"/>
          <circle cx="45" cy="462" r="15" fill="#6fbf65"/>
          <circle cx="16" cy="463" r="14" fill="#56a451"/>
          <rect x="167" y="480" width="6" height="26" fill="#7a5233"/>
          <circle cx="170" cy="472" r="15" fill="#67b25e"/>
          <ellipse cx="250" cy="500" rx="16" ry="9" fill="#5fae57"/>
          <circle cx="100" cy="505" r="2.5" fill="#ff8fa3"/>
          <circle cx="215" cy="503" r="2.5" fill="#ffd166"/>
          <circle cx="300" cy="506" r="2.5" fill="#b58aff"/>
        </g>
        <use href="#treeRow" x="345.6"/>
        <use href="#treeRow" x="691.2"/>
        <use href="#treeRow" x="1036.8"/>
        <use href="#treeRow" x="1382.4"/>
        <use href="#treeRow" x="1728"/>
        <use href="#treeRow" x="2073.6"/>
        <use href="#treeRow" x="2419.2"/>
      </g>

      <!-- 公路 -->
      <rect x="0" y="514" width="900" height="86" fill="#565a66"/>
      <line x1="0" y1="515.5" x2="900" y2="515.5" stroke="#e8ebef" stroke-width="3" opacity="0.85"/>
      <line x1="0" y1="557" x2="900" y2="557" stroke="#f5d67b" stroke-width="6" stroke-dasharray="34 52.4" opacity="0.95">
        <animate attributeName="stroke-dashoffset" from="0" to="345.6" dur="1s" repeatCount="indefinite"/>
      </line>

      <!-- 速度线 -->
      <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <g opacity="0.55">
          <animateTransform attributeName="transform" type="translate" values="0 0; -70 0" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.2;1" dur="0.6s" repeatCount="indefinite"/>
          <line x1="205" y1="285" x2="255" y2="285"/>
        </g>
        <g opacity="0.55">
          <animateTransform attributeName="transform" type="translate" values="0 0; -70 0" dur="0.6s" begin="-0.22s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.2;1" dur="0.6s" begin="-0.22s" repeatCount="indefinite"/>
          <line x1="185" y1="330" x2="245" y2="330"/>
        </g>
        <g opacity="0.55">
          <animateTransform attributeName="transform" type="translate" values="0 0; -70 0" dur="0.6s" begin="-0.43s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.2;1" dur="0.6s" begin="-0.43s" repeatCount="indefinite"/>
          <line x1="215" y1="378" x2="262" y2="378"/>
        </g>
      </g>

      <!-- 地面阴影 -->
      <ellipse cx="445" cy="518" rx="215" ry="10" fill="#000000" opacity="0.13"/>

      <!-- ======================= 骑手与自行车 ======================= -->
      <g>
        <!-- 后轮 -->
        <g>
          <g stroke="#b9bfc9" stroke-width="2.5">
            <animateTransform attributeName="transform" type="rotate" from="0 330 460" to="360 330 460" dur="1s" repeatCount="indefinite"/>
            <line x1="378" y1="460" x2="282" y2="460"/>
            <line x1="363.9" y1="493.9" x2="296.1" y2="426.1"/>
            <line x1="330" y1="508" x2="330" y2="412"/>
            <line x1="296.1" y1="493.9" x2="363.9" y2="426.1"/>
            <circle cx="379" cy="460" r="4" fill="#f2b705" stroke="none"/>
          </g>
          <circle cx="330" cy="460" r="55" fill="none" stroke="#262a33" stroke-width="10"/>
          <circle cx="330" cy="460" r="49" fill="none" stroke="#9aa0aa" stroke-width="3.5"/>
          <circle cx="330" cy="460" r="8" fill="#2f333b"/>
          <circle cx="330" cy="460" r="3" fill="#8b929c"/>
        </g>

        <!-- 远侧曲柄 + 踏板 + 远侧脚（先画，被车架压住） -->
        <g transform="rotate(180 425 462)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 425 462" to="360 425 462" dur="1s" repeatCount="indefinite"/>
            <line x1="425" y1="462" x2="453" y2="462" stroke="#23262c" stroke-width="6" stroke-linecap="round"/>
            <g transform="translate(453 462)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="1s" repeatCount="indefinite"/>
                <rect x="-10" y="-3.5" width="20" height="7" rx="2.5" fill="#1b1e24"/>
                <path d="M -5 -4 L 16 -8 L 22 -2 L -5 -1 Z" fill="#c9721f"/>
              </g>
            </g>
          </g>
        </g>

        <!-- 远侧腿（深色，关键帧与曲柄同步） -->
        <path fill="none" stroke="#c9721f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
              d="M 398 360 L 456.5 411.6 L 397 462">
          <animate attributeName="d" dur="1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            values="M 398 360 L 456.5 411.6 L 397 462;
                    M 398 360 L 468.7 395.2 L 405.2 442.2;
                    M 398 360 L 474.7 373.9 L 425 434;
                    M 398 360 L 475.3 370.4 L 444.8 442.2;
                    M 398 360 L 471.4 386.3 L 453 462;
                    M 398 360 L 461.3 405.6 L 444.8 481.8;
                    M 398 360 L 451.5 416.7 L 425 490;
                    M 398 360 L 450.1 418.0 L 405.2 481.8;
                    M 398 360 L 456.5 411.6 L 397 462"/>
        </path>

        <!-- 车架 -->
        <g stroke-linecap="round">
          <line x1="330" y1="460" x2="425" y2="462" stroke="#c93b31" stroke-width="6"/>
          <line x1="330" y1="460" x2="396" y2="372" stroke="#c93b31" stroke-width="6"/>
          <line x1="425" y1="462" x2="395" y2="368" stroke="#e2483d" stroke-width="8"/>
          <line x1="548" y1="388" x2="425" y2="462" stroke="#e2483d" stroke-width="8"/>
          <line x1="398" y1="372" x2="540" y2="360" stroke="#e2483d" stroke-width="7"/>
          <line x1="540" y1="358" x2="552" y2="392" stroke="#e2483d" stroke-width="7"/>
          <line x1="552" y1="392" x2="560" y2="460" stroke="#3f4550" stroke-width="6"/>
          <path d="M 540 360 L 548 344 Q 552 336 562 334" fill="none" stroke="#3f4550" stroke-width="6"/>
          <line x1="556" y1="335" x2="568" y2="332" stroke="#23262c" stroke-width="8"/>
          <line x1="395" y1="366" x2="393" y2="354" stroke="#555b66" stroke-width="5"/>
        </g>
        <circle cx="560" cy="334" r="4.5" fill="#f2b705" stroke="#a87908" stroke-width="1"/>

        <!-- 车座 -->
        <path d="M 375 356 Q 393 348 415 356 Q 393 363 375 356 Z" fill="#5a3d26"/>

        <!-- 车尾小旗 -->
        <line x1="372" y1="352" x2="364" y2="302" stroke="#555b66" stroke-width="3"/>
        <path d="M 364 302 L 334 310 L 364 318 Z" fill="#2fa4a0">
          <animateTransform attributeName="transform" type="rotate"
            values="0 364 310; -8 364 310; 0 364 310; -4 364 310; 0 364 310"
            dur="0.9s" repeatCount="indefinite"/>
        </path>

        <!-- 链条 -->
        <g stroke="#3a3f47" stroke-width="3" stroke-dasharray="6 2" fill="none">
          <line x1="331" y1="452" x2="424" y2="448">
            <animate attributeName="stroke-dashoffset" from="0" to="96" dur="1s" repeatCount="indefinite"/>
          </line>
          <line x1="331" y1="468" x2="424" y2="476">
            <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1s" repeatCount="indefinite"/>
          </line>
        </g>
        <circle cx="330" cy="460" r="8" fill="#2f333b"/>

        <!-- 鹈鹕身体（随蹬踏轻微起伏） -->
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0;0 -4;0 0;0 -4;0 0" keyTimes="0;0.25;0.5;0.75;1"
            calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
            dur="1s" repeatCount="indefinite"/>

          <!-- 尾羽 -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="0 352 325; 4 352 325; 0 352 325; -3 352 325; 0 352 325"
              dur="0.7s" repeatCount="indefinite"/>
            <path d="M 352 312 L 324 296 L 336 315 L 316 318 L 336 326 L 324 342 L 354 336 Z"
                  fill="#eef1f4" stroke="#d8dde3" stroke-width="1.5" stroke-linejoin="round"/>
          </g>

          <!-- 身体 -->
          <ellipse cx="400" cy="325" rx="64" ry="50" fill="url(#bodyG)" stroke="#d8dde3" stroke-width="1.5"
                   transform="rotate(-8 400 325)"/>

          <!-- 脖子 -->
          <path d="M 440 305 C 468 298 455 255 475 228" fill="none" stroke="#f7f9fa" stroke-width="21" stroke-linecap="round"/>

          <!-- 头部 -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="0 480 235; 2 480 235; 0 480 235; -1.5 480 235; 0 480 235"
              dur="1s" repeatCount="indefinite"/>
            <!-- 头冠羽 -->
            <g fill="#f3f5f7" stroke="#d8dde3" stroke-width="1" stroke-linejoin="round">
              <animateTransform attributeName="transform" type="rotate"
                values="0 468 186; -6 468 186; 0 468 186; -3 468 186; 0 468 186"
                dur="0.8s" repeatCount="indefinite"/>
              <path d="M 470 188 L 456 176 L 468 173 Z"/>
              <path d="M 465 193 L 450 183 L 461 181 Z"/>
            </g>
            <circle cx="484" cy="206" r="23" fill="#f7f9fa" stroke="#d8dde3" stroke-width="1.5"/>
            <!-- 大嘴上喙 -->
            <path d="M 497 192 Q 552 195 590 212 Q 550 206 497 205 Z" fill="url(#beakG)" stroke="#d97c12" stroke-width="0.8"/>
            <path d="M 584 207 Q 592 213 585 219" fill="none" stroke="#ef941c" stroke-width="3" stroke-linecap="round"/>
            <line x1="512" y1="199" x2="528" y2="202" stroke="#c77a17" stroke-width="2" stroke-linecap="round"/>
            <!-- 喉囊（轻微晃动） -->
            <path d="M 500 205 Q 546 254 590 212 Q 548 231 500 205 Z" fill="#f49f33">
              <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
                values="M 500 205 Q 546 254 590 212 Q 548 231 500 205 Z;
                        M 500 205 Q 546 246 590 212 Q 548 226 500 205 Z;
                        M 500 205 Q 546 254 590 212 Q 548 231 500 205 Z"/>
            </path>
            <!-- 眼睛 -->
            <circle cx="491" cy="197" r="4.3" fill="#2e3038"/>
            <circle cx="492.5" cy="195.5" r="1.4" fill="#ffffff"/>
          </g>

          <!-- 围巾（随风飘动） -->
          <path d="M 461 234 Q 444 238 428 231 L 436 246 Q 450 248 461 245 Z" fill="#2fa4a0" stroke="#23807d" stroke-width="1">
            <animate attributeName="d" dur="0.6s" repeatCount="indefinite"
              values="M 461 234 Q 444 238 428 231 L 436 246 Q 450 248 461 245 Z;
                      M 461 234 Q 444 244 430 240 L 438 252 Q 450 246 461 245 Z;
                      M 461 234 Q 444 238 428 231 L 436 246 Q 450 248 461 245 Z"/>
          </path>

          <!-- 近侧翅膀（轻拍） -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="0 420 306; -5 420 306; 0 420 306; -2 420 306; 0 420 306"
              dur="1.15s" repeatCount="indefinite"/>
            <path d="M 420 302 Q 372 312 350 342 Q 388 352 418 344 Q 432 322 420 302 Z"
                  fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M 412 316 Q 380 322 362 340 M 416 326 Q 390 332 372 344"
                  fill="none" stroke="#ccd3da" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>

        <!-- 前轮 -->
        <g>
          <g stroke="#b9bfc9" stroke-width="2.5">
            <animateTransform attributeName="transform" type="rotate" from="0 560 460" to="360 560 460" dur="1s" repeatCount="indefinite"/>
            <line x1="608" y1="460" x2="512" y2="460"/>
            <line x1="593.9" y1="493.9" x2="526.1" y2="426.1"/>
            <line x1="560" y1="508" x2="560" y2="412"/>
            <line x1="526.1" y1="493.9" x2="593.9" y2="426.1"/>
            <circle cx="609" cy="460" r="4" fill="#f2b705" stroke="none"/>
          </g>
          <circle cx="560" cy="460" r="55" fill="none" stroke="#262a33" stroke-width="10"/>
          <circle cx="560" cy="460" r="49" fill="none" stroke="#9aa0aa" stroke-width="3.5"/>
          <circle cx="560" cy="460" r="8" fill="#2f333b"/>
          <circle cx="560" cy="460" r="3" fill="#8b929c"/>
        </g>

        <!-- 近侧曲柄 + 牙盘 + 踏板 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 425 462" to="360 425 462" dur="1s" repeatCount="indefinite"/>
          <line x1="425" y1="462" x2="453" y2="462" stroke="#3a3f47" stroke-width="7" stroke-linecap="round"/>
          <circle cx="425" cy="462" r="15" fill="#2f333b"/>
          <circle cx="425" cy="462" r="10.5" fill="none" stroke="#8b929c" stroke-width="3" stroke-dasharray="5 4"/>
          <circle cx="425" cy="462" r="5" fill="#17191d"/>
          <g transform="translate(453 462)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/>
              <rect x="-10" y="-3.5" width="20" height="7" rx="2.5" fill="#23262c"/>
              <path d="M -5 -4 L 16 -8 L 22 -2 L -5 -1 Z" fill="#ef8b2a"/>
              <path d="M 2 -6 L 4 -2 M 8 -7 L 10 -2" stroke="#c9721f" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            </g>
          </g>
        </g>

        <!-- 近侧腿（IK 关键帧，与曲柄 1s 周期同步） -->
        <path fill="none" stroke="#ef8b2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
              d="M 398 360 L 471.4 386.3 L 453 462">
          <animate attributeName="d" dur="1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            values="M 398 360 L 471.4 386.3 L 453 462;
                    M 398 360 L 461.3 405.6 L 444.8 481.8;
                    M 398 360 L 451.5 416.7 L 425 490;
                    M 398 360 L 450.1 418.0 L 405.2 481.8;
                    M 398 360 L 456.5 411.6 L 397 462;
                    M 398 360 L 468.7 395.2 L 405.2 442.2;
                    M 398 360 L 474.7 373.9 L 425 434;
                    M 398 360 L 475.3 370.4 L 444.8 442.2;
                    M 398 360 L 471.4 386.3 L 453 462"/>
        </path>
      </g>
    </svg>
  </div>
  <p class="caption">纯 SVG + SMIL 动画 · 无 JavaScript · 鹈鹕骑车兜风中 🚲</p>
</div>
</body>
</html>
