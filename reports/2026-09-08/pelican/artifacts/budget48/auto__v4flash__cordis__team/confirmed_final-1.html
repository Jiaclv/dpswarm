<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 14px;
    background: radial-gradient(circle at 50% 30%, #a8dcf7 0%, #7fbde8 70%, #5fa6d8 100%);
    font-family: "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 22px; color: #123c56; letter-spacing: 3px; }
  p.note { margin: 0 0 10px; font-size: 12.5px; color: #2f5f7a; }
  svg.scene { display: block; width: min(96vw, 1150px); height: auto; border-radius: 14px;
              box-shadow: 0 18px 40px rgba(10, 40, 60, .35); }

  /* ---- scenery animation helpers ---- */
  @keyframes drift {
    from { transform: translateX(-420px); }
    to   { transform: translateX(1500px); }
  }
  .c { animation: drift linear infinite; }
  .c1 { animation-duration: 95s;  animation-delay: -18s; }
  .c2 { animation-duration: 140s; animation-delay: -70s; }
  .c3 { animation-duration: 70s;  animation-delay: -3s;  }

  @keyframes bushScroll {
    to { transform: translateX(-320px); }
  }
  .bushRow { animation: bushScroll linear infinite; animation-duration: 4.6s; }

  @keyframes pouchBreath {
    from { transform: scaleY(1); }
    to   { transform: scaleY(1.07); }
  }
  .pouch { transform-box: fill-box; transform-origin: 50% 6%;
           animation: pouchBreath 2.8s ease-in-out infinite alternate; }

  @keyframes blinkAnim {
    0%, 90%, 100% { transform: scaleY(1); }
    93%, 96%      { transform: scaleY(0.12); }
  }
  .eyeG { transform-box: fill-box; transform-origin: center;
          animation: blinkAnim 4.8s infinite; }
</style>
</head>

<script>
(function () {
  'use strict';
  var svg = document.getElementById('scene');
  var rearSpokes = document.getElementById('rearSpokes');
  var frontSpokes = document.getElementById('frontSpokes');
  var nearCrank = document.getElementById('nearCrank');
  var farCrank = document.getElementById('farCrank');
  var nearPedal = document.getElementById('nearPedal');
  var farPedal = document.getElementById('farPedal');
  var nearLeg = document.getElementById('nearLeg');
  var farLeg = document.getElementById('farLeg');
  var rider = document.getElementById('rider');

  // 几何常量
  var BX = 522, BY = 472;       // 五通中心
  var CRANK = 44;               // 曲柄长度
  var HX = 500, HY = 342;       // 髋关节
  var L1 = 105, L2 = 100;       // 大腿 / 小腿
  var W1 = 380, W2 = 665, WCY = 472; // 两轮中心
  var CRANK_OMEGA = 7.4;        // 踩踏角速度 rad/s
  var WHEEL_OMEGA = 9.0;        // 车轮角速度 rad/s

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function solveLeg(H, T, out) {
    // 二段反向运动学：把脚踝放到踏板上，膝盖朝前
    var dx = T[0] - H[0], dy = T[1] - H[1];
    var d = clamp(Math.sqrt(dx * dx + dy * dy), 12, L1 + L2 - 3);
    var alpha = Math.atan2(dy, dx);
    var cosD = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
    var delta = Math.acos(cosD);
    var theta1 = alpha - delta;
    out[0] = H[0] + L1 * Math.cos(theta1);
    out[1] = H[1] + L1 * Math.sin(theta1);
  }

  var kneeNear = [0, 0], kneeFar = [0, 0];
  var targetNear = [0, 0], targetFar = [0, 0];
  var last = null;
  var theta = 0, wheelDeg = 0;

  function frame(now) {
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    theta += CRANK_OMEGA * dt;
    wheelDeg = (wheelDeg + WHEEL_OMEGA * dt * 180 / Math.PI) % 360;

    // 车轮辐条旋转
    rearSpokes.setAttribute('transform', 'rotate(' + wheelDeg + ' ' + W1 + ' ' + WCY + ')');
    frontSpokes.setAttribute('transform', 'rotate(' + wheelDeg + ' ' + W2 + ' ' + WCY + ')');

    // 曲柄
    var d1 = theta * 180 / Math.PI;
    var d2 = d1 + 180;
    nearCrank.setAttribute('transform', 'rotate(' + d1 + ' ' + BX + ' ' + BY + ')');
    farCrank.setAttribute('transform', 'rotate(' + d2 + ' ' + BX + ' ' + BY + ')');

    // 脚踏位置（含踏板在曲柄端的几何）
    var e1x = BX + CRANK * Math.cos(theta);
    var e1y = BY + CRANK * Math.sin(theta);
    var e2x = BX + CRANK * Math.cos(theta + Math.PI);
    var e2y = BY + CRANK * Math.sin(theta + Math.PI);

    nearPedal.setAttribute('transform', 'translate(' + e1x + ' ' + e1y + ')');
    farPedal.setAttribute('transform', 'translate(' + e2x + ' ' + e2y + ')');

    // 身体小幅度上下浮动（每圈两次）
    var bob = 3 * Math.sin(2 * theta + 0.6);
    rider.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    var hy = HY + bob;

    // 腿部 IK
    targetNear[0] = e1x + 6; targetNear[1] = e1y - 11;
    targetFar[0] = e2x + 6;  targetFar[1] = e2y - 11;
    solveLeg([HX, hy], targetNear, kneeNear);
    solveLeg([HX, hy], targetFar, kneeFar);

    nearLeg.setAttribute('points',
      HX + ',' + hy.toFixed(1) + ' ' +
      kneeNear[0].toFixed(1) + ',' + kneeNear[1].toFixed(1) + ' ' +
      targetNear[0].toFixed(1) + ',' + targetNear[1].toFixed(1));
    farLeg.setAttribute('points',
      HX + ',' + hy.toFixed(1) + ' ' +
      kneeFar[0].toFixed(1) + ',' + kneeFar[1].toFixed(1) + ' ' +
      targetFar[0].toFixed(1) + ',' + targetFar[1].toFixed(1));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
