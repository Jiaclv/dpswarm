<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican Cycling</title>
<style>
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:24px 12px; box-sizing:border-box;
    background:linear-gradient(180deg,#eaf3f9 0%,#f6ecd9 100%);
    font-family:"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif; color:#38505f;
  }
  h1{margin:0; font-size:26px; letter-spacing:1px;}
  p.sub{margin:0 0 4px; font-size:13.5px; color:#6b7f8c;}
  .stage{max-width:1080px; width:100%;}
  svg{display:block; width:100%; height:auto; border-radius:18px;
      box-shadow:0 16px 44px rgba(56,84,108,.28); background:#cfeaf7;}
  .ctrl{display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center;}
  button{font-size:15px; padding:9px 26px; border:1px solid #93aebb; background:#ffffff; color:#38505f;
         border-radius:999px; cursor:pointer; transition:background .2s;}
  button:hover{background:#dfeef6;}
  .hint{font-size:12.5px; color:#718692;}
  /* 云朵 CSS 平移循环（两副本间隔等于位移周期，无缝循环） */
  .driftA{animation:cloudA 70s linear infinite;}
  .driftB{animation:cloudB 105s linear infinite;}
  @keyframes cloudA{from{transform:translateX(0)}to{transform:translateX(-1250px)}}
  @keyframes cloudB{from{transform:translateX(0)}to{transform:translateX(-1600px)}}
</style>
</head>

<script>
(function () {
  'use strict';
  function byId(id) { return document.getElementById(id); }
  var spinR = byId('spinR'), spinF = byId('spinF');
  var armN = byId('armN'), armF = byId('armF');
  var rectN = byId('rectN'), rectF = byId('rectF');
  var shoeN = byId('shoeN'), shoeF = byId('shoeF');
  var legN = byId('legN'), legF = byId('legF');
  var bodyG = byId('bodyG'), pouchG = byId('pouchG');
  var dashRow = byId('dashRow'), shrubG = byId('shrubG');
  var treeG = byId('treeG'), birdG = byId('birdG'), rayG = byId('rayG');
  var toggleBtn = byId('toggle');

  var TAU = Math.PI * 2;
  var RAD2DEG = 180 / Math.PI;
  var T = 1.5;            // 每圈曲柄秒数
  var K = 1.25;           // 车轮转数 / 曲柄转数
  var wheelR = 57;        // 车轮半径（像素）
  var crankR = 20;        // 曲柄长
  var BBX = 500, BBY = 414;
  var hipNX = 505, hipFX = 489, hipY0 = 303;
  var bobAmp = 4.6;
  var L1 = 70, L2 = 68;   // 大腿 / 小腿长
  var paused = false;

  function ikPath(hip, foot) {
    var dx = foot[0] - hip[0];
    var dy = foot[1] - hip[1];
    var d = Math.hypot(dx, dy);
    if (d < 4) d = 4;
    var maxD = L1 + L2 - 0.4;
    if (d > maxD) d = maxD;
    var ux = dx / d, uy = dy / d;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var mx = hip[0] + ux * a;
    var my = hip[1] + uy * a;
    var kx = mx + uy * h;   // 膝盖朝行进方向（+x）弯曲
    var ky = my - ux * h;
    return 'M' + hip[0].toFixed(1) + ' ' + hip[1].toFixed(1) +
           'L' + kx.toFixed(1) + ' ' + ky.toFixed(1) +
           'L' + foot[0].toFixed(1) + ' ' + foot[1].toFixed(1);
  }

  var t0 = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused) return;
    var t = (now - t0) / 1000;
    var th = (t / T) * TAU;          // 曲柄角度（弧度，顺时针）
    var thd = th * RAD2DEG;
    var cos = Math.cos(th), sin = Math.sin(th);
    var cosP = Math.cos(th + Math.PI), sinP = Math.sin(th + Math.PI);

    // 身体起伏：每条腿下蹬时身体上抬
    var bob = bobAmp * Math.cos(2 * th);

    // 曲柄与脚踏
    var nfx = BBX + crankR * cos,  nfy = BBY + crankR * sin;    // 近侧脚
    var ffx = BBX + crankR * cosP, ffy = BBY + crankR * sinP;   // 远侧脚
    armN.setAttribute('transform', 'rotate(' + thd + ' ' + BBX + ' ' + BBY + ')');
    armF.setAttribute('transform', 'rotate(' + (thd + 180) + ' ' + BBX + ' ' + BBY + ')');
    var trN = 'translate(' + nfx.toFixed(1) + ' ' + nfy.toFixed(1) + ')';
    var trF = 'translate(' + ffx.toFixed(1) + ' ' + ffy.toFixed(1) + ')';
    rectN.setAttribute('transform', trN);
    shoeN.setAttribute('transform', trN);
    rectF.setAttribute('transform', trF);
    shoeF.setAttribute('transform', trF);

    // 双腿（两段 IK，脚始终钉在脚踏上）
    var hipY = hipY0 + bob;
    legN.setAttribute('d', ikPath([hipNX, hipY], [nfx, nfy]));
    legF.setAttribute('d', ikPath([hipFX, hipY], [ffx, ffy]));

    // 身体、喉囊晃动
    bodyG.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    var sway = 6 * Math.sin(th + 0.9) + 3 * Math.sin(2 * th + 2.1);
    pouchG.setAttribute('transform', 'rotate(' + sway.toFixed(2) + ' 700 187)');

    // 车轮转动与地面移动（同节奏）
    var wheelDeg = thd * K;
    spinR.setAttribute('transform', 'rotate(' + wheelDeg.toFixed(1) + ')');
    spinF.setAttribute('transform', 'rotate(' + wheelDeg.toFixed(1) + ')');

    var dist = th * K * wheelR;    // 前进距离（px），与轮圈周长一致
    dashRow.setAttribute('transform', 'translate(' + (-(dist % 110)).toFixed(1) + ' 0)');
    shrubG.setAttribute('transform', 'translate(' + (-((dist * 0.35) % 250)).toFixed(1) + ' 0)');
    treeG.setAttribute('transform', 'translate(' + (-((dist * 0.12) % 1240)).toFixed(1) + ' 0)');
    birdG.setAttribute('transform', 'translate(' + (-((dist * 0.05) % 900)).toFixed(1) + ' 0)');

    // 太阳光线
    rayG.setAttribute('transform', 'rotate(' + ((t * 8) % 360).toFixed(2) + ' 95 95)');
  }
  requestAnimationFrame(frame);

  toggleBtn.addEventListener('click', function () {
    paused = !paused;
    toggleBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  });
})();
</script>
</body>
</html>
