<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    dashRow: $('dashRow'), bushRow: $('bushRow'),
    spokes: document.querySelectorAll('.spk'),
    legFar: $('legFar'), legNear: $('legNear'),
    crankFar: $('crankFar'), crankNear: $('crankNear'),
    farFoot: $('farFoot'), nearFoot: $('nearFoot'),
    core: $('pelicanCore'), wing: $('riderWing'), head: $('headG'), pouch: $('pouchG'),
    sunRays: $('sunRays'),
    cld1: $('cld1'), cld2: $('cld2'), cld3: $('cld3'),
    flyP: $('flyP'), flyWing: $('flyWing')
  };
  if (!els.legNear) return; // 找不到元素则放弃(纯静态也能看)

  var TAU = Math.PI * 2;
  var CADENCE = 0.95;          // 曲柄每秒圈数
  var TRAVEL_PER_REV = 480;    // 每圈曲柄前进的像素(卡通齿轮比)
  var WHEEL_R = 70;
  var BB = { x: 452, y: 398 }, CRANK = 20;
  var HIP = { x: 424, y: 286 }, THIGH = 72, SHANK = 72;
  var WHEELS = [[300, 430], [600, 430]];
  var CLOUD = [ {el:'cld1', s: 7,  p: 220, y: 96,  f: 1},
                {el:'cld2', s: 4.5,p: 640, y: 158, f: .62},
                {el:'cld3', s: 3,  p: 430, y: 64,  f: .42} ];

  function knee(F) {
    // 双腿等长、末端固定在脚踏上的逆向运动学: 膝盖取“较高”的解析解
    var dx = F.x - HIP.x, dy = F.y - HIP.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    if (d > THIGH + SHANK) d = THIGH + SHANK;      // 极限保护
    var ux = dx / d, uy = dy / d;
    var h = Math.sqrt(THIGH * THIGH - (d / 2) * (d / 2));
    var midX = HIP.x + ux * d / 2, midY = HIP.y + uy * d / 2;
    return { x: midX + uy * h, y: midY - ux * h };  // 膝盖永远比髋-脚连线高/靠前
  }

  var last = 0, t = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    t += dt;

    var a = t * TAU * CADENCE;                       // 曲柄角
    var travel = (a / TAU) * TRAVEL_PER_REV;         // 前进距离
    var wheelDeg = ((travel / WHEEL_R) * 180 / Math.PI); // 车轮转角
    var i;

    // 车轮辐条
    var rdeg = wheelDeg;
    for (i = 0; i < els.spokes.length; i++) {
      els.spokes[i].setAttribute('transform', 'rotate(' + rdeg.toFixed(2) + ')');
    }
    // 道路虚线 / 灌木带
    els.dashRow.setAttribute('transform', 'translate(' + (-(travel % 200)).toFixed(2) + ' 0)');
    els.bushRow.setAttribute('transform', 'translate(' + (-(travel % 400)).toFixed(2) + ' 0)');

    // 脚踏位置(顺时针蹬踏)
    function pedalPos(ang) {
      return { x: BB.x + CRANK * Math.cos(ang), y: BB.y + CRANK * Math.sin(ang) };
    }
    var nf = pedalPos(a), ff = pedalPos(a + Math.PI);
    var nk = knee(nf), fk = knee(ff);

    // 腿
    els.legNear.setAttribute('d', 'M' + HIP.x + ',' + HIP.y +
      ' L' + nk.x.toFixed(1) + ',' + nk.y.toFixed(1) +
      ' L' + nf.x.toFixed(1) + ',' + nf.y.toFixed(1));
    els.legFar.setAttribute('d', 'M' + HIP.x + ',' + HIP.y +
      ' L' + fk.x.toFixed(1) + ',' + fk.y.toFixed(1) +
      ' L' + ff.x.toFixed(1) + ',' + ff.y.toFixed(1));

    // 曲柄(从牙盘边缘伸出)
    function crankAttrs(line, F) {
      var dx = F.x - BB.x, dy = F.y - BB.y;
      var L = Math.sqrt(dx * dx + dy * dy) || 1;
      var s = 8 / CRANK;
      line.setAttribute('x1', (BB.x + dx * s).toFixed(1));
      line.setAttribute('y1', (BB.y + dy * s).toFixed(1));
      line.setAttribute('x2', F.x.toFixed(1));
      line.setAttribute('y2', F.y.toFixed(1));
    }
    crankAttrs(els.crankNear, nf);
    crankAttrs(els.crankFar, ff);

    // 脚踏与脚(自水平)
    els.nearFoot.setAttribute('transform', 'translate(' + nf.x.toFixed(1) + ' ' + nf.y.toFixed(1) + ')');
    els.farFoot.setAttribute('transform', 'translate(' + ff.x.toFixed(1) + ' ' + ff.y.toFixed(1) + ')');

    // 身体起伏(每圈两次下沉)、翅膀扇动、头轻点、喉囊颤动
    var bob = 2.6 * Math.sin(2 * a);
    els.core.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    els.wing.setAttribute('transform', 'rotate(' + (6.5 * Math.sin(2 * a + 1.1)).toFixed(2) + ' 428 176)');
    els.head.setAttribute('transform', 'translate(0 ' + (2.1 * Math.sin(2 * a + 2.2)).toFixed(2) + ')');
    var pu = 1 + 0.08 * Math.sin(2 * a - 0.8);
    els.pouch.setAttribute('transform',
      'translate(560 141) scale(1 ' + pu.toFixed(3) + ') translate(-560 -141)');

    // 太阳光芒 / 云 / 飞鸟
    els.sunRays.setAttribute('transform', 'rotate(' + ((t * 5) % 360).toFixed(1) + ' 140 106)');
    for (i = 0; i < CLOUD.length; i++) {
      var c = CLOUD[i];
      var cx = -200 + ((t * c.s + c.p) % 1300);
      var g = els[c.el];
      g.setAttribute('transform', 'translate(' + cx.toFixed(1) + ' ' + c.y + ') scale(' + c.f + ')');
    }
    var fx = -160 + ((t * 26) % 1240);
    var fy = 150 + 8 * Math.sin(t * 2.6);
    els.flyP.setAttribute('transform', 'translate(' + fx.toFixed(1) + ' ' + fy.toFixed(1) + ') scale(0.85)');
    els.flyWing.setAttribute('transform', 'rotate(' + (30 * Math.sin(t * 3.1)).toFixed(1) + ' 2 -3)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
