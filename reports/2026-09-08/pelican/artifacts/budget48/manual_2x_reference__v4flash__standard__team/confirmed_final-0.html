<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bike</title>
<style>
  /* Layout: center the SVG, give it a soft backdrop. */
  html, body { margin: 0; padding: 0; }
  body {
    background: #eef5f8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  svg { display: block; width: min(100vw, 1000px); height: auto; }

  /* --- CSS keyframe animations (all local, no external assets) --- */

  /* Wheels: spokes spin continuously around the wheel center. */
  .spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.72s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Wing: gentle flap around the shoulder. */
  .wing {
    transform-box: fill-box;
    transform-origin: 55% 8%;
    animation: flap 1.15s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-16deg); }
  }

  /* Clouds: drift right-to-left (same direction as the scenery parallax),
     starting off-screen right and ending off-screen left so the loop is invisible. */
  .cloud { animation: drift 46s linear infinite; }
  @keyframes drift {
    from { transform: translateX(1260px); }
    to   { transform: translateX(-260px); }
  }

  /* Scrolling scenery tiles: each tile is 1000 wide and duplicated, so shifting
     by one tile width loops seamlessly (parallax via different durations). */
  .scroll-slow { animation: scrollX 26s linear infinite; }  /* far hills  */
  .scroll-mid  { animation: scrollX 15s linear infinite; }  /* buildings  */
  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-1000px); }
  }

  /* Road centre dashes: shift by exactly one dash period (44+36=80) -> seamless. */
  .road-dash {
    stroke-dasharray: 44 36;
    animation: dash 0.45s linear infinite;
  }
  @keyframes dash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 80; }
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1000 600" role="img" aria-label="Animated cartoon of a pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#dff1fb"/>
    </linearGradient>

    <!-- Far hills tile (light, slow parallax layer). -->
    <g id="hillsTile">
      <path d="M0 470 L0 400 Q90 330 210 372 Q320 306 450 360 Q560 320 660 360 Q760 300 870 350 Q950 340 1000 380 L1000 470 Z" fill="#cfe7c0"/>
      <path d="M0 470 L0 430 Q120 380 260 420 Q360 390 470 425 Q620 380 760 425 Q880 400 1000 430 L1000 470 Z" fill="#bfe0b0" opacity="0.7"/>
    </g>

    <!-- Midground tile (near hills + buildings + trees). -->
    <g id="midTile">
      <path d="M0 470 L0 430 Q150 370 320 420 Q480 380 620 425 Q780 385 1000 430 L1000 470 Z" fill="#a9d49a"/>

      <!-- buildings -->
      <rect x="30"  y="300" width="90"  height="170" rx="3" fill="#d9b0cd"/>
      <rect x="150" y="250" width="70"  height="220" rx="3" fill="#a9c9d9"/>
      <rect x="250" y="335" width="80"  height="135" rx="3" fill="#f0d3a3"/>
      <rect x="370" y="205" width="105" height="265" rx="3" fill="#cdd7a9"/>
      <rect x="510" y="285" width="85"  height="185" rx="3" fill="#d9b0cd"/>
      <rect x="625" y="325" width="90"  height="145" rx="3" fill="#a9c9d9"/>
      <rect x="750" y="235" width="110" height="235" rx="3" fill="#f0d3a3"/>
      <rect x="895" y="305" width="85"  height="165" rx="3" fill="#cdd7a9"/>

      <!-- windows (soft lit) -->
      <g fill="#ffffff" opacity="0.85">
        <rect x="390" y="225" width="14" height="14"/>
        <rect x="420" y="225" width="14" height="14"/>
        <rect x="450" y="225" width="14" height="14"/>
        <rect x="390" y="260" width="14" height="14"/>
        <rect x="420" y="260" width="14" height="14"/>
        <rect x="450" y="260" width="14" height="14"/>
        <rect x="390" y="295" width="14" height="14"/>
        <rect x="420" y="295" width="14" height="14"/>
        <rect x="450" y="295" width="14" height="14"/>
        <rect x="775" y="255" width="16" height="16"/>
        <rect x="810" y="255" width="16" height="16"/>
        <rect x="775" y="290" width="16" height="16"/>
        <rect x="810" y="290" width="16" height="16"/>
      </g>

      <!-- trees -->
      <rect x="235" y="410" width="8" height="60" fill="#7a5c3e"/>
      <circle cx="239" cy="395" r="30" fill="#7cbf6a"/>
      <rect x="705" y="420" width="7" height="50" fill="#7a5c3e"/>
      <circle cx="708" cy="405" r="26" fill="#6db65c"/>
    </g>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="860" cy="95" r="58" fill="#ffe08a" opacity="0.35"/>
  <circle cx="860" cy="95" r="46" fill="#ffe08a"/>

  <!-- drifting clouds (all anchored near x=0, staggered by negative delays) -->
  <g class="cloud" style="animation-delay:-8s">
    <ellipse cx="60"  cy="90"  rx="38" ry="16" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="95"  cy="80"  rx="30" ry="15" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="125" cy="90"  rx="26" ry="13" fill="#ffffff" opacity="0.95"/>
  </g>
  <g class="cloud" style="animation-delay:-24s; animation-duration:58s">
    <ellipse cx="40" cy="180" rx="30" ry="13" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="72" cy="172" rx="26" ry="12" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="98" cy="180" rx="22" ry="11" fill="#ffffff" opacity="0.9"/>
  </g>
  <g class="cloud" style="animation-delay:-38s; animation-duration:70s">
    <ellipse cx="50" cy="270" rx="24" ry="10" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="76" cy="263" rx="20" ry="10" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="96" cy="270" rx="18" ry="9"  fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- scrolling scenery (parallax) -->
  <g class="scroll-slow">
    <use href="#hillsTile"/>
    <g transform="translate(1000,0)"><use href="#hillsTile"/></g>
  </g>
  <g class="scroll-mid">
    <use href="#midTile"/>
    <g transform="translate(1000,0)"><use href="#midTile"/></g>
  </g>

  <!-- ground: road + grass -->
  <rect x="0" y="470" width="1000" height="90" fill="#5f6f78"/>
  <rect x="0" y="470" width="1000" height="5"  fill="#7c8890"/>
  <rect x="0" y="555" width="1000" height="5"  fill="#7c8890"/>
  <rect x="0" y="560" width="1000" height="40" fill="#7cbf6a"/>

  <!-- animated road centre dashes -->
  <line x1="0" y1="516" x2="1000" y2="516" class="road-dash" stroke="#f5e6a3" stroke-width="8" stroke-linecap="round"/>

  <!-- soft shadow under the bicycle -->
  <ellipse cx="480" cy="468" rx="200" ry="10" fill="#1f2a33" opacity="0.15"/>

  <!-- ================= RIDER (bicycle + pelican) ================= -->
  <g id="rider">

    <!-- far-side pedal + webbed foot (behind the frame) -->
    <g id="farPedalGroup">
      <rect x="-14" y="-3" width="28" height="7" rx="2" fill="#2e3237"/>
      <ellipse cx="0" cy="-6" rx="9" ry="4" fill="#e08e1e" stroke="#c87c14" stroke-width="1.5"/>
    </g>

    <!-- bicycle frame -->
    <g id="bike" stroke="#d94a3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="430" y1="405" x2="442" y2="312"/>  <!-- seat tube  -->
      <line x1="442" y1="312" x2="608" y2="288"/>  <!-- top tube   -->
      <line x1="616" y1="320" x2="430" y2="405"/>  <!-- down tube  -->
      <line x1="320" y1="415" x2="442" y2="312"/>  <!-- seat stay  -->
      <line x1="320" y1="415" x2="430" y2="405"/>  <!-- chain stay -->
      <line x1="640" y1="415" x2="616" y2="320"/>  <!-- fork       -->
      <line x1="442" y1="312" x2="438" y2="303" stroke-width="6"/>  <!-- seat post -->
      <line x1="608" y1="288" x2="597" y2="259" stroke-width="6"/>  <!-- stem      -->
      <path d="M 597 259 Q 584 251 572 254" stroke-width="6"/>       <!-- handlebar -->
    </g>

    <!-- saddle + chainring -->
    <ellipse cx="436" cy="301" rx="26" ry="9" fill="#2f3542"/>
    <circle cx="430" cy="405" r="16" fill="#3a3f44"/>
    <circle cx="430" cy="405" r="7"  fill="#8a9096"/>

    <!-- wheels (spokes rotate via CSS) -->
    <g transform="translate(320,415)">
      <circle r="55" stroke="#2f3542" stroke-width="9" fill="none"/>
      <circle r="47" stroke="#9aa0a6" stroke-width="4" fill="none"/>
      <g class="spin" stroke="#b8bcc0" stroke-width="2">
        <line x1="-46" y1="0" x2="46" y2="0"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(30)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(60)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(90)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(120)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="6" fill="#2f3542"/>
    </g>
    <g transform="translate(640,415)">
      <circle r="55" stroke="#2f3542" stroke-width="9" fill="none"/>
      <circle r="47" stroke="#9aa0a6" stroke-width="4" fill="none"/>
      <g class="spin" stroke="#b8bcc0" stroke-width="2">
        <line x1="-46" y1="0" x2="46" y2="0"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(30)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(60)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(90)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(120)"/>
        <line x1="-46" y1="0" x2="46" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="6" fill="#2f3542"/>
    </g>

    <!-- far leg (darker; reaches the far pedal) -->
    <polyline id="legFar" points="446,288 460,350 430,375"
              stroke="#e08e1e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- pelican body (gentle bob applied in JS so the whole bird bounces) -->
    <g id="pelicanBody">
      <!-- tail -->
      <path d="M 400 228 Q 358 204 344 200 Q 356 224 361 240 Q 349 250 351 262 Q 385 260 400 250 Z"
            fill="#eceae2" stroke="#d8d6cf" stroke-width="2"/>
      <!-- body -->
      <ellipse cx="495" cy="240" rx="100" ry="75" fill="#fbfbfa" stroke="#dedcd5" stroke-width="2"/>
      <!-- neck -->
      <path d="M 550 200 Q 580 175 578 145" stroke="#fbfbfa" stroke-width="34" fill="none" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="580" cy="132" r="27" fill="#fbfbfa" stroke="#dedcd5" stroke-width="2"/>
      <!-- little crest -->
      <path d="M 558 116 Q 546 98 540 90 Q 553 104 563 116 Z" fill="#eceae2"/>
      <!-- eye -->
      <circle cx="589" cy="123" r="5" fill="#26303b"/>
      <circle cx="590.5" cy="121.5" r="1.8" fill="#ffffff"/>
      <!-- big upper beak -->
      <path d="M 602 124 Q 662 120 712 146 Q 665 140 604 142 Z"
            fill="#f6a21d" stroke="#e08a1e" stroke-width="2" stroke-linejoin="round"/>
      <!-- throat pouch -->
      <path d="M 604 142 Q 642 148 668 168 Q 690 190 678 200 Q 640 207 610 189 Q 596 170 604 142 Z"
            fill="#f9b63a" stroke="#e08a1e" stroke-width="2" stroke-linejoin="round"/>
      <!-- flapping wing -->
      <path class="wing" d="M 505 208 Q 465 234 440 265 Q 470 286 512 266 Q 542 246 530 220 Q 518 205 505 208 Z"
            fill="#e9e7e0" stroke="#d3d1ca" stroke-width="2"/>
    </g>

    <!-- near leg (brighter; reaches the near pedal) -->
    <polyline id="legNear" points="452,290 470,350 430,375"
              stroke="#f6a21d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- rotating crank arms (driven from JS so they stay in perfect sync with the legs) -->
    <g id="crankGroup">
      <line x1="430" y1="405" x2="430" y2="375" stroke="#444a50" stroke-width="7" stroke-linecap="round"/>
      <line x1="430" y1="405" x2="430" y2="435" stroke="#2e3237" stroke-width="7" stroke-linecap="round"/>
      <circle cx="430" cy="405" r="4" fill="#8a9096"/>
    </g>

    <!-- near-side pedal + webbed foot (front) -->
    <g id="nearPedalGroup">
      <rect x="-14" y="-3" width="28" height="7" rx="2" fill="#3a3f44"/>
      <ellipse cx="0" cy="-6" rx="9" ry="4" fill="#f6a21d" stroke="#e08a1e" stroke-width="1.5"/>
    </g>
  </g>
</svg>

<script>
  /* Small amount of JS used ONLY to keep the crank, pedals, feet, and legs
     in perfect sync (a single shared crank angle) and to add the body bob.
     Wheels, clouds, scenery, road dashes, and the wing flap stay in CSS. */
  (function () {
    var crank      = document.getElementById('crankGroup');
    var body       = document.getElementById('pelicanBody');
    var legNear    = document.getElementById('legNear');
    var legFar     = document.getElementById('legFar');
    var nearPedal  = document.getElementById('nearPedalGroup');
    var farPedal   = document.getElementById('farPedalGroup');

    var BB         = { x: 430, y: 405 };   // bottom-bracket (crank) centre
    var R          = 30;                   // crank arm length
    var PERIOD     = 1050;                 // ms per full crank revolution
    var HIP_NEAR   = { x: 452, y: 290 };
    var HIP_FAR    = { x: 446, y: 288 };
    var BOB_AMP    = 3;                    // px of vertical bob
    var BOB_PERIOD = 1150;                 // ms per bob cycle

    function pedal(angle) {
      return { x: BB.x + R * Math.cos(angle), y: BB.y + R * Math.sin(angle) };
    }

    // Simple 2-segment leg: hip -> knee -> foot, knee bent slightly forward.
    function knee(hip, foot) {
      return { x: (hip.x + foot.x) / 2 + 17, y: (hip.y + foot.y) / 2 + 7 };
    }

    function setLeg(el, hip, foot) {
      var k = knee(hip, foot);
      el.setAttribute('points', hip.x + ',' + hip.y + ' ' + k.x + ',' + k.y + ' ' + foot.x + ',' + foot.y);
    }

    function frame(now) {
      var t     = now / 1000;
      var angle = (t * 2 * Math.PI * 1000 / PERIOD) % (2 * Math.PI);
      var deg   = angle * 180 / Math.PI;
      var bobY  = BOB_AMP * Math.sin(t * 2 * Math.PI * 1000 / BOB_PERIOD);

      // Crank arms are drawn pointing at 12 and 6 o'clock, so subtract/offset
      // 90 degrees: the near pedal rides on the 12-o'clock arm and the far
      // pedal on the 6-o'clock arm, staying locked to the arm tips (the arms
      // are 180 deg apart, matching the two pedals).
      var nearFoot = pedal(angle - Math.PI / 2);
      var farFoot  = pedal(angle + Math.PI / 2);

      // Crank arms rotate around the bottom bracket.
      crank.setAttribute('transform', 'rotate(' + deg + ' ' + BB.x + ' ' + BB.y + ')');

      // Pedals + feet stay horizontal while orbiting.
      nearPedal.setAttribute('transform', 'translate(' + nearFoot.x + ' ' + nearFoot.y + ')');
      farPedal.setAttribute('transform', 'translate(' + farFoot.x + ' ' + farFoot.y + ')');

      // Gentle body bob.
      body.setAttribute('transform', 'translate(0 ' + bobY + ')');

      // Legs follow the hips (which bob with the body) down to the pedals.
      setLeg(legNear, { x: HIP_NEAR.x, y: HIP_NEAR.y + bobY }, nearFoot);
      setLeg(legFar,  { x: HIP_FAR.x,  y: HIP_FAR.y  + bobY }, farFoot);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
