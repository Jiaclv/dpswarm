<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 800px at 50% 20%, #232b3a, #14181f 70%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .frame-card {
    border-radius: 20px;
    overflow: hidden;
    line-height: 0;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  svg { display: block; width: min(920px, 94vw); height: auto; }
  .caption { margin-top: 18px; color: #8fa0b8; font-size: 14px; letter-spacing: .05em; }
</style>
</head>
<body>
<div class="frame-card">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">鹈鹕骑自行车</title>
  <desc id="d">一只白色鹈鹕系着红围巾，踩着一辆青绿色自行车向前骑行；车轮旋转、双腿蹬踏、背景云朵与道路向后移动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edcff"/>
      <stop offset="0.65" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#e9f8ef"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset="1" stop-color="#efe8d9"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <g stroke="#ffd75e" stroke-width="5" stroke-linecap="round">
      <line x1="110" y1="34" x2="110" y2="16"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(45 110 100)"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(90 110 100)"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(135 110 100)"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(180 110 100)"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(225 110 100)"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(270 110 100)"/>
      <line x1="110" y1="34" x2="110" y2="16" transform="rotate(315 110 100)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 110 100" to="360 110 100" dur="28s" repeatCount="indefinite"/>
    </g>
    <circle cx="110" cy="100" r="38" fill="#ffd75e"/>
    <circle cx="110" cy="100" r="30" fill="#ffe488"/>
  </g>

  <!-- 云朵（向左飘） -->
  <g fill="#ffffff" opacity="0.92">
    <g transform="translate(960 120)">
      <ellipse cx="0" cy="0" rx="36" ry="20"/><ellipse cx="30" cy="7" rx="27" ry="15"/><ellipse cx="-28" cy="8" rx="23" ry="13"/><rect x="-42" y="4" width="90" height="14" rx="7"/>
      <animateTransform attributeName="transform" type="translate" from="960 120" to="-340 120" dur="30s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1120 190)">
      <ellipse cx="0" cy="0" rx="30" ry="17"/><ellipse cx="25" cy="6" rx="22" ry="12"/><ellipse cx="-24" cy="6" rx="19" ry="11"/><rect x="-36" y="3" width="76" height="13" rx="6"/>
      <animateTransform attributeName="transform" type="translate" from="1120 190" to="-280 190" dur="42s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1240 70)">
      <ellipse cx="0" cy="0" rx="26" ry="14"/><ellipse cx="21" cy="5" rx="18" ry="10"/><rect x="-30" y="3" width="64" height="11" rx="5"/>
      <animateTransform attributeName="transform" type="translate" from="1240 70" to="-260 70" dur="50s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M-20 472 Q 140 384 310 454 Q 430 500 520 470 L 900 470 L 900 530 L -20 530 Z" fill="#cdeccd"/>
  <path d="M-20 490 Q 200 428 420 478 Q 620 516 900 484 L 900 530 L -20 530 Z" fill="#b6e0b0"/>

  <!-- 灌木（视差滚动） -->
  <g>
    <g transform="translate(140 516)"><ellipse cx="0" cy="0" rx="24" ry="14" fill="#6fae5e"/><circle cx="-12" cy="-6" r="10" fill="#7cbc68"/><circle cx="8" cy="-9" r="12" fill="#68a95a"/></g>
    <g transform="translate(470 520)"><ellipse cx="0" cy="0" rx="28" ry="15" fill="#6fae5e"/><circle cx="-14" cy="-6" r="11" fill="#7cbc68"/><circle cx="10" cy="-9" r="13" fill="#68a95a"/></g>
    <g transform="translate(790 515)"><ellipse cx="0" cy="0" rx="22" ry="13" fill="#6fae5e"/><circle cx="-10" cy="-6" r="9" fill="#7cbc68"/><circle cx="8" cy="-8" r="11" fill="#68a95a"/></g>
    <g transform="translate(1140 516)"><ellipse cx="0" cy="0" rx="24" ry="14" fill="#6fae5e"/><circle cx="-12" cy="-6" r="10" fill="#7cbc68"/><circle cx="8" cy="-9" r="12" fill="#68a95a"/></g>
    <g transform="translate(1470 520)"><ellipse cx="0" cy="0" rx="28" ry="15" fill="#6fae5e"/><circle cx="-14" cy="-6" r="11" fill="#7cbc68"/><circle cx="10" cy="-9" r="13" fill="#68a95a"/></g>
    <g transform="translate(1790 515)"><ellipse cx="0" cy="0" rx="22" ry="13" fill="#6fae5e"/><circle cx="-10" cy="-6" r="9" fill="#7cbc68"/><circle cx="8" cy="-8" r="11" fill="#68a95a"/></g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- 草地与道路 -->
  <rect x="0" y="470" width="900" height="60" fill="#a8dc8a"/>
  <path d="M180 522 q3 -12 6 0 M420 525 q3 -12 6 0 M640 521 q3 -12 6 0 M840 524 q3 -12 6 0" stroke="#7cbc68" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="0" y="530" width="900" height="70" fill="#5b6066"/>
  <line x1="0" y1="536" x2="900" y2="536" stroke="#494e54" stroke-width="3"/>
  <line x1="0" y1="592" x2="900" y2="592" stroke="#3f444a" stroke-width="4"/>
  <g>
    <path d="M-100 562 H 1000" stroke="#f4f6f8" stroke-width="7" stroke-dasharray="46 42" opacity="0.85" fill="none"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-88 0" dur="0.3s" repeatCount="indefinite"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="215" y1="388" x2="285" y2="388"/>
    <line x1="195" y1="424" x2="275" y2="424"/>
    <line x1="225" y1="458" x2="290" y2="458"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -34 0; 0 0" dur="0.55s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55; 0.12; 0.55" dur="0.55s" repeatCount="indefinite"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="455" cy="534" rx="175" ry="9" fill="#000000" opacity="0.15"/>

  <!-- 标题 -->
  <text x="450" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#35507a" opacity="0.85" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">鹈鹕骑行 · Pelican Ride</text>

  <!-- ===== 远侧腿（在车架后面） ===== -->
  <path fill="none" stroke="#d1811f" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
      values="M436 374 Q433 419 418 463;
              M436 374 Q439 411 427 442;
              M436 374 Q448 407 448 433;
              M436 374 Q459 411 469 442;
              M436 374 Q463 423 478 463;
              M436 374 Q465 431 469 484;
              M436 374 Q455 431 448 493;
              M436 374 Q441 427 427 484;
              M436 374 Q433 419 418 463"/>
  </path>

  <!-- 远侧踏板 + 蹼足 -->
  <g transform="translate(418 474)">
    <animateTransform attributeName="transform" additive="sum" type="translate" dur="1.2s" repeatCount="indefinite"
      values="0 0; -21.2 -21.2; 0 -30; 21.2 -21.2; 30 0; 21.2 21.2; 0 30; -21.2 21.2; 0 0"/>
    <path d="M-12 -3 L13 -3 L4 -12 Z" fill="#d1811f"/>
    <rect x="-15" y="-3" width="30" height="7" rx="2" fill="#23262b"/>
  </g>

  <!-- ===== 自行车 ===== -->
  <!-- 后轮 -->
  <g transform="translate(320 468)">
    <circle r="62" fill="none" stroke="#2b2e33" stroke-width="9"/>
    <circle r="53" fill="none" stroke="#cdd2da" stroke-width="4"/>
    <g stroke="#dfe3e8" stroke-width="2.5">
      <line x1="-53" y1="0" x2="53" y2="0"/>
      <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(45)"/>
      <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(90)"/>
      <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(135)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
    </g>
    <circle r="7" fill="#9aa0a8" stroke="#6b7078" stroke-width="2"/>
  </g>
  <!-- 前轮 -->
  <g transform="translate(585 468)">
    <circle r="62" fill="none" stroke="#2b2e33" stroke-width="9"/>
    <circle r="53" fill="none" stroke="#cdd2da" stroke-width="4"/>
    <g stroke="#dfe3e8" stroke-width="2.5">
      <line x1="-53" y1="0" x2="53" y2="0"/>
      <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(45)"/>
      <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(90)"/>
      <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(135)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
    </g>
    <circle r="7" fill="#9aa0a8" stroke="#6b7078" stroke-width="2"/>
  </g>

  <!-- 链条 + 飞轮 -->
  <circle cx="320" cy="468" r="6" fill="none" stroke="#565b63" stroke-width="3"/>
  <g stroke="#34373d" stroke-width="3.5" stroke-dasharray="5 3">
    <line x1="448" y1="461.5" x2="320" y2="462.5"/>
    <line x1="448" y1="486.5" x2="320" y2="473.5"/>
    <animate attributeName="stroke-dashoffset" values="0; 8" dur="0.2s" repeatCount="indefinite"/>
  </g>

  <!-- 车架 -->
  <g stroke="#2e8f83" stroke-linecap="round" fill="none">
    <line x1="448" y1="474" x2="411" y2="380" stroke-width="8"/>          <!-- 座管 -->
    <line x1="413" y1="383" x2="551" y2="373" stroke-width="7"/>          <!-- 上管 -->
    <line x1="448" y1="474" x2="546" y2="391" stroke-width="8"/>          <!-- 下管 -->
    <line x1="544" y1="393" x2="554" y2="367" stroke-width="8"/>          <!-- 头管 -->
    <path d="M546 392 Q 560 430 585 468" stroke-width="6"/>               <!-- 前叉 -->
    <line x1="320" y1="468" x2="412" y2="384" stroke-width="6"/>          <!-- 后上叉 -->
    <line x1="320" y1="468" x2="448" y2="474" stroke-width="6"/>          <!-- 后下叉 -->
    <line x1="411" y1="380" x2="408" y2="372" stroke="#6b7078" stroke-width="5"/> <!-- 座杆 -->
    <path d="M554 367 C 556 357 563 351 575 353" stroke="#3c4046" stroke-width="6"/> <!-- 车把 -->
  </g>
  <circle cx="577" cy="353.5" r="4.5" fill="#23262b"/>
  <ellipse cx="407" cy="370" rx="19" ry="6" fill="#2b2e33"/>

  <!-- 牙盘 + 曲柄 -->
  <circle cx="448" cy="474" r="13" fill="none" stroke="#565b63" stroke-width="5"/>
  <g stroke="#3c4046" stroke-width="6" stroke-linecap="round">
    <line x1="448" y1="474" x2="478" y2="474"/>
    <line x1="448" y1="474" x2="418" y2="474"/>
    <animateTransform attributeName="transform" type="rotate" from="0 448 474" to="360 448 474" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <circle cx="448" cy="474" r="5" fill="#565b63"/>

  <!-- 近侧踏板 + 蹼足 -->
  <g transform="translate(478 474)">
    <animateTransform attributeName="transform" additive="sum" type="translate" dur="1.2s" repeatCount="indefinite"
      values="0 0; 21.2 21.2; 0 30; -21.2 21.2; -30 0; -21.2 -21.2; 0 -30; 21.2 -21.2; 0 0"/>
    <path d="M-12 -3 L13 -3 L4 -12 Z" fill="#f09a28"/>
    <rect x="-15" y="-3" width="30" height="7" rx="2" fill="#23262b"/>
  </g>

  <!-- 近侧腿 -->
  <path fill="none" stroke="#f09a28" stroke-width="10" stroke-linecap="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
      values="M430 372 Q461 420 478 463;
              M430 372 Q463 429 469 484;
              M430 372 Q453 429 448 493;
              M430 372 Q439 425 427 484;
              M430 372 Q431 417 418 463;
              M430 372 Q437 409 427 442;
              M430 372 Q446 405 448 433;
              M430 372 Q457 409 469 442;
              M430 372 Q461 420 478 463"/>
  </path>

  <!-- ===== 鹈鹕（身体起伏） ===== -->
  <g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 0 -3; 0 0; 0 -3; 0 0" dur="1.2s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M374 326 L336 314 L354 336 L328 338 L356 352 L376 350 Z" fill="#efe9dc" stroke="#d8d0bf" stroke-width="1.5"/>

    <!-- 远侧翅膀（扶车把） -->
    <path d="M447 327 Q 500 347 568 349" fill="none" stroke="#cfc7b8" stroke-width="11" stroke-linecap="round"/>

    <!-- 身体 -->
    <ellipse cx="421" cy="339" rx="52" ry="34" transform="rotate(-8 421 339)" fill="url(#bodyGrad)" stroke="#e0d8c8" stroke-width="1.5"/>
    <path d="M396 362 Q 428 372 458 358 Q 442 368 412 366 Z" fill="#e9e1d1" opacity="0.8"/>

    <!-- 红围巾 -->
    <path fill="#e04b3f">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
        values="M466 302 Q 436 296 410 304 L 406 292 Q 436 282 468 292 Z;
                M466 302 Q 436 308 410 296 L 406 284 Q 436 288 468 292 Z;
                M466 302 Q 436 296 410 304 L 406 292 Q 436 282 468 292 Z"/>
    </path>
    <line x1="461" y1="307" x2="483" y2="295" stroke="#e04b3f" stroke-width="9" stroke-linecap="round"/>

    <!-- 脖子 -->
    <path d="M449 321 C 474 313 490 297 494 268" fill="none" stroke="#f7f3ea" stroke-width="16" stroke-linecap="round"/>

    <!-- 头部（轻微点头） -->
    <g>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0 486 262; 3 486 262; 0 486 262; -2 486 262; 0 486 262" dur="1.2s" repeatCount="indefinite"/>
      <!-- 喉囊 -->
      <path d="M507 253 C 511 291 545 301 572 266 L 572 264 Q 538 278 507 253 Z" fill="#f7b733" stroke="#d98e12" stroke-width="1.5"/>
      <!-- 上喙 -->
      <path d="M508 247 L 572 264" fill="none" stroke="#f4a41f" stroke-width="7" stroke-linecap="round"/>
      <path d="M509 243 L 570 259" fill="none" stroke="#d98e12" stroke-width="2" stroke-linecap="round"/>
      <path d="M516 246 L 528 250" stroke="#d98e12" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 囊中的小鱼（摆尾） -->
      <g>
        <animateTransform attributeName="transform" additive="sum" type="rotate" values="-7 545 264; 7 545 264; -7 545 264" dur="0.7s" repeatCount="indefinite"/>
        <path d="M542 258 L 550 240 L 556 256 Z" fill="#6cc6ea" stroke="#49a6d4" stroke-width="1"/>
      </g>
      <!-- 头 -->
      <circle cx="498" cy="254" r="16" fill="#f7f3ea"/>
      <path d="M484 246 Q 473 244 468 250 M486 240 Q 476 234 470 238" fill="none" stroke="#d8d0bf" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 眼睛 -->
      <circle cx="503" cy="247" r="5" fill="#ffffff" stroke="#c9c1b2" stroke-width="0.8"/>
      <circle cx="504.5" cy="247.5" r="2.3" fill="#26282c"/>
      <circle cx="503.6" cy="246.4" r="0.9" fill="#ffffff"/>
    </g>

    <!-- 近侧翅膀（扶车把） -->
    <path d="M443 331 Q 505 351 576 353" fill="none" stroke="#e6ded0" stroke-width="13" stroke-linecap="round"/>
    <path d="M540 348 L 562 350 M536 341 L 556 344 M530 334 L 548 338" stroke="#cfc7b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
</div>
<p class="caption">鹈鹕骑行 · 纯 SVG + SMIL 动画 · 无 JavaScript、无外部依赖</p>
</body>
</html>
