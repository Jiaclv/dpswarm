<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车 · Pelican on a Bike — SVG 2D 动画</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px;
    background: radial-gradient(120% 90% at 50% 0%, #d9f1fc 0%, #bfe6f7 55%, #9ed3ea 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage {
    width: min(980px, 100%);
    background: rgba(255, 255, 255, 0.55);
    border-radius: 26px;
    padding: 18px 18px 12px;
    box-shadow: 0 18px 45px rgba(58, 106, 133, 0.28), 0 2px 6px rgba(58, 106, 133, 0.15);
    backdrop-filter: blur(2px);
  }
  h1 {
    margin: 0 0 10px;
    text-align: center;
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: 2px;
    color: #17618d;
  }
  .stage svg { display: block; width: 100%; height: auto; border-radius: 14px; overflow: hidden; }
  .cap {
    margin: 8px 0 2px;
    text-align: center;
    font-size: 13px;
    color: #3f708f;
    letter-spacing: 1px;
  }

  /* 云 / 鸟：向右后方缓慢漂移（视差） */
  .cloud { animation: cloudDrift linear infinite; }
  .cloud .puff { fill: #ffffff; opacity: .94; }
  .c1 { animation-duration: 74s; }
  .c2 { animation-duration: 98s; animation-delay: -30s; }
  .c3 { animation-duration: 118s; animation-delay: -62s; }
  @keyframes cloudDrift { from { transform: translateX(1060px); } to { transform: translateX(-340px); } }

  .bird { animation: cloudDrift linear infinite; fill: none; stroke: #5c6b76; stroke-width: 2.6; stroke-linecap: round; opacity: .8; }
  .b1 { animation-duration: 46s; }
  .b2 { animation-duration: 60s; animation-delay: -24s; }

  /* 骑行中的气流线：轻柔闪烁 */
  .wind { stroke: #ffffff; stroke-width: 4; stroke-linecap: round; animation: windPulse ease-in-out infinite; }
  .w1 { animation-duration: 1.8s; }
  .w2 { animation-duration: 2.3s; animation-delay: -.9s; }
  .w3 { animation-duration: 2.0s; animation-delay: -.4s; }
  @keyframes windPulse { 0%, 100% { opacity: .05; } 45% { opacity: .55; } }
</style>
</head>
<body>
<main class="stage">
  <h1>🚲 鹈鹕骑车 · Pelican on a Bike</h1>
  <svg viewBox="0 0 900 560" role="img" aria-label="SVG 2D 动画：一只鹈鹕骑着自行车行进在乡间小路上"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a6dbf1"/>
        <stop offset="1" stop-color="#eaf9ff"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#dcd5c6"/>
        <stop offset="1" stop-color="#bdb4a0"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="900" height="560" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g>
      <circle cx="95" cy="86" r="46" fill="#ffe9a3" opacity=".5"/>
      <g stroke="#ffd75e" stroke-width="5" stroke-linecap="round" opacity=".9">
        <line x1="95" y1="38" x2="95" y2="24"/>
        <line x1="95" y1="134" x2="95" y2="148"/>
        <line x1="47" y1="86" x2="33" y2="86"/>
        <line x1="143" y1="86" x2="157" y2="86"/>
        <line x1="61" y1="52" x2="51" y2="42"/>
        <line x1="129" y1="120" x2="139" y2="130"/>
        <line x1="129" y1="52" x2="139" y2="42"/>
        <line x1="61" y1="120" x2="51" y2="130"/>
        <animateTransform attributeName="transform" type="rotate" from="0 95 86" to="360 95 86" dur="52s" repeatCount="indefinite"/>
      </g>
      <circle cx="95" cy="86" r="30" fill="#ffd75e" stroke="#ffc93c" stroke-width="2"/>
    </g>

    <!-- 云 -->
    <g class="cloud c1">
      <g transform="scale(.9) translate(0 64)">
        <ellipse class="puff" cx="0" cy="8" rx="52" ry="17"/>
        <circle class="puff" cx="-20" cy="0" r="21"/>
        <circle class="puff" cx="10" cy="-9" r="25"/>
        <circle class="puff" cx="32" cy="2" r="17"/>
      </g>
    </g>
    <g class="cloud c2">
      <g transform="scale(.65) translate(0 178)">
        <ellipse class="puff" cx="0" cy="8" rx="52" ry="17"/>
        <circle class="puff" cx="-20" cy="0" r="21"/>
        <circle class="puff" cx="10" cy="-9" r="25"/>
        <circle class="puff" cx="32" cy="2" r="17"/>
      </g>
    </g>
    <g class="cloud c3">
      <g transform="scale(1.15) translate(0 118)">
        <ellipse class="puff" cx="0" cy="8" rx="52" ry="17"/>
        <circle class="puff" cx="-20" cy="0" r="21"/>
        <circle class="puff" cx="10" cy="-9" r="25"/>
        <circle class="puff" cx="32" cy="2" r="17"/>
      </g>
    </g>

    <!-- 飞鸟 -->
    <g class="bird b1"><g transform="scale(.9) translate(0 210)"><path d="M0 0 Q 7 -9 14 0 Q 21 -9 28 0"/></g></g>
    <g class="bird b2"><g transform="scale(.65) translate(0 300)"><path d="M0 0 Q 7 -9 14 0 Q 21 -9 28 0"/></g></g>

    <!-- 远山 -->
    <path d="M -30 480 Q 120 292 268 480 Z" fill="#dcebf6"/>
    <path d="M 300 480 Q 520 300 760 480 Z" fill="#cfe5f2"/>
    <path d="M 700 480 Q 820 330 950 480 Z" fill="#dcebf6" opacity=".9"/>

    <!-- 草丘 -->
    <path d="M -40 480 Q 190 336 420 480 Z" fill="#bfe5a1"/>
    <path d="M 330 480 Q 640 350 960 480 Z" fill="#a9dd8d"/>
    <path d="M 520 480 Q 700 400 940 480 Z" fill="#9ad47e" opacity=".85"/>

    <!-- 道路 -->
    <rect x="0" y="470" width="900" height="90" fill="url(#road)"/>
    <rect x="0" y="470" width="900" height="4" fill="#c9c0ad"/>
    <!-- 路面标线（JS 滚动） -->
    <path id="rm"  d="M -80 512 L 980 512" stroke="#f7f1de" stroke-width="7" stroke-linecap="round" stroke-dasharray="34 26" opacity=".95"/>
    <path id="rm2" d="M -80 547 L 980 547" stroke="#e6dfcb" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 44" opacity=".8"/>

    <!-- 气流线 -->
    <path class="wind w1" d="M 196 205 L 268 205"/>
    <path class="wind w2" d="M 176 240 L 258 240"/>
    <path class="wind w3" d="M 206 276 L 282 276"/>

    <!-- 车轮接地阴影 -->
    <ellipse cx="230" cy="471" rx="44" ry="6.5" fill="#31373f" opacity=".14"/>
    <ellipse cx="650" cy="471" rx="44" ry="6.5" fill="#31373f" opacity=".14"/>

    <!-- ============ 后轮 ============ -->
    <g id="rw">
      <circle cx="230" cy="400" r="70" fill="#46505c"/>
      <circle cx="230" cy="400" r="57" fill="#eef1f4"/>
      <g id="rsp" stroke="#c6cdd4" stroke-width="2.6" stroke-linecap="round">
        <line x1="175" y1="400" x2="285" y2="400"/>
        <line x1="230" y1="345" x2="230" y2="455"/>
        <line x1="182.4" y1="372.5" x2="277.6" y2="427.5"/>
        <line x1="202.5" y1="352.4" x2="257.5" y2="447.6"/>
        <line x1="202.5" y1="447.6" x2="257.5" y2="352.4"/>
        <line x1="182.4" y1="427.5" x2="277.6" y2="372.5"/>
      </g>
      <circle cx="230" cy="400" r="10.5" fill="#46505c"/>
      <circle cx="230" cy="400" r="4" fill="#23282e"/>
      <!-- 后飞轮 -->
      <circle cx="230" cy="400" r="14" fill="#aab3bd"/>
      <circle cx="230" cy="400" r="15.5" fill="none" stroke="#828c97" stroke-width="2.5" stroke-dasharray="3 3"/>
      <circle cx="230" cy="400" r="6" fill="#46505c"/>
    </g>

    <!-- ============ 远侧腿（在车架与身体之后） ============ -->
    <g>
      <path id="farPath" d="M 425 306 L 470 360 L 430 429" fill="none" stroke="#d96f14" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="farFoot" cx="430" cy="428" rx="15" ry="6.5" fill="#c9680d"/>
    </g>

    <!-- ============ 前轮 ============ -->
    <g id="fw">
      <circle cx="650" cy="400" r="70" fill="#46505c"/>
      <circle cx="650" cy="400" r="57" fill="#eef1f4"/>
      <g id="fsp" stroke="#c6cdd4" stroke-width="2.6" stroke-linecap="round">
        <line x1="595" y1="400" x2="705" y2="400"/>
        <line x1="650" y1="345" x2="650" y2="455"/>
        <line x1="602.4" y1="372.5" x2="697.6" y2="427.5"/>
        <line x1="622.5" y1="352.4" x2="677.5" y2="447.6"/>
        <line x1="622.5" y1="447.6" x2="677.5" y2="352.4"/>
        <line x1="602.4" y1="427.5" x2="697.6" y2="372.5"/>
      </g>
      <circle cx="650" cy="400" r="10.5" fill="#46505c"/>
      <circle cx="650" cy="400" r="4" fill="#23282e"/>
    </g>

    <!-- ============ 车架 ============ -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#f25c44" stroke-width="9">
        <path d="M 230 400 L 430 405"/>            <!-- 下后叉 -->
        <path d="M 230 400 L 415 318"/>            <!-- 上后叉 -->
        <path d="M 430 405 L 415 318"/>            <!-- 立管 -->
        <path d="M 430 405 L 556 352"/>            <!-- 下管 -->
        <path d="M 415 318 L 548 322"/>            <!-- 上管 -->
        <path d="M 548 322 L 558 352"/>            <!-- 头管 -->
        <path d="M 650 400 C 620 386 585 366 558 352"/> <!-- 前叉 -->
      </g>
      <path d="M 415 318 L 419 310" stroke="#3b4350" stroke-width="7"/> <!-- 座管 -->
      <path d="M 548 322 Q 560 306 574 313" stroke="#3b4350" stroke-width="7"/> <!-- 车把 -->
      <circle cx="575" cy="313" r="5" fill="#3b4350"/>
      <circle cx="557" cy="310" r="5.5" fill="#ffd166" stroke="#c98a1e" stroke-width="1.4"/> <!-- 车铃 -->
    </g>
    <!-- 车座 -->
    <ellipse cx="418" cy="314" rx="23" ry="7" fill="#3b4350" transform="rotate(-6 418 314)"/>

    <!-- 链条 -->
    <g stroke="#8b95a0" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 215 384 L 445 380"/>
      <path d="M 215 418 L 445 432"/>
    </g>

    <!-- ============ 曲柄（牙盘 + 曲柄臂，JS 旋转） ============ -->
    <g id="crank">
      <circle cx="430" cy="405" r="25" fill="none" stroke="#98a2ad" stroke-width="3" stroke-dasharray="3.2 2.6"/>
      <circle cx="430" cy="405" r="23" fill="#c9d1d9" stroke="#98a2ad" stroke-width="3"/>
      <circle cx="430" cy="405" r="8" fill="#8e97a2"/>
      <path d="M 430 376 L 430 434" stroke="#46505c" stroke-width="7"/>
    </g>

    <!-- 踏板平台（保持水平） -->
    <rect id="platF" x="-15" y="-5" width="30" height="10" rx="5" fill="#232a31" transform="translate(430 372)"/>
    <rect id="platN" x="-15" y="-5" width="30" height="10" rx="5" fill="#3b4350" transform="translate(430 438)"/>

    <!-- ============ 鹈鹕（主体，随踏频轻微起伏） ============ -->
    <g id="pel">
      <!-- 尾羽 -->
      <g transform="rotate(-8 380 268)">
        <ellipse cx="356" cy="268" rx="30" ry="14" fill="#fdfbf4" stroke="#d9d0b8" stroke-width="2"/>
        <ellipse cx="374" cy="284" rx="20" ry="10" fill="#fdfbf4" stroke="#d9d0b8" stroke-width="2"/>
      </g>
      <!-- 身体与腹部 -->
      <g transform="rotate(-12 436 242)">
        <ellipse cx="436" cy="242" rx="60" ry="66" fill="#fdfbf4" stroke="#d9d0b8" stroke-width="2.5"/>
        <ellipse cx="436" cy="282" rx="38" ry="24" fill="#f6edda" stroke="none"/>
      </g>
      <!-- 翅膀 -->
      <g id="wing">
        <ellipse cx="428" cy="252" rx="42" ry="22" fill="#efe9d8" stroke="#dcd2b8" stroke-width="2" transform="rotate(-15 428 252)"/>
        <ellipse cx="398" cy="262" rx="15" ry="9" fill="#d3cab0" transform="rotate(-18 398 262)"/>
      </g>
      <!-- 脖子 -->
      <path d="M 450 192 C 474 168 496 152 508 134" fill="none" stroke="#d9d0b8" stroke-width="34" stroke-linecap="round"/>
      <path d="M 450 192 C 474 168 496 152 508 134" fill="none" stroke="#fdfbf4" stroke-width="27" stroke-linecap="round"/>

      <!-- 头、喙、喉囊（随蹬踏轻点） -->
      <g id="headG">
        <path d="M 519 144 L 606 149 C 598 174 585 192 566 193 C 547 194 533 172 519 144 Z" fill="#fbc17c" stroke="#e3a054" stroke-width="2"/>
        <path d="M 516 119 C 560 123 608 129 646 133 C 656 134 661 138 657 142 C 630 146 596 149 574 149 C 548 149 530 147 518 143 Z" fill="#f8a92e" stroke="#dd8f12" stroke-width="2"/>
        <circle cx="510" cy="130" r="25" fill="#fdfbf4" stroke="#d9d0b8" stroke-width="2.5"/>
        <circle cx="521" cy="117" r="7.5" fill="none" stroke="#f8a92e" stroke-width="1.6"/>
        <circle cx="521" cy="117" r="5.5" fill="#ffffff" stroke="#23262b" stroke-width="1"/>
        <circle cx="522.5" cy="117.5" r="2.6" fill="#23262b"/>
        <circle cx="523.7" cy="116.2" r="1" fill="#ffffff"/>
      </g>
    </g>

    <!-- ============ 近侧腿（最前方） ============ -->
    <g>
      <path id="nearPath" d="M 425 306 L 470 360 L 430 429" fill="none" stroke="#ff8f30" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="nearFoot" cx="430" cy="428" rx="15" ry="6.5" fill="#ff7d1a"/>
    </g>

    <circle cx="430" cy="405" r="6.5" fill="#232a31"/>
  </svg>
  <p class="cap">纯 SVG 绘制的 2D 动画 · 打开即自动骑行 🚲🌤️</p>
</main>

<script>
(function () {
  "use strict";
  var TWO = Math.PI * 2;

  /* ---------- 运动参数 ---------- */
  var T_CRANK = 1.8;            // 曲柄每圈秒数
  var OMEGA = TWO / T_CRANK;    // 曲柄角速度 rad/s
  var GEAR = 1.7;               // 齿比（视觉）
  var OMEGA_W = OMEGA * GEAR;   // 车轮角速度
  var WHEEL_R = 70;
  var GROUND_V = OMEGA_W * WHEEL_R;      // 地面后退速度 px/s

  var BBX = 430, BBY = 405, ARM = 33;    // 五通与曲柄长度
  var HIPX = 425, HIPY = 306;            // 髋关节（身体内）
  var L1 = 68, L2 = 84;                  // 大腿 / 小腿长

  function $(id) { return document.getElementById(id); }
  var E = {
    rsp: $("rsp"), fsp: $("fsp"),
    crank: $("crank"),
    rm: $("rm"), rm2: $("rm2"),
    pel: $("pel"), wing: $("wing"), headG: $("headG"),
    nearPath: $("nearPath"), farPath: $("farPath"),
    nearFoot: $("nearFoot"), farFoot: $("farFoot"),
    platN: $("platN"), platF: $("platF")
  };

  /* 双腿双圆交点的膝盖解算：髋 A、脚 F，选更靠前的交点 */
  function knee(AX, AY, FX, FY) {
    var dx = FX - AX, dy = FY - AY;
    var d = Math.sqrt(dx * dx + dy * dy);
    var MIN = Math.abs(L2 - L1) + 4, MAX = L1 + L2 - 2;
    if (d > MAX) { var s = MAX / d; dx *= s; dy *= s; d = MAX; }
    else if (d < MIN) { var t = MIN / d; dx *= t; dy *= t; d = MIN; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var ux = dx / d, uy = dy / d;
    var mx = AX + ux * a, my = AY + uy * a;
    var px = -uy * h, py = ux * h;
    return (mx + px >= mx - px)
      ? [mx + px, my + py]
      : [mx - px, my - py];
  }

  var last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now / 1000;

    var a = OMEGA * t;                 // 曲柄角
    var deg = a * 180 / Math.PI;
    var wd = deg * GEAR;               // 车轮角（度）

    E.rsp.setAttribute("transform", "rotate(" + wd + " 230 400)");
    E.fsp.setAttribute("transform", "rotate(" + wd + " 650 400)");
    E.crank.setAttribute("transform", "rotate(" + deg + " 430 405)");

    // 两只脚踏位置（水平平台保持水平）
    var s = Math.sin(a), c = Math.cos(a);
    var nx = BBX - ARM * s, ny = BBY + ARM * c;   // 近侧脚踏
    var fx = BBX + ARM * s, fy = BBY - ARM * c;   // 远侧脚踏
    E.platN.setAttribute("transform", "translate(" + nx + " " + ny + ")");
    E.platF.setAttribute("transform", "translate(" + fx + " " + fy + ")");

    // 双腿 IK
    var kn = knee(HIPX, HIPY, nx, ny);
    var kf = knee(HIPX, HIPY, fx, fy);
    E.nearPath.setAttribute("d",
      "M " + HIPX + " " + HIPY +
      " L " + kn[0].toFixed(1) + " " + kn[1].toFixed(1) +
      " L " + nx + " " + (ny - 9).toFixed(1));
    E.farPath.setAttribute("d",
      "M " + HIPX + " " + HIPY +
      " L " + kf[0].toFixed(1) + " " + kf[1].toFixed(1) +
      " L " + fx + " " + (fy - 9).toFixed(1));
    E.nearFoot.setAttribute("transform", "translate(" + nx + " " + (ny - 10) + ")");
    E.farFoot.setAttribute("transform",  "translate(" + fx + " " + (fy - 10) + ")");

    // 路面标线向左滚动（周期 60 / 56）
    E.rm.setAttribute("stroke-dashoffset", (-(t * GROUND_V % 60)).toFixed(2));
    E.rm2.setAttribute("stroke-dashoffset", (-((t * GROUND_V + 17) % 56)).toFixed(2));

    // 身体起伏、振翅、点头
    E.pel.setAttribute("transform", "translate(0 " + (3.4 * Math.sin(2 * a + 0.7)).toFixed(2) + ")");
    E.wing.setAttribute("transform", "rotate(" + (5 * Math.sin(TWO * t / 1.55) + 1.5).toFixed(2) + " 452 230)");
    E.headG.setAttribute("transform", "rotate(" + (2.4 * Math.sin(2 * a + 2.2)).toFixed(2) + " 510 130)");

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
