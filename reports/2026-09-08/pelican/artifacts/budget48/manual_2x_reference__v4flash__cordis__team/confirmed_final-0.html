    box-shadow: 0 18px 40px rgba(31, 78, 95, .22), 0 2px 6px rgba(31, 78, 95, .12);
    max-width: 960px; width: min(960px, 98vw);

  svg { display: block; width: 100%; height: auto; border-radius: 14px; }
  .note { color: #5b7885; font-size: .92rem; margin: 0; text-align: center; }
</style>

        <line x1="215" y1="254" x2="215" y2="452" stroke="#b9c4d1" stroke-width="2" transform="rotate(72 215 353)"/>

        <line x1="555" y1="254" x2="555" y2="452" stroke="#b9c4d1" stroke-width="2" transform="rotate(126 555 353)"/>
        <line x1="555" y1="254" x2="555" y2="452" stroke="#b9c4d1" stroke-width="2" transform="rotate(144 555 353)"/>

      <circle cx="555" cy="353" r="3" fill="#3a4652"/>
    </g>

      <path d="M390,351 L372,284"            stroke="#ff6b4a" stroke-width="7.5"/> <!-- 立管 -->

    <rect x="336" y="245" width="64" height="11" rx="5.5" fill="#6b4a38" transform="rotate(-6 368 250)"/>

    <!-- 车把 -->

    <path d="M542,262 C551,240 564,236 578,243" stroke="#b7c1cc" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <rect x="575" y="238" width="13" height="10" rx="5" fill="#33404d" transform="rotate(24 581 243)"/>

    <circle cx="390" cy="351" r="14.5" fill="#8c9aad"/>
    <circle cx="390" cy="351" r="16.4" fill="none" stroke="#6d7a8f" stroke-width="2.2" stroke-dasharray="3.2 2.4"/>

    <!-- ============ 蹬踏组（曲柄/脚踏/腿/脚，由 JS 驱动） ============ -->

      <!-- 一组：近侧一条腿 + 脚踏 + 曲柄；顺序每帧按脚的位置前后交换 -->

<script>
(function () {
  "use strict";
  // 蹬踏几何：中轴 C、髋部 H、曲柄半径 R、大腿 L1、小腿 L2、每圈周期 PER(ms)
  var CX = 390, CY = 351, HX = 381, HY = 256, R = 26, L1 = 58, L2 = 54, PER = 1900;
  var TWO_PI = Math.PI * 2;

  function $(id) { return document.getElementById(id); }
  var ride = $("ride"), trioA = $("trioA"), trioB = $("trioB");
  var arm1 = $("arm1"), arm2 = $("arm2");
  var ped1 = $("ped1"), ped2 = $("ped2"), foot1 = $("foot1"), foot2 = $("foot2");
  var leg1 = $("leg1"), leg2 = $("leg2"), bodyG = $("bodyG");

  function round(n) { return Math.round(n * 100) / 100; }

  // 一条腿的路径：髋 -> 膝（两段连杆逆向解算）-> 踝
  function legD(fx, fy, hx, hy) {
    var ax = fx, ay = fy - 7;              // 踝在脚掌上方
    var dx = ax - hx, dy = ay - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = L1 + L2 - 1;
    if (d > maxD) {                        // 超长时沿方向收拢
      var s = maxD / d;
      ax = hx + dx * s; ay = hy + dy * s; d = maxD;
    }
    if (d < 4) return "M" + hx + "," + hy + "L" + ax + "," + ay;
    var cA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    if (cA > 1) cA = 1; if (cA < -1) cA = -1;
    var a = Math.acos(cA), base = Math.atan2(dy, dx);
    // 取两个可行膝位中更靠前（x 更大）的那个，蹬踏更自然
    var k1 = base + a, k2 = base - a;
    var kx, ky;
    if (Math.cos(k1) >= Math.cos(k2)) { kx = hx + L1 * Math.cos(k1); ky = hy + L1 * Math.sin(k1); }
    else { kx = hx + L1 * Math.cos(k2); ky = hy + L1 * Math.sin(k2); }
    return "M" + round(hx) + "," + round(hy) + "L" + round(kx) + "," + round(ky) + "L" + round(ax) + "," + round(ay);
  }

  function pose(t) {
    var th = (t % PER) / PER * TWO_PI;          // 曲柄角（顺时针）
    var bob = 3.2 * Math.cos(2 * th);            // 身体上下起伏，每圈两次
    var hy = HY + bob;
    var cosT = Math.cos(th), sinT = Math.sin(th);

    // 两脚始终在曲柄圆上（互成 180°）
    var f1x = CX + R * cosT, f1y = CY + R * sinT;
    var f2x = CX - R * cosT, f2y = CY - R * sinT;

    arm1.setAttribute("x2", round(f1x)); arm1.setAttribute("y2", round(f1y));
    arm2.setAttribute("x2", round(f2x)); arm2.setAttribute("y2", round(f2y));
    ped1.setAttribute("transform", "translate(" + round(f1x) + " " + round(f1y) + ")");
    ped2.setAttribute("transform", "translate(" + round(f2x) + " " + round(f2y) + ")");
    foot1.setAttribute("transform", "translate(" + round(f1x) + " " + round(f1y) + ")");
    foot2.setAttribute("transform", "translate(" + round(f2x) + " " + round(f2y) + ")");
    leg1.setAttribute("d", legD(f1x, f1y, HX, hy));
    leg2.setAttribute("d", legD(f2x, f2y, HX, hy));

    // 前方（x 更大）的脚所在的一组腿画在最上层
    if (f1x >= f2x) { ride.appendChild(trioA); ride.appendChild(trioB); }
    else            { ride.appendChild(trioB); ride.appendChild(trioA); }

    bodyG.setAttribute("transform", "translate(0 " + round(bob) + ")");
  }

  pose(0); // 先摆好初始姿态
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    function loop(ts) { pose(ts); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
