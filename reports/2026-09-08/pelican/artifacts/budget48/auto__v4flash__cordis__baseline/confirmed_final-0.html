<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bike</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #102a43 0%, #243b53 55%, #334e68 100%);
    padding: 18px;

  .wrap { width: 100%; max-width: 1010px; }
  header { text-align: center; margin-bottom: 10px; color: #eef4f9; }
  header h1 {
    margin: 0 0 4px;
    font-size: clamp(20px, 3.4vw, 30px);
    letter-spacing: 1px;
  }
  header h1 .accent { color: #ffd166; }
  header p { margin: 0; font-size: 13.5px; color: #b9cfe0; }
  .card {
    background: linear-gradient(#ffffff, #eef6fb);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 18px 45px rgba(4, 16, 30, .45);
  }
  svg.stage {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    cursor: pointer;
    background: #bfe4f3;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 9px;
    color: #7f97a9;
    font-size: 12.5px;
  }
  #state { color: #2f7d4f; font-weight: 600; }
  #state.paused { color: #b3582c; }
</style>
</head>
<body>

<script>
(function () {
  "use strict";
  var svg = document.getElementById("stage");
  var state = document.getElementById("state");

  // ---- 几何常量 ----
  var BB = { x: 450, y: 352 };          // 五通/曲柄中心
  var CRANK_R = 30;                     // 曲柄半径
  var CRANK_MS = 1150;                  // 曲柄每圈毫秒
  var WHEEL_MS = 852;                   // 车轮每圈毫秒（视觉传动比 ≈1.35）
  var WHEEL_R = 72;                     // 车轮外半径
  var W = 960;

  var HIPS = { near: { x: 398, y: 224 }, far: { x: 390, y: 216 } };
  var LEN = { near: [88, 96], far: [84, 94] };   // [大腿, 小腿]
  var BOB = 1.6;                        // 身体起伏幅度(px)

  // ---- 元素 ----
  var el = {};
  ["Lc", "Lhf", "Lhn", "Ltr", "Ltu", "Lda", "spA", "spB", "cf", "cn", "pF", "pN",
   "farThigh", "farShin", "farKnee", "farFoot",
   "nearThigh", "nearShin", "nearKnee", "nearFoot",
   "rider", "bird1", "bird2"].forEach(function (id) { el[id] = document.getElementById(id); });

  // 视差层：像素/毫秒 与 图案周期(px)
  var layers = [
    { g: el.Lc,  s: 0.020, p: 640 },
    { g: el.Lhf, s: 0.090, p: 520 },
    { g: el.Lhn, s: 0.150, p: 460 },
    { g: el.Ltr, s: 0.260, p: 380 },
    { g: el.Ltu, s: 0.400, p: 170 }
  ];
  var dash = { g: el.Lda, s: (2 * Math.PI * WHEEL_R) / WHEEL_MS, p: 300 };

  // 两段式腿部逆运动学：从髋关节解出膝关节（膝盖统一向前上方弯曲）
  function ik(hx, hy, fx, fy, L1, L2) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-3) { return { kx: hx, ky: hy - L1 }; }
    if (d > L1 + L2 - 1) { d = L1 + L2 - 1; }
    var ux = dx / Math.sqrt(dx * dx + dy * dy);
    var uy = dy / Math.sqrt(dx * dx + dy * dy);
    var cosC = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    if (cosC > 1) cosC = 1; else if (cosC < -1) cosC = -1;
    var c = Math.acos(cosC);
    // 以方向角减去 c，使膝盖抬起(绕髋向前上)
    var kx = hx + L1 * (ux * Math.cos(c) + uy * Math.sin(c));
    var ky = hy + L1 * (uy * Math.cos(c) - ux * Math.sin(c));
    return { kx: kx, ky: ky };
  }

  function pose(t) {
    var crDeg = (t % CRANK_MS) / CRANK_MS * 360;      // 曲柄角
    var whDeg = (t % WHEEL_MS) / WHEEL_MS * 360;      // 车轮角
    var rad = crDeg * Math.PI / 180;

    el.spA.setAttribute("transform", "rotate(" + whDeg + ")");
    el.spB.setAttribute("transform", "rotate(" + whDeg + ")");
    el.cf.setAttribute("transform", "rotate(" + crDeg + " 450 352)");
    el.cn.setAttribute("transform", "rotate(" + crDeg + " 450 352)");
    el.pF.setAttribute("transform", "rotate(" + (-crDeg) + ")");
    el.pN.setAttribute("transform", "rotate(" + (-crDeg) + ")");

    // 踏板位置（近侧在 +30 方向，远侧在 -30 方向）
    var pN = { x: BB.x + CRANK_R * Math.cos(rad),      y: BB.y + CRANK_R * Math.sin(rad) };
    var pF = { x: BB.x - CRANK_R * Math.cos(rad),      y: BB.y - CRANK_R * Math.sin(rad) };

    // 身体起伏：每圈两次
    var bob = Math.sin(2 * rad) * BOB;
    el.rider.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");

    var hyN = HIPS.near.y + bob, hyF = HIPS.far.y + bob;
    var kn = ik(HIPS.near.x, hyN, pN.x, pN.y, LEN.near[0], LEN.near[1]);
    var kf = ik(HIPS.far.x,  hyF, pF.x, pF.y, LEN.far[0],  LEN.far[1]);

    el.nearThigh.setAttribute("x2", kn.kx.toFixed(1)); el.nearThigh.setAttribute("y2", kn.ky.toFixed(1));
    el.nearShin.setAttribute("x1", kn.kx.toFixed(1));  el.nearShin.setAttribute("y1", kn.ky.toFixed(1));
    el.nearShin.setAttribute("x2", pN.x.toFixed(1));   el.nearShin.setAttribute("y2", pN.y.toFixed(1));
    el.nearKnee.setAttribute("cx", kn.kx.toFixed(1));  el.nearKnee.setAttribute("cy", kn.ky.toFixed(1));
    el.nearFoot.setAttribute("cx", pN.x.toFixed(1));   el.nearFoot.setAttribute("cy", pN.y.toFixed(1));

    el.farThigh.setAttribute("x2", kf.kx.toFixed(1)); el.farThigh.setAttribute("y2", kf.ky.toFixed(1));
    el.farShin.setAttribute("x1", kf.kx.toFixed(1));  el.farShin.setAttribute("y1", kf.ky.toFixed(1));
    el.farShin.setAttribute("x2", pF.x.toFixed(1));   el.farShin.setAttribute("y2", pF.y.toFixed(1));
    el.farKnee.setAttribute("cx", kf.kx.toFixed(1));  el.farKnee.setAttribute("cy", kf.ky.toFixed(1));
    el.farFoot.setAttribute("cx", pF.x.toFixed(1));   el.farFoot.setAttribute("cy", pF.y.toFixed(1));

    // 视差滚动
    layers.forEach(function (L) {
      L.g.setAttribute("transform", "translate(" + (-((L.s * t) % L.p)).toFixed(2) + " 0)");
    });
    dash.g.setAttribute("transform", "translate(" + (-((dash.s * t) % dash.p)).toFixed(2) + " 0)");

    // 远方小鸟
    var bx1 = (W + 90) - ((t * 0.045) % (W + 180));
    el.bird1.setAttribute("transform", "translate(" + bx1.toFixed(1) + " 168)");
    var bx2 = (W + 170) - (((t + 5600) * 0.045) % (W + 180));
    el.bird2.setAttribute("transform", "translate(" + bx2.toFixed(1) + " 118)");
  }

  // ---- 主循环（可暂停） ----
  var running = true;
  var t = 0, last = 0;

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    running = false;                       // 尊重“减少动态”偏好：静止初始画面
    state.textContent = "已按系统偏好静止 · 点击画面开始";
  }

  pose(0);   // 保证初始一帧与静态画面一致

  function frame(now) {
    if (!running) { last = 0; return; }
    if (!last) last = now;
    var dt = Math.min(64, now - last);
    last = now;
    t += dt;
    pose(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  svg.addEventListener("click", function () {
    running = !running;
    last = 0;
    if (running) {
      state.textContent = "骑行中 —— 点击画面暂停 / 继续";
      state.classList.remove("paused");
      requestAnimationFrame(frame);
    } else {
      state.textContent = "已暂停 —— 点击画面继续";
      state.classList.add("paused");
    }
  });
})();
</script>
</body>
</html>
