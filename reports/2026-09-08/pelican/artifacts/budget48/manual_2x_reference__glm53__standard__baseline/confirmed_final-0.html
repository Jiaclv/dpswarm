<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2b3a4a 0%, #16202b 100%);
    font-family: system-ui, sans-serif;
  }
  svg {
    width: min(96vw, 1100px);
    height: auto;
    border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">鹈鹕骑自行车</title>
  <desc id="d">一只白色鹈鹕骑着红色自行车向右行驶，车轮旋转、双腿蹬踏、围巾飘动，背景云朵与道路向后滚动。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6f2"/>
      <stop offset="1" stop-color="#eaf7fd"/>
    </linearGradient>
    <g id="cloud" fill="#ffffff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="46" ry="20"/>
      <ellipse cx="-32" cy="6" rx="30" ry="14"/>
      <ellipse cx="34" cy="7" rx="34" ry="15"/>
      <ellipse cx="4" cy="-12" rx="28" ry="14"/>
    </g>
    <g id="cloud2" fill="#ffffff" opacity="0.8">
      <ellipse cx="0" cy="0" rx="30" ry="13"/>
      <ellipse cx="-22" cy="4" rx="20" ry="10"/>
      <ellipse cx="24" cy="5" rx="22" ry="10"/>
    </g>
    <g id="tuft" stroke="#4e9440" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 0 C -2 -12 -8 -16 -10 -22"/>
      <path d="M0 0 C 0 -14 2 -18 1 -26"/>
      <path d="M0 0 C 3 -12 8 -15 11 -20"/>
    </g>
    <g id="flower">
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#4e9440" stroke-width="2"/>
      <circle cy="-17" r="4" fill="#f2b6c9"/>
      <circle cy="-17" r="1.6" fill="#f9de58"/>
    </g>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect x="0" y="0" width="900" height="620" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="770" cy="95" r="58" fill="#ffd876" opacity="0.35">
      <animate attributeName="r" values="54;62;54" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="95" r="42" fill="#ffd876"/>
    <circle cx="770" cy="95" r="34" fill="#ffe49a"/>
  </g>

  <!-- 云（两层视差） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="70s" repeatCount="indefinite"/>
    <use href="#cloud" transform="translate(180,95)"/>
    <use href="#cloud" transform="translate(1580,95)"/>
    <use href="#cloud2" transform="translate(1050,55)"/>
    <use href="#cloud2" transform="translate(2450,55)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="42s" repeatCount="indefinite"/>
    <use href="#cloud2" transform="translate(560,160)"/>
    <use href="#cloud2" transform="translate(1960,160)"/>
  </g>

  <!-- 远山（视差滚动，周期 450） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="26s" repeatCount="indefinite"/>
    <g fill="#c4e3a6">
      <ellipse cx="150" cy="545" rx="260" ry="95"/><ellipse cx="600" cy="545" rx="260" ry="95"/>
      <ellipse cx="1050" cy="545" rx="260" ry="95"/><ellipse cx="1500" cy="545" rx="260" ry="95"/>
    </g>
    <g fill="#aed790">
      <ellipse cx="375" cy="555" rx="300" ry="105"/><ellipse cx="825" cy="555" rx="300" ry="105"/>
      <ellipse cx="1275" cy="555" rx="300" ry="105"/><ellipse cx="1725" cy="555" rx="300" ry="105"/>
    </g>
  </g>

  <!-- ============ 公路 ============ -->
  <rect x="0" y="520" width="900" height="75" fill="#5c6b77"/>
  <rect x="0" y="520" width="900" height="6" fill="#47535e"/>
  <g fill="#f2e6c9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-144 0" dur="0.3s" repeatCount="indefinite"/>
    <rect x="0" y="553" width="54" height="7" rx="3"/><rect x="144" y="553" width="54" height="7" rx="3"/>
    <rect x="288" y="553" width="54" height="7" rx="3"/><rect x="432" y="553" width="54" height="7" rx="3"/>
    <rect x="576" y="553" width="54" height="7" rx="3"/><rect x="720" y="553" width="54" height="7" rx="3"/>
    <rect x="864" y="553" width="54" height="7" rx="3"/><rect x="1008" y="553" width="54" height="7" rx="3"/>
  </g>
  <rect x="0" y="595" width="900" height="25" fill="#63aa58"/>

  <!-- 路边草丛/野花（前景快速滚动，周期 900） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="1.5s" repeatCount="indefinite"/>
    <use href="#tuft" x="40" y="612"/><use href="#tuft" x="265" y="614"/><use href="#tuft" x="490" y="611"/>
    <use href="#tuft" x="715" y="613"/><use href="#tuft" x="940" y="612"/><use href="#tuft" x="1165" y="614"/>
    <use href="#tuft" x="1390" y="611"/><use href="#tuft" x="1615" y="613"/>
    <use href="#flower" x="150" y="612"/><use href="#flower" x="600" y="614"/>
    <use href="#flower" x="1050" y="612"/><use href="#flower" x="1500" y="614"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M210 250 h80" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" keyTimes="0;.3;1" dur="0.55s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="60 0;-140 0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M170 320 h95" opacity="0">
      <animate attributeName="opacity" values="0;.7;0" keyTimes="0;.3;1" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="60 0;-140 0" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
    </path>
    <path d="M225 395 h70" opacity="0">
      <animate attributeName="opacity" values="0;.75;0" keyTimes="0;.3;1" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="60 0;-140 0" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 车影 -->
  <ellipse cx="445" cy="524" rx="250" ry="9" fill="#000" opacity="0.14"/>

  <!-- ============ 鹈鹕 + 自行车（整体上下颠簸） ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4; 0 0" keyTimes="0;0.5;1" calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="1.1s" repeatCount="indefinite"/>

    <!-- 远侧腿（暗色，半周期相位差） -->
    <g>
      <path d="M400 335 L400 403" stroke="#b96f1d" stroke-width="16" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-50.2 400 335;-18.9 400 335;-32.3 400 335;-58.6 400 335;-50.2 400 335"
          keyTimes="0;0.25;0.5;0.75;1" calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
          dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M400 403 L400 471" stroke="#a35f15" stroke-width="10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="63.1 400 403;24.8 400 403;71.8 400 403;97.9 400 403;63.1 400 403"
          keyTimes="0;0.25;0.5;0.75;1" calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
          dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 远侧曲柄 + 踏板 + 远侧脚（反向旋转保持水平） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 415 445" to="360 415 445" dur="2.2s" repeatCount="indefinite"/>
      <path d="M415 445 L393 445" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 393 445" to="-360 393 445" dur="2.2s" repeatCount="indefinite"/>
        <rect x="381" y="440" width="24" height="9" rx="3" fill="#1c1c1c"/>
        <path d="M379 441 c 7 -10 22 -10 28 -1 l 3 2 h -31 z" fill="#c9761e"/>
      </g>
    </g>

    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="458" r="62" fill="none" stroke="#2e2e2e" stroke-width="11"/>
      <circle cx="300" cy="458" r="48" fill="none" stroke="#b9bec4" stroke-width="4"/>
      <g stroke="#c9ced4" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 300 458" to="360 300 458" dur="0.9s" repeatCount="indefinite"/>
        <line x1="300" y1="458" x2="346" y2="458"/><line x1="300" y1="458" x2="332.5" y2="490.5"/>
        <line x1="300" y1="458" x2="300" y2="504"/><line x1="300" y1="458" x2="267.5" y2="490.5"/>
        <line x1="300" y1="458" x2="254" y2="458"/><line x1="300" y1="458" x2="267.5" y2="425.5"/>
        <line x1="300" y1="458" x2="300" y2="412"/><line x1="300" y1="458" x2="332.5" y2="425.5"/>
        <rect x="296" y="416" width="5" height="10" fill="#8a8f95" stroke="none"/>
      </g>
      <circle cx="300" cy="458" r="7" fill="#3a3a3a"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="590" cy="458" r="62" fill="none" stroke="#2e2e2e" stroke-width="11"/>
      <circle cx="590" cy="458" r="48" fill="none" stroke="#b9bec4" stroke-width="4"/>
      <g stroke="#c9ced4" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 590 458" to="360 590 458" dur="0.9s" repeatCount="indefinite"/>
        <line x1="590" y1="458" x2="636" y2="458"/><line x1="590" y1="458" x2="622.5" y2="490.5"/>
        <line x1="590" y1="458" x2="590" y2="504"/><line x1="590" y1="458" x2="557.5" y2="490.5"/>
        <line x1="590" y1="458" x2="546" y2="458"/><line x1="590" y1="458" x2="557.5" y2="425.5"/>
        <line x1="590" y1="458" x2="590" y2="412"/><line x1="590" y1="458" x2="622.5" y2="425.5"/>
        <rect x="586" y="416" width="5" height="10" fill="#8a8f95" stroke="none"/>
      </g>
      <circle cx="590" cy="458" r="7" fill="#3a3a3a"/>
    </g>

    <!-- 车架 -->
    <path d="M300 458 L415 445 L388 333 M300 458 L388 335 M415 445 L548 340 L390 336 M548 340 L590 458 M548 340 L541 300"
          fill="none" stroke="#e05656" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 链条（滚动虚线）+ 齿盘 -->
    <line x1="300" y1="447" x2="415" y2="424" stroke="#3a3a3a" stroke-width="4" stroke-dasharray="7 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="469" x2="415" y2="466" stroke="#3a3a3a" stroke-width="4" stroke-dasharray="7 4">
      <animate attributeName="stroke-dashoffset" from="0" to="22" dur="0.15s" repeatCount="indefinite"/>
    </line>
    <circle cx="300" cy="458" r="9" fill="none" stroke="#4a4a4a" stroke-width="4"/>
    <circle cx="415" cy="445" r="20" fill="none" stroke="#4a4a4a" stroke-width="5"/>
    <circle cx="415" cy="445" r="6" fill="#4a4a4a"/>

    <!-- 近侧曲柄 + 踏板 + 近侧脚 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 415 445" to="360 415 445" dur="2.2s" repeatCount="indefinite"/>
      <path d="M415 445 L437 445" stroke="#3d3d3d" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 437 445" to="-360 437 445" dur="2.2s" repeatCount="indefinite"/>
        <rect x="425" y="440" width="24" height="9" rx="3" fill="#262626"/>
        <path d="M423 441 c 7 -10 22 -10 28 -1 l 3 2 h -31 z" fill="#e8892b"/>
      </g>
    </g>

    <!-- 车座 -->
    <rect x="358" y="318" width="54" height="12" rx="6" fill="#4a4a52"/>

    <!-- 近侧腿 -->
    <g>
      <path d="M400 335 L400 403" stroke="#e8892b" stroke-width="17" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-50.2 400 335;-18.9 400 335;-32.3 400 335;-58.6 400 335;-50.2 400 335"
          keyTimes="0;0.25;0.5;0.75;1" calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
          dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M400 403 L400 471" stroke="#e8892b" stroke-width="11" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="63.1 400 403;24.8 400 403;71.8 400 403;97.9 400 403;63.1 400 403"
          keyTimes="0;0.25;0.5;0.75;1" calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
          dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ============ 鹈鹕 ============ -->
    <!-- 尾羽 -->
    <path d="M336 268 L282 240 L297 261 L266 269 L301 283 L286 301 L342 291 Z"
          fill="#ecece0" stroke="#dcdcd0" stroke-width="2" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="402" cy="264" rx="86" ry="60" fill="#fbfbf3" stroke="#e3e3d7" stroke-width="2" transform="rotate(-4 402 264)"/>
    <ellipse cx="396" cy="288" rx="66" ry="34" fill="#f4f4ea"/>

    <!-- 翅膀（轻扑） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 442 244;-9 442 244;2 442 244;0 442 244" keyTimes="0;0.35;0.7;1"
        dur="1.1s" repeatCount="indefinite"/>
      <path d="M442 238 C 468 231 476 250 460 262 C 446 274 420 281 394 285 L 344 291 L 356 277 L 340 275 L 358 265 L 346 257 C 380 245 418 237 442 238 Z"
            fill="#f3f3e8" stroke="#dcdcd0" stroke-width="2" stroke-linejoin="round"/>
      <path d="M360 272 C 390 268 416 262 440 252 M366 282 C 396 278 420 273 444 263"
            fill="none" stroke="#dcdcd0" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 头颈组（轻微摆动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 466 246;1.8 466 246;0 466 246;-1.2 466 246;0 466 246"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
      <!-- 脖子 -->
      <path d="M462 250 C 496 246 492 204 502 176" fill="none" stroke="#fbfbf3" stroke-width="30" stroke-linecap="round"/>
      <!-- 围巾（飘动） -->
      <path fill="none" stroke="#e35d5d" stroke-width="11" stroke-linecap="round"
            d="M476 224 C 446 212 420 218 396 206 C 402 224 378 220 358 210 C 366 228 342 226 320 218">
        <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
          values="M476 224 C 446 212 420 218 396 206 C 402 224 378 220 358 210 C 366 228 342 226 320 218;
                  M476 224 C 448 228 418 204 392 214 C 404 210 376 226 354 220 C 366 212 344 230 318 212;
                  M476 224 C 446 212 420 218 396 206 C 402 224 378 220 358 210 C 366 228 342 226 320 218"/>
      </path>
      <circle cx="476" cy="224" r="7.5" fill="#d64545"/>
      <!-- 喉囊（晃动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 522 160;2.5 522 160;0 522 160;-2 522 160;0 522 160"
          keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" repeatCount="indefinite"/>
        <path d="M516 166 C 516 196 540 216 570 212 C 598 208 614 190 622 170 C 588 175 548 173 516 166 Z"
              fill="#f6b733" stroke="#e0942a" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <!-- 上喙 -->
      <path d="M514 146 C 556 142 600 152 632 165 C 636 167 635 172 629 172 C 598 170 552 169 516 168 C 508 162 508 152 514 146 Z"
            fill="#f2a13c" stroke="#d9862b" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M536 153 L548 155" stroke="#d9862b" stroke-width="2" stroke-linecap="round"/>
      <!-- 头 + 冠羽 + 眼睛 -->
      <circle cx="506" cy="168" r="25" fill="#fbfbf3" stroke="#e3e3d7" stroke-width="2"/>
      <path d="M490 150 L479 130 L495 141 L494 122 L506 139 L511 125 L515 147 Z"
            fill="#e9e9df" stroke="#dcdcd0" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="514" cy="160" r="5" fill="#2b2b33"/>
      <circle cx="516" cy="158" r="1.7" fill="#ffffff"/>
    </g>

    <!-- 车把 + 车筐（鱼探头） -->
    <path d="M524 297 C 534 290 550 290 559 297" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <circle cx="524" cy="297" r="4.5" fill="#222"/><circle cx="559" cy="297" r="4.5" fill="#222"/>
    <path d="M528 299 L560 318 M556 299 L584 318" stroke="#8a6a3f" stroke-width="3"/>
    <path d="M556 318 L602 318 L596 348 L562 348 Z" fill="#c98d4e" stroke="#a86f38" stroke-width="3" stroke-linejoin="round"/>
    <path d="M559 328 L599 328 M560 338 L598 338 M570 318 L569 348 M588 318 L589 348" stroke="#a86f38" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 579 318;4 579 318;-4 579 318" dur="0.9s" repeatCount="indefinite"/>
      <ellipse cx="579" cy="310" rx="15" ry="7" fill="#8fc3e3"/>
      <path d="M592 308 l 12 -6 l -2 12 z" fill="#74a9cf"/>
      <circle cx="570" cy="308" r="1.8" fill="#223344"/>
    </g>
  </g>

  <!-- 后轮扬尘 -->
  <g fill="#cfc6b8">
    <circle cx="250" cy="508" r="4" opacity="0">
      <animateMotion path="M0 0 C -20 -10 -45 -18 -75 -30" dur="1.3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" keyTimes="0;.2;1" dur="1.3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;9" dur="1.3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="508" r="4" opacity="0">
      <animateMotion path="M0 0 C -20 -10 -45 -18 -75 -30" dur="1.3s" begin="0.43s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" keyTimes="0;.2;1" dur="1.3s" begin="0.43s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;9" dur="1.3s" begin="0.43s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="508" r="4" opacity="0">
      <animateMotion path="M0 0 C -20 -10 -45 -18 -75 -30" dur="1.3s" begin="0.86s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" keyTimes="0;.2;1" dur="1.3s" begin="0.86s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;9" dur="1.3s" begin="0.86s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="880" y="612" text-anchor="end" font-size="16" fill="#3f5a6a" opacity="0.8"
        font-family="'Comic Sans MS','Segoe UI',system-ui,sans-serif">🚴 鹈鹕骑行号</text>
</svg>
</body>
</html>
