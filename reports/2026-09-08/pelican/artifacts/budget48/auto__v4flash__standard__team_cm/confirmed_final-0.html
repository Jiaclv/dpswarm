<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bike - SVG Animation</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #bfe3ff 0%, #e9f6ff 55%, #fdf6ea 100%);
    background-attachment: fixed;
    padding: 26px 14px 40px;
  }
  header { text-align: center; margin-bottom: 18px; }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 3.4vw, 2.4rem);
    color: #1f4e79;
    letter-spacing: .5px;
  }
  .tagline {
    margin: 6px 0 0;
    color: #5c7f9d;
    font-size: .98rem;
  }
  .stage {
    width: min(1180px, 96vw);
    background: linear-gradient(180deg, #cfeaff, #eef9ff 70%);
    border-radius: 18px;
    box-shadow: 0 18px 42px rgba(38, 90, 133, .25), 0 3px 10px rgba(38, 90, 133, .12);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .7);
  }
  .stage svg { display: block; width: 100%; height: auto; }
  footer {
    margin-top: 14px;
    font-size: .82rem;
    color: #7191ab;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Pelican on a Bike</h1>
  <p class="tagline">A wobbly SVG ride &mdash; pedaling legs, spinning wheels, flapping wings, no libraries at all.</p>
</header>

<script>

  var GEAR = 2.44, WHEEL_R = 110;                // drive ratio + wheel radius
  var CADENCE = 2 * Math.PI * 0.8;               // 0.8 crank rev/s (48 rpm)
  var Hx = 585, Hy = 312, L1 = 118, L2 = 112;    // hip + thigh + shin

  var spokesRear = document.getElementById("spokesRear");
  var spokesFront = document.getElementById("spokesFront");
  var crankNear = document.getElementById("crankNear");
  var crankFar = document.getElementById("crankFar");
  var chainDots = document.getElementById("chainDots");
  var dashG = document.getElementById("dashG");
  var chainP = document.getElementById("chainP");
  var legNear = document.getElementById("legNear");
  var legFar = document.getElementById("legFar");
  var footNear = document.getElementById("footNear");
  var footFar = document.getElementById("footFar");
  var wingNear = document.getElementById("wingNear");
  var wingFar = document.getElementById("wingFar");
  var tailG = document.getElementById("tailG");

  var reduced = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var speed = reduced ? 0.12 : 1;
  var t0 = null;

  // pedal world position for a crank phase
  function footXY(phi) {
    return { x: BBx + CRANK * Math.sin(phi), y: BBy - CRANK * Math.cos(phi) };
  }

  // two-link IK: returns knee for hip -> ankle reach, knee bent forward (+x)
  function knee(Fx, Fy) {
    var dx = Fx - Hx, dy = Fy - Hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 40) { d = 40; }
    if (d > 230) { d = 230; }
    var a = (L1 * L1 + d * d - L2 * L2) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var ux = dx / d, uy = dy / d;
    var px = -uy, py = ux;
    if (px < 0) { px = -px; py = -py; }
    return { x: Hx + ux * a + px * h, y: Hy + uy * a + py * h };
  }

  function applyLeg(legEl, footEl, phi) {
    var F = footXY(phi);
    var Ax = F.x + 2, Ay = F.y - 8;              // ankle just above the pedal
    var K = knee(Ax, Ay);
    legEl.setAttribute("d",
      "M" + Hx + "," + Hy +
      " L" + K.x.toFixed(1) + "," + K.y.toFixed(1) +
      " L" + Ax.toFixed(1) + "," + Ay.toFixed(1));
    footEl.setAttribute("points",
      (F.x - 13) + "," + (F.y + 6) + " " +
      (F.x + 15) + "," + (F.y + 3) + " " +
      (F.x + 1) + "," + (F.y - 9));
  }

  function frame(now) {
    if (t0 === null) { t0 = now; }
    var t = (now - t0) / 1000 * speed;
    var th = CADENCE * t;                        // crank angle
    var deg = th * 180 / Math.PI;
    var wheelDeg = th * GEAR * 180 / Math.PI;

    spokesRear.setAttribute("transform", "rotate(" + wheelDeg + ")");
    spokesFront.setAttribute("transform", "rotate(" + wheelDeg + ")");
    crankNear.setAttribute("transform", "rotate(" + deg + ")");
    crankFar.setAttribute("transform", "rotate(" + (deg + 180) + ")");
    chainDots.setAttribute("transform", "rotate(" + deg + ")");

    // ground scroll tied to the wheel so spokes and dashes stay in sync
    var road = th * GEAR * WHEEL_R;
    dashG.setAttribute("transform", "translate(" + (-(road % 1200)) + ",0)");
    chainP.setAttribute("stroke-dashoffset", (-((th * CRANK) % 9)));

    // legs pedal in opposite phases
    applyLeg(legFar, footFar, th + Math.PI);
    applyLeg(legNear, footNear, th);

    // wings flap; far wing lags a little behind the near one
    var w = -8 + 24 * Math.sin(6.283 * 1.3 * t);
    wingNear.setAttribute("transform", "rotate(" + w + ")");
    wingFar.setAttribute("transform", "rotate(" + (w - 14) + ")");

    // little tail wiggle, twice per pedal revolution
    tailG.setAttribute("transform", "rotate(" + (3.5 * Math.sin(2 * th)) + ",540,300)");

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
