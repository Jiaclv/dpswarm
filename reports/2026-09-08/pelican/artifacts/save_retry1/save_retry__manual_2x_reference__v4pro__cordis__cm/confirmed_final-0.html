            fill="#f7952b" stroke="#e07a10" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M530,198 Q556,212 596,202 Q610,210 606,222 Q588,234 560,228 Q540,222 530,198 Z"
            fill="#ff7c3f" opacity=".95" stroke="#e8661f" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 近侧腿（身体之前绘制） -->
  <path id="legN" d="M368,336 L408.5,408 L441,488"
        fill="none" stroke="#f4a23e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 近侧脚踏 -->
  <g id="pedalN" transform="translate(441 488)">
    <rect x="-17" y="-4.5" width="34" height="9" rx="3" fill="#2b2f36" stroke="#171a1f" stroke-width="1.5"/>
    <path d="M -16 0 C -10 -6 -2 -8 8 -4 C 14 -2 20 -1 26 -1 C 20 2 16 2 12 3
             C 16 6 20 7 24 7 C 18 8 14 8 10 7 C 12 10 14 12 15 13
             C 8 14 2 12 -6 8 C -12 5 -16 3 -16 0 Z"
          fill="#f4a23e" stroke="#c97a1c" stroke-width="1.5"/>
  </g>

  <!-- 口哨音符 -->
  <text id="note1" x="0" y="0" font-size="30" fill="#8a6be8" stroke="#ffffff" stroke-width="5"
        paint-order="stroke" opacity="0">&#9834;</text>
  <text id="note2" x="0" y="0" font-size="30" fill="#8a6be8" stroke="#ffffff" stroke-width="5"
        paint-order="stroke" opacity="0">&#9834;</text>

  <!-- 标题 -->
  <text x="28" y="60" font-size="30" font-weight="700" fill="#2b5d80" stroke="#ffffff" stroke-width="7"
        paint-order="stroke" stroke-linejoin="round">Pelican Ride</text>
  <text x="30" y="88" font-size="15" font-weight="600" fill="#3f7399" stroke="#ffffff" stroke-width="5"
        paint-order="stroke" stroke-linejoin="round">鹈鹕骑自行车 · 纯 SVG 2D 动画</text>
</svg>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var spokesR = $('spokeR'), spokesF = $('spokeF'), crankG = $('crankG'),
      pedalF = $('pedalF'), pedalN = $('pedalN'), legF = $('legF'), legN = $('legN'),
      bodyG = $('bodyG'), tailG = $('tailG'), wingG = $('wingG'), jawG = $('jawG'),
      scarf = $('scarf'), eyeG = $('eyeG'), sunRays = $('sunRays'), sunGlow = $('sunGlow'),
      cloud1 = $('cloud1'), cloud2 = $('cloud2'), cloud3 = $('cloud3'),
      birdG = $('birdG'), bush1 = $('bush1'), bush2 = $('bush2'),
      bush3 = $('bush3'), bush4 = $('bush4'),
      f1 = $('f1'), f2 = $('f2'), f3 = $('f3'),
      dashLine = $('dashLine'), mot1 = $('mot1'), mot2 = $('mot2'),
      note1 = $('note1'), note2 = $('note2'), shadow = $('shadow');

  var R = 52;                 // 车轮半径
  var BB = { x: 415, y: 488 }; // 中轴
  var HIP = { x: 368, y: 336 }; // 髋关节
  var wW = 3.1;               // 车轮角速度 rad/s
  var wC = 4.0;               // 曲柄角速度 rad/s
  var v = wW * R;             // 前进速度 px/s
  var deg = 180 / Math.PI;

  var mod = function (x, m) { return ((x % m) + m) % m; };
  var clamp01 = function (x) { return Math.min(1, Math.max(0, x)); };

  // 根据髋关节与脚踏位置计算腿部折线（膝盖前凸）
  function legD(hip, p) {
    var dx = p.x - hip.x, dy = p.y - hip.y, L = Math.hypot(dx, dy);
    var bend = clamp01((L - 118) / 40);
    var b = 18 - 14 * bend;
    return 'M' + hip.x + ',' + hip.y + ' L' + (hip.x + dx / 2 + b).toFixed(1) + ',' +
           (hip.y + dy / 2 - b).toFixed(1) + ' L' + p.x + ',' + p.y;
  }

  function render(t) {
    var aW = wW * t, aC = wC * t;
    var rA = mod(aW * deg, 360);

    spokesR.setAttribute('transform', 'rotate(' + rA + ' 270 488)');
    spokesF.setAttribute('transform', 'rotate(' + rA + ' 565 488)');
    crankG.setAttribute('transform', 'rotate(' + mod(aC * deg, 360) + ' 415 488)');

    // 近侧脚踏 = 曲柄 +x 端；远侧 = 对侧
    var p1 = { x: BB.x + 26 * Math.cos(aC), y: BB.y + 26 * Math.sin(aC) };
    var p2 = { x: BB.x - 26 * Math.cos(aC), y: BB.y - 26 * Math.sin(aC) };
    pedalN.setAttribute('transform', 'translate(' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) + ')');
    pedalF.setAttribute('transform', 'translate(' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1) + ')');

    // 每转两下起伏一次，身体随之上下+微倾
    var bob = 3 * Math.sin(2 * aC);
    var hip = { x: HIP.x, y: HIP.y + bob };
    legN.setAttribute('d', legD(hip, p1));
    legF.setAttribute('d', legD(hip, p2));
    bodyG.setAttribute('transform',
      'translate(0 ' + bob.toFixed(2) + ') rotate(' + (1.6 * Math.sin(2 * aC)).toFixed(2) + ' 368 336)');

    // 喙张合（哼歌式）
    jawG.setAttribute('transform',
      'rotate(' + (9 * Math.max(0, Math.sin(6.2832 * 0.55 * t + 0.7))).toFixed(2) + ' 527 188)');
    // 尾巴、翅膀
    tailG.setAttribute('transform', 'rotate(' + (4 * Math.sin(aC - 0.9)).toFixed(2) + ' 288 310)');
    wingG.setAttribute('transform', 'rotate(' + (3.5 * Math.sin(t * 2.9)).toFixed(2) + ' 360 296)');
    // 围巾
    scarf.setAttribute('d',
      'M441,247 Q' + (414 + 7 * Math.sin(t * 9.5)).toFixed(1) + ',' + (250 + 5 * Math.sin(t * 7.3 + 1)).toFixed(1) + ' ' +
      (408 + 8 * Math.sin(t * 8.2 + 2)).toFixed(1) + ',' + (260 + 5 * Math.sin(t * 9 + 0.5)).toFixed(1) +
      ' Q' + (418 + 6 * Math.sin(t * 7.6 + 0.4)).toFixed(1) + ',' + (252 + 4 * Math.sin(t * 8.8 + 1.8)).toFixed(1) + ' 441,259 Z');
    // 眨眼
    var blink = mod(t + 0.12, 3.6) < 0.13;
    eyeG.setAttribute('transform',
      'translate(516 170) scale(1 ' + (blink ? 0.12 : 1) + ') translate(-516 -170)');

    // 太阳
    sunRays.setAttribute('transform', 'rotate(' + mod(t * 8, 360).toFixed(2) + ' 830 110)');
    sunGlow.setAttribute('r', (92 + 6 * Math.sin(t * 1.3)).toFixed(1));

    // 云、鸟
    cloud1.setAttribute('transform', 'translate(' + (mod(140 - 14 * t, 1150) - 160).toFixed(1) + ' 80)');
    cloud2.setAttribute('transform', 'translate(' + (mod(620 - 10 * t, 1150) - 160).toFixed(1) + ' 150)');
    cloud3.setAttribute('transform', 'translate(' + (mod(900 - 20 * t, 1150) - 160).toFixed(1) + ' 235) scale(0.65)');
    birdG.setAttribute('transform', 'translate(' + (mod(320 - 30 * t, 1240) - 170).toFixed(1) + ' 95) scale(1 ' + (1 + 0.28 * Math.sin(t * 7)).toFixed(2) + ')');

    // 灌木、树、花（视差滚动）
    [[bush1, 60], [bush2, 420], [bush3, 780], [bush4, 1060]].forEach(function (b) {
      b[0].setAttribute('transform', 'translate(' + (mod(b[1] - 78 * t, 1360) - 180).toFixed(1) + ' 540)');
    });
    [[f1, 120, 512], [f2, 560, 506], [f3, 900, 514]].forEach(function (fl) {
      fl[0].setAttribute('transform', 'translate(' + (mod(fl[1] - 78 * t, 1000) - 40).toFixed(1) + ' ' + fl[2] + ')');
    });

    // 路面虚线（与轮速同步）
    dashLine.setAttribute('stroke-dashoffset', (-mod(v * t, 120)).toFixed(1));

    // 速度线
    mot1.setAttribute('x1', (186 - (34 + 14 * Math.sin(t * 12))).toFixed(1));
    mot1.setAttribute('opacity', (0.28 + 0.14 * Math.sin(t * 17)).toFixed(2));
    mot2.setAttribute('x1', (471 - (26 + 12 * Math.sin(t * 15 + 2))).toFixed(1));
    mot2.setAttribute('opacity', (0.24 + 0.14 * Math.sin(t * 19 + 1)).toFixed(2));

    // 影子随蹬踏微颤
    shadow.setAttribute('rx', (195 + 2.5 * Math.sin(2 * aC)).toFixed(1));

    // 音符（每 4 秒一轮，两个音符错开 2 秒）
    var p = mod(t, 4);
    var o1 = Math.sin(Math.PI * clamp01((p - 0.15) / 0.6));
    note1.setAttribute('opacity', (0.9 * o1).toFixed(2));
    note1.setAttribute('transform', 'translate(' + (652 + 16 * Math.max(0, p - 0.15)).toFixed(1) + ' ' + (150 - 46 * Math.max(0, p - 0.15)).toFixed(1) + ')');
    var p2 = mod(t + 2, 4);
    var o2 = Math.sin(Math.PI * clamp01((p2 - 0.15) / 0.6));
    note2.setAttribute('opacity', (0.9 * o2).toFixed(2));
    note2.setAttribute('transform', 'translate(' + (646 + 18 * Math.max(0, p2 - 0.15)).toFixed(1) + ' ' + (168 - 52 * Math.max(0, p2 - 0.15)).toFixed(1) + ')');
  }

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    render(1.2); // 只渲染一帧静态画面
    return;
  }
  var t0 = performance.now();
  (function loop(now) {
    render((now - t0) / 1000);
    requestAnimationFrame(loop);
  })(t0);
})();
</script>
</body>
</html>
